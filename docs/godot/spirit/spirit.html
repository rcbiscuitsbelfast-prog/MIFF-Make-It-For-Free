<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spirit (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>window.addEventListener('DOMContentLoaded',()=>{ try{ parent.postMessage({ type:'godot-ready', zone:'spirit' }, '*'); }catch{}; window.addEventListener('message',(e)=>{ if(e&&e.data&&e.data.type==='scene-data'){ const data=e.data.data||{}; bootGame(data.entities||[]); } }); setTimeout(async ()=>{ if(!window.__spiritBooted){ try{ const pre=await fetch('../../site/studio/presets/spirit.json').then(r=>r.json()); bootGame(pre.entities||[]); }catch{} } },1000); });
  function bootGame(entities){ if(window.__spiritBooted) return; window.__spiritBooted=true; const cvs=document.createElement('canvas'); Object.assign(cvs.style,{position:'absolute',inset:'0'}); document.body.appendChild(cvs); const ctx=cvs.getContext('2d'); const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; window.addEventListener('resize',fit); fit(); 
  const imgs=new Map(); const loadedImgs=new Set(); 
  function getImg(s){ if(!s) return null; if(imgs.has(s)) return imgs.get(s); const i=new Image(); i.onload=()=>{console.log('[Spirit] Loaded:',s); loadedImgs.add(s);}; i.onerror=()=>{console.error('[Spirit] Failed to load:',s);}; i.src=s; imgs.set(s,i); return i; } 
  const ents=entities.map(e=>({ ...e, frame:0, frameTime:0, frameRate:0.1 }));
  // minimal controls: move first sprite left/right, jump
  const keys={}; window.addEventListener('keydown',e=>keys[e.key]=true); window.addEventListener('keyup',e=>keys[e.key]=false);
  let last=performance.now(); let vy=0; const GRAV=900, JUMP=-360;
  function update(dt){ const p = ents.find(e=>e.type==='sprite') || ents[0]; if(!p) return; if(keys['ArrowLeft']) p.x -= 180*dt; if(keys['ArrowRight']) p.x += 180*dt; // simple floor
    vy += GRAV*dt; p.y += vy*dt; const floor=cvs.height-24-(p.h||32); if(p.y>floor){ p.y=floor; vy=0; } if(keys['ArrowUp'] && vy===0){ vy=JUMP; } 
    // Keep sprite on screen
    if (p.x < 0) p.x = 0;
    if (p.x + (p.w||32) > cvs.width) p.x = cvs.width - (p.w||32);
    if (p.y < 0) p.y = 0;
    // Animate sprite
    if (p.vx !== 0 || p.vy !== 0) { p.frameTime += dt; if(p.frameTime > p.frameRate){ p.frameTime=0; p.frame = (p.frame+1) % 4; } }
  }
  let t=0; function render(ts){ const dt=Math.min(0.033,(ts-last)/1000); last=ts; update(dt); ctx.fillStyle='#081018'; ctx.fillRect(0,0,cvs.width,cvs.height); t+=dt; 
  ents.forEach(e=>{ 
    const img=getImg(e.src); 
    if(img && img.complete && loadedImgs.has(e.src)){ 
      ctx.save(); 
      ctx.globalAlpha= e.name==='Spirit'? 0.8+0.2*Math.sin(t*2) : 1; 
      // Check if this is a sprite sheet (width > height suggests multiple frames)
      if(e.type==='sprite' && img.width > img.height && img.width > 64){
        // Sprite sheet slicing for character sprites
        const frameW = 32; 
        const frameH = 32;
        const frameX = (e.frame || 0) * frameW;
        const frameY = 0;
        ctx.drawImage(img, frameX, frameY, frameW, frameH, e.x, e.y, e.w, e.h);
        // Animate frames for sprites
        e.frameTime += dt; if(e.frameTime > e.frameRate){ e.frameTime=0; e.frame = (e.frame+1) % 4; }
      } else {
        // Single image - draw directly
        ctx.drawImage(img, e.x, e.y, e.w, e.h);
      }
      ctx.restore();
    } else { 
      // Debug overlay for failed loads
      ctx.fillStyle='#58a6ff33'; 
      ctx.fillRect(e.x,e.y,e.w,e.h); 
      ctx.strokeStyle='#ff4bc0'; 
      ctx.strokeRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.fillText(e.name||'?', e.x+2, e.y+12);
      if(img && !img.complete) ctx.fillText('Loading...', e.x+2, e.y+24);
    } 
  }); 
  requestAnimationFrame(render); }
  requestAnimationFrame(render); }
  </script>
</head>
<body>
  <div class="placeholder">Godot export goes here (spirit.wasm / spirit.pck)</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spirit (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>window.addEventListener('DOMContentLoaded',()=>{ try{ parent.postMessage({ type:'godot-ready', zone:'spirit' }, '*'); }catch{}; window.addEventListener('message',(e)=>{ if(e&&e.data&&e.data.type==='scene-data'){ const data=e.data.data||{}; bootGame(data.entities||[]); } }); setTimeout(async ()=>{ if(!window.__spiritBooted){ try{ const pre=await fetch('../../site/studio/presets/spirit.json').then(r=>r.json()); bootGame(pre.entities||[]); }catch{} } },1000); });
  function bootGame(entities){ if(window.__spiritBooted) return; window.__spiritBooted=true; const cvs=document.createElement('canvas'); Object.assign(cvs.style,{position:'absolute',inset:'0'}); document.body.appendChild(cvs); const ctx=cvs.getContext('2d'); const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; window.addEventListener('resize',fit); fit(); const imgs=new Map(); function getImg(s){ if(!s) return null; if(imgs.has(s)) return imgs.get(s); const i=new Image(); i.src=s; imgs.set(s,i); return i; } const ents=entities.map(e=>({ ...e })); let t=0; function render(){ ctx.fillStyle='#081018'; ctx.fillRect(0,0,cvs.width,cvs.height); t+=0.016; ents.forEach(e=>{ const img=getImg(e.src); if(img&&img.complete){ ctx.save(); ctx.globalAlpha= e.name==='Spirit'? 0.8+0.2*Math.sin(t*2) : 1; ctx.drawImage(img,e.x,e.y,e.w,e.h); ctx.restore(); } else { ctx.fillStyle='#58a6ff33'; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.strokeStyle='#58a6ff'; ctx.strokeRect(e.x,e.y,e.w,e.h); } }); requestAnimationFrame(render); } requestAnimationFrame(render); }
  </script>
</head>
<body>
  <div class="placeholder">Godot export goes here (spirit.wasm / spirit.pck)</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grove (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>window.addEventListener('DOMContentLoaded',()=>{ try{ parent.postMessage({ type:'godot-ready', zone:'grove' }, '*'); }catch{}; window.addEventListener('message',(e)=>{ if(e&&e.data&&e.data.type==='scene-data'){ const data=e.data.data||{}; bootGame(data.entities||[]); } }); setTimeout(async ()=>{ if(!window.__groveBooted){ try{ const pre=await fetch('../../site/studio/presets/grove.json').then(r=>r.json()); bootGame(pre.entities||[]); }catch{} } },1000); });
  function bootGame(entities){ if(window.__groveBooted) return; window.__groveBooted=true; const cvs=document.createElement('canvas'); Object.assign(cvs.style,{position:'absolute',inset:'0'}); document.body.appendChild(cvs); const ctx=cvs.getContext('2d'); const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; window.addEventListener('resize',fit); fit(); const imgs=new Map(); function getImg(s){ if(!s) return null; if(imgs.has(s)) return imgs.get(s); const i=new Image(); i.src=s; imgs.set(s,i); return i; } const ents=entities.map(e=>({ ...e }));
  // minimal controls: move first tile with arrows to confirm input
  const keys={}; window.addEventListener('keydown',e=>keys[e.key]=true); window.addEventListener('keyup',e=>keys[e.key]=false);
  let last=performance.now(); function update(dt){ const p=ents[0]; if(!p) return; const speed=140; if(keys['ArrowLeft']) p.x -= speed*dt; if(keys['ArrowRight']) p.x += speed*dt; if(keys['ArrowUp']) p.y -= speed*dt; if(keys['ArrowDown']) p.y += speed*dt; }
  let tick=0; function render(ts){ const dt=Math.min(0.033,(ts-last)/1000); last=ts; update(dt); ctx.fillStyle='#0a1322'; ctx.fillRect(0,0,cvs.width,cvs.height); tick++; ents.forEach(e=>{ const img=getImg(e.src); if(img&&img.complete){ ctx.drawImage(img,e.x,e.y,e.w,e.h); } else { ctx.fillStyle= (tick%40<20)? '#2ecc7133':'#58a6ff33'; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.strokeStyle='#58a6ff'; ctx.strokeRect(e.x,e.y,e.w,e.h); } }); requestAnimationFrame(render); }
  requestAnimationFrame(render); }
  </script>
</head>
<body>
  <div class="placeholder">Godot export goes here (grove.wasm / grove.pck)</div>
</body>
</html>

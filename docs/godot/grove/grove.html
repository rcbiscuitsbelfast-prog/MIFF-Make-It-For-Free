<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grove (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>window.addEventListener('DOMContentLoaded',()=>{ try{ parent.postMessage({ type:'godot-ready', zone:'grove' }, '*'); }catch{}; window.addEventListener('message',(e)=>{ if(e&&e.data&&e.data.type==='scene-data'){ const data=e.data.data||{}; bootGame(data.entities||[]); } }); setTimeout(async ()=>{ if(!window.__groveBooted){ try{ const pre=await fetch('../../site/studio/presets/grove.json').then(r=>r.json()); bootGame(pre.entities||[]); }catch{} } },1000); });
  function bootGame(entities){ if(window.__groveBooted) return; window.__groveBooted=true; const cvs=document.createElement('canvas'); Object.assign(cvs.style,{position:'absolute',inset:'0'}); document.body.appendChild(cvs); const ctx=cvs.getContext('2d'); const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; window.addEventListener('resize',fit); fit(); 
  const imgs=new Map(); const loadedImgs=new Set(); 
  function getImg(s){ if(!s) return null; if(imgs.has(s)) return imgs.get(s); const i=new Image(); i.onload=()=>{console.log('[Grove] Loaded:',s); loadedImgs.add(s);}; i.onerror=()=>{console.error('[Grove] Failed to load:',s);}; i.src=s; imgs.set(s,i); return i; } 
  const ents=entities.map(e=>({ ...e, frame:0, frameTime:0, frameRate:0.1 })); console.log('[Grove] Booted with entities:',ents);
  // minimal controls: move first sprite with arrows to confirm input
  const keys={}; window.addEventListener('keydown',e=>keys[e.key]=true); window.addEventListener('keyup',e=>keys[e.key]=false);
  let last=performance.now(); function update(dt){ const p=ents.find(e=>e.type==='sprite') || ents[0]; if(!p) return; const speed=140; if(keys['ArrowLeft']) p.x -= speed*dt; if(keys['ArrowRight']) p.x += speed*dt; if(keys['ArrowUp']) p.y -= speed*dt; if(keys['ArrowDown']) p.y += speed*dt; 
    // Keep sprite on screen
    if (p.x < 0) p.x = 0;
    if (p.x + (p.w||32) > cvs.width) p.x = cvs.width - (p.w||32);
    if (p.y < 0) p.y = 0;
    if (p.y + (p.h||32) > cvs.height) p.y = cvs.height - (p.h||32);
  }
  let tick=0; function render(ts){ const dt=Math.min(0.033,(ts-last)/1000); last=ts; update(dt); ctx.fillStyle='#0a1322'; ctx.fillRect(0,0,cvs.width,cvs.height); tick++; 
  ents.forEach(e=>{ 
    const img=getImg(e.src); 
    if(img && img.complete && loadedImgs.has(e.src)){ 
      // Sprite sheet slicing - assume 32x32 frames for character sprites
      const frameW = e.type==='sprite' ? 32 : e.w; 
      const frameH = e.type==='sprite' ? 32 : e.h;
      const frameX = (e.frame || 0) * frameW;
      const frameY = 0;
      ctx.drawImage(img, frameX, frameY, frameW, frameH, e.x, e.y, e.w, e.h);
      // Animate frames for sprites
      if(e.type==='sprite'){ e.frameTime += dt; if(e.frameTime > e.frameRate){ e.frameTime=0; e.frame = (e.frame+1) % 4; } }
    } else { 
      // Debug overlay for failed loads
      ctx.fillStyle= (tick%40<20)? '#2ecc7133':'#58a6ff33'; 
      ctx.fillRect(e.x,e.y,e.w,e.h); 
      ctx.strokeStyle='#58a6ff'; 
      ctx.strokeRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.fillText(e.name||'?', e.x+2, e.y+12);
      if(img && !img.complete) ctx.fillText('Loading...', e.x+2, e.y+24);
    } 
  }); 
  requestAnimationFrame(render); }
  requestAnimationFrame(render); }
  </script>
</head>
<body>
  <div class="placeholder">Godot export goes here (grove.wasm / grove.pck)</div>
</body>
</html>

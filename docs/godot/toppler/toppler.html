<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
  <title>Toppler (Godot Export Placeholder)</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #e6edf3; font-family: system-ui, sans-serif; }
  </style>
  <script>
    // Placeholder: In real export, Godot loader will boot and you can postMessage from GDScript
    window.addEventListener('DOMContentLoaded', function(){
      try { parent.postMessage({ type: 'godot-ready', zone: 'toppler' }, '*'); } catch {}
      // Render basic scene-data overlay rectangles to visualize preset
      window.addEventListener('message', (e)=>{
        if (e && e.data && e.data.type==='scene-data'){
          const data = e.data.data || {}; const ents = data.entities||[];
          bootGame(ents);
        }
      });
      // Fallback: autoload preset if no scene-data in 1s
      setTimeout(async ()=>{
        if (!window.__topplerBooted){ try { const pre = await fetch('../../site/studio/presets/toppler.json').then(r=>r.json()); bootGame(pre.entities||[]); } catch {} }
      }, 1000);
    });

    function bootGame(entities){
      if (window.__topplerBooted) return; window.__topplerBooted = true;
      const cvs = document.createElement('canvas'); Object.assign(cvs.style,{position:'absolute',inset:'0'}); document.body.appendChild(cvs); const ctx=cvs.getContext('2d');
      const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; window.addEventListener('resize',fit); fit();
      const imgs=new Map(); const loadedImgs=new Set(); function getImg(src){ if(!src) return null; if(imgs.has(src)) return imgs.get(src); const i=new Image(); i.onload=()=>{console.log('[Toppler] Loaded:',src); loadedImgs.add(src);}; i.onerror=()=>{console.error('[Toppler] Failed to load:',src);}; i.src=src; imgs.set(src,i); return i; }
      const ents = entities.map(e=>({ ...e, vx:0, vy:0, frame:0, frameTime:0, frameRate:0.1 }));
      // controls
      const keys={}; window.addEventListener('keydown',e=>keys[e.key]=true); window.addEventListener('keyup',e=>keys[e.key]=false);
      const GRAV=900, SPEED=180, JUMP=-360, FLOOR=cvs.height-20;
      function update(dt){
        // Only apply physics to player entities
        ents.forEach(e => {
          const isPlayer = (e.id||'').includes('player') || (e.name||'').toLowerCase().includes('player');
          if (isPlayer) {
            // Player physics
            if (keys['ArrowRight']) e.vx = SPEED; else if (keys['ArrowLeft']) e.vx = -SPEED; else e.vx = 0;
            if (keys['ArrowUp'] && e.y+e.h>=FLOOR) e.vy = JUMP;
            e.vy += GRAV*dt;
            e.x += e.vx*dt;
            e.y += e.vy*dt;
            // Keep player on screen
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y+e.h>FLOOR){ e.y=FLOOR-e.h; e.vy=0; }
            // Animate player
            if (e.vx !== 0) { e.frameTime += dt; if(e.frameTime > e.frameRate){ e.frameTime=0; e.frame = (e.frame+1) % 4; } }
          } else {
            // Non-player entities: keep on screen but no physics
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h > cvs.height) e.y = cvs.height - e.h;
          }
        });
      }
      function render(){ ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,cvs.width,cvs.height); 
      
      // Draw ground platforms first
      ctx.fillStyle='#8B4513'; // Brown for wood platforms
      ents.forEach(e => {
        if (e.type === 'tile' || (e.name && e.name.toLowerCase().includes('platform'))) {
          ctx.fillRect(e.x, e.y, e.w, e.h);
          ctx.strokeStyle='#654321';
          ctx.strokeRect(e.x, e.y, e.w, e.h);
        }
      });
      
      // Draw main ground
      ctx.fillStyle='#2F4F2F'; // Dark green ground
      ctx.fillRect(0, cvs.height-20, cvs.width, 20);
      
      ents.forEach(e=>{ 
        const img=getImg(e.src); 
        if(img && img.complete && loadedImgs.has(e.src)){ 
          // Check if this is a sprite sheet (width > height suggests multiple frames)
          if(e.type==='sprite' && img.width > img.height && img.width > 64 && img.width % 32 === 0){
            // Sprite sheet slicing for character sprites
            const frameW = 32; 
            const frameH = 32;
            const frameX = (e.frame || 0) * frameW;
            const frameY = 0;
            ctx.drawImage(img, frameX, frameY, frameW, frameH, e.x, e.y, e.w, e.h);
          } else {
            // Single image - draw directly
            ctx.drawImage(img, e.x, e.y, e.w, e.h);
          }
        } else { 
          // Debug overlay for failed loads
          ctx.fillStyle='#58a6ff33'; 
          ctx.fillRect(e.x,e.y,e.w,e.h); 
          ctx.strokeStyle='#58a6ff'; 
          ctx.strokeRect(e.x,e.y,e.w,e.h);
          ctx.fillStyle='#fff'; ctx.font='10px monospace'; 
          ctx.fillText(e.name||'?', e.x+2, e.y+12);
          ctx.fillText(e.src?.split('/').pop()||'no src', e.x+2, e.y+24);
          if(img && !img.complete) ctx.fillText('Loading...', e.x+2, e.y+36);
          else if(!loadedImgs.has(e.src)) ctx.fillText('Failed', e.x+2, e.y+36);
        } 
      }); 
      }
      let last=performance.now(); function loop(ts){ const dt=Math.min(0.033,(ts-last)/1000); last=ts; update(dt); render(); requestAnimationFrame(loop); }
      requestAnimationFrame(loop);
    }
  </script>
</head>
<body>
  <div class="placeholder">Godot export goes here (toppler.wasm / toppler.pck)</div>
</body>
</html>

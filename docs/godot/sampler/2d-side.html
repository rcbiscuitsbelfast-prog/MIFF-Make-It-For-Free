<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2D Side-Scrolling (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{ 
      try{ parent.postMessage({ type:'godot-ready', zone:'2d-side' }, '*'); }catch{}; 
      window.addEventListener('message',(e)=>{ 
        if(e&&e.data&&e.data.type==='scene-data'){ 
          const data=e.data.data||{}; 
          bootGame(data.entities||[]); 
        } 
      }); 
      setTimeout(async ()=>{ 
        if(!window.__sideBooted){ 
          try{ 
            console.log('[2D-Side] Loading preset from: ../../site/studio/presets/sampler-2d-side.json');
            const pre=await fetch('../../site/studio/presets/sampler-2d-side.json').then(r=>r.json()); 
            console.log('[2D-Side] Preset loaded:', pre);
            bootGame(pre.entities||[]); 
          }catch(error){
            console.error('[2D-Side] Failed to load preset:', error);
            // Fallback with basic entities
            bootGame([
              { id: 'player', name: 'Knight', type: 'sprite', src: '../../assets/KayKitAssets/knight_texture.png', x: 50, y: 300, w: 48, h: 48 },
              { id: 'platform1', name: 'Platform', type: 'tile', src: '../../assets/Bridge_Wood.png', x: 100, y: 350, w: 80, h: 16 }
            ]);
          } 
        } 
      },1000); 
    });
    
    function bootGame(entities){ 
      if(window.__sideBooted) return; 
      window.__sideBooted=true; 
      // Remove existing gameCanvas div and create canvas
      const existingCanvas = document.getElementById('gameCanvas');
      if (existingCanvas) existingCanvas.remove();
      
      const cvs=document.createElement('canvas'); 
      cvs.id = 'gameCanvas';
      Object.assign(cvs.style,{position:'absolute',inset:'0',zIndex:'1'}); 
      document.body.appendChild(cvs); 
      const ctx=cvs.getContext('2d'); 
      const fit=()=>{ 
        cvs.width=window.innerWidth; 
        cvs.height=window.innerHeight; 
        console.log('[2D-Side] Canvas resized to:', cvs.width, 'x', cvs.height);
      }; 
      window.addEventListener('resize',fit); 
      fit(); 
      
      const imgs=new Map(); 
      const loadedImgs=new Set(); 
      function getImg(s){ 
        if(!s) return null; 
        if(imgs.has(s)) return imgs.get(s); 
        const i=new Image(); 
        i.onload=()=>{console.log('[2D-Side] Loaded:',s); loadedImgs.add(s);}; 
        i.onerror=()=>{console.error('[2D-Side] Failed to load:',s); console.error('[2D-Side] Full path:', i.src);}; 
        i.src=s; 
        imgs.set(s,i); 
        return i; 
      } 
      
      const ents=entities.map(e=>({ ...e, vx:0, vy:0, frame:0, frameTime:0, frameRate:0.1 })); 
      console.log('[2D-Side] Booted with entities:',ents);
      console.log('[2D-Side] Canvas size:', cvs.width, 'x', cvs.height);
      console.log('[2D-Side] Window size:', window.innerWidth, 'x', window.innerHeight);
      
      // 2D Side-scrolling physics
      const keys={}; 
      window.addEventListener('keydown',e=>keys[e.key]=true); 
      window.addEventListener('keyup',e=>keys[e.key]=false);
      const GRAV=900, SPEED=180, JUMP=-360, FLOOR=cvs.height-20;
      
      // Game state
      let score = 0;
      let lives = 3;
      let gameTime = 0;
      let gameStarted = true; // Start automatically for testing
      
      function update(dt){ 
        if (!gameStarted) {
          if (keys[' '] || keys['Enter']) {
            gameStarted = true;
          }
          return;
        }
        
        gameTime += dt;
        
        ents.forEach(e => {
          const isPlayer = (e.id||'').includes('player') || (e.name||'').toLowerCase().includes('knight');
          const isEnemy = (e.name||'').toLowerCase().includes('skeleton');
          const isChest = (e.name||'').toLowerCase().includes('chest');
          
          if (isPlayer) {
            // Player physics for side-scrolling
            if (keys['ArrowRight']) e.vx = SPEED; 
            else if (keys['ArrowLeft']) e.vx = -SPEED; 
            else e.vx = 0;
            if (keys['ArrowUp'] && e.y+e.h>=FLOOR) e.vy = JUMP;
            e.vy += GRAV*dt;
            e.x += e.vx*dt;
            e.y += e.vy*dt;
            // Keep player on screen
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y+e.h>FLOOR){ e.y=FLOOR-e.h; e.vy=0; }
            // Animate player
            if (e.vx !== 0) { e.frameTime += dt; if(e.frameTime > e.frameRate){ e.frameTime=0; e.frame = (e.frame+1) % 4; } }
            
            // Check collisions with enemies
            ents.forEach(other => {
              if (other !== e && (other.name||'').toLowerCase().includes('skeleton')) {
                if (e.x < other.x + other.w && e.x + e.w > other.x && 
                    e.y < other.y + other.h && e.y + e.h > other.y) {
                  // Player hit enemy
                  lives--;
                  if (lives <= 0) {
                    gameStarted = false;
                    score = 0;
                    lives = 3;
                    gameTime = 0;
                  }
                  // Bounce player back
                  e.x -= e.vx * dt * 2;
                }
              }
            });
            
            // Check collisions with chests
            ents.forEach(other => {
              if (other !== e && (other.name||'').toLowerCase().includes('chest')) {
                if (e.x < other.x + other.w && e.x + e.w > other.x && 
                    e.y < other.y + other.h && e.y + e.h > other.y) {
                  // Collect chest
                  score += 100;
                  other.collected = true;
                }
              }
            });
          } else if (isEnemy) {
            // Enemy AI - simple patrol
            if (!e.patrolDirection) e.patrolDirection = 1;
            e.vx = e.patrolDirection * 30;
            e.x += e.vx * dt;
            
            // Turn around at edges
            if (e.x <= 0 || e.x + e.w >= cvs.width) {
              e.patrolDirection *= -1;
            }
            
            // Keep on screen
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h > cvs.height) e.y = cvs.height - e.h;
            
            // Animate enemy
            e.frameTime += dt;
            if(e.frameTime > e.frameRate){ 
              e.frameTime=0; 
              e.frame = (e.frame+1) % 4; 
            }
          } else {
            // Non-player entities: keep on screen but no physics
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h > cvs.height) e.y = cvs.height - e.h;
          }
        });
      }
      
      function render(){ 
        ctx.fillStyle='#0b1020'; 
        ctx.fillRect(0,0,cvs.width,cvs.height);
        
        // Always draw a test rectangle to verify rendering is working
        ctx.fillStyle='#ff0000';
        ctx.fillRect(10, 10, 200, 100);
        ctx.fillStyle='#ffffff';
        ctx.font='20px monospace';
        ctx.fillText('Rendering Test - Canvas Working!', 15, 50);
        ctx.fillText('Canvas Size: ' + cvs.width + 'x' + cvs.height, 15, 80);
        
        console.log('[2D-Side] Rendering frame, entities:', ents.length); 
        
        // Draw ground platforms first
        ctx.fillStyle='#8B4513'; // Brown for wood platforms
        ents.forEach(e => {
          if (e.type === 'tile' || (e.name && e.name.toLowerCase().includes('platform'))) {
            ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.strokeStyle='#654321';
            ctx.strokeRect(e.x, e.y, e.w, e.h);
          }
        });
        
        // Draw main ground
        ctx.fillStyle='#2F4F2F'; // Dark green ground
        ctx.fillRect(0, cvs.height-20, cvs.width, 20);
        
        // Draw entities
        ents.forEach(e=>{ 
          if (e.collected) return; // Skip collected chests
          
          const img=getImg(e.src); 
          if(img && img.complete && loadedImgs.has(e.src)){ 
            // Check if this is a sprite sheet
            if(e.type==='sprite' && img.width > img.height && img.width > 64 && img.width % 32 === 0){
              // Sprite sheet slicing
              const frameW = 32; 
              const frameH = 32;
              const frameX = (e.frame || 0) * frameW;
              const frameY = 0;
              ctx.drawImage(img, frameX, frameY, frameW, frameH, e.x, e.y, e.w, e.h);
            } else {
              // Single image
              ctx.drawImage(img, e.x, e.y, e.w, e.h);
            }
          } else { 
            // Debug overlay
            ctx.fillStyle='#58a6ff33'; 
            ctx.fillRect(e.x,e.y,e.w,e.h); 
            ctx.strokeStyle='#58a6ff'; 
            ctx.strokeRect(e.x,e.y,e.w,e.h);
            ctx.fillStyle='#fff'; ctx.font='10px monospace'; 
            ctx.fillText(e.name||'?', e.x+2, e.y+12);
            ctx.fillText(e.src?.split('/').pop()||'no src', e.x+2, e.y+24);
            if(img && !img.complete) ctx.fillText('Loading...', e.x+2, e.y+36);
            else if(!loadedImgs.has(e.src)) ctx.fillText('Failed', e.x+2, e.y+36);
          } 
        }); 
        
        // Draw UI
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, cvs.width, 60);
        
        ctx.fillStyle = '#e6edf3';
        ctx.font = '16px monospace';
        ctx.fillText(`Score: ${score}`, 10, 25);
        ctx.fillText(`Lives: ${lives}`, 10, 45);
        ctx.fillText(`Time: ${Math.floor(gameTime)}s`, cvs.width - 100, 25);
        
        if (!gameStarted) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.fillStyle = '#e6edf3';
          ctx.font = '24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('🏃 2D Side-Scrolling Platformer', cvs.width/2, cvs.height/2 - 40);
          ctx.font = '16px monospace';
          ctx.fillText('Arrow Keys to Move, Space to Jump', cvs.width/2, cvs.height/2 - 10);
          ctx.fillText('Collect chests, avoid skeletons!', cvs.width/2, cvs.height/2 + 20);
          ctx.fillText('Press SPACE or ENTER to Start', cvs.width/2, cvs.height/2 + 50);
          ctx.textAlign = 'left';
        }
        
        if (lives <= 0) {
          ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.fillStyle = '#e6edf3';
          ctx.font = '24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('Game Over!', cvs.width/2, cvs.height/2 - 20);
          ctx.font = '16px monospace';
          ctx.fillText(`Final Score: ${score}`, cvs.width/2, cvs.height/2 + 10);
          ctx.fillText('Press SPACE to Restart', cvs.width/2, cvs.height/2 + 40);
          ctx.textAlign = 'left';
        }
      }
      
      let last=performance.now(); 
      let frameCount = 0;
      function loop(ts){ 
        const dt=Math.min(0.033,(ts-last)/1000); 
        last=ts; 
        update(dt); 
        render(); 
        frameCount++;
        if (frameCount % 60 === 0) {
          console.log('[2D-Side] Frame', frameCount, 'entities:', ents.length, 'loaded images:', loadedImgs.size);
        }
        requestAnimationFrame(loop); 
      }
      console.log('[2D-Side] Starting game loop');
      console.log('[2D-Side] Canvas element:', cvs);
      console.log('[2D-Side] Context:', ctx);
      console.log('[2D-Side] Canvas dimensions:', cvs.width, 'x', cvs.height);
      console.log('[2D-Side] Canvas style:', cvs.style.cssText);
      console.log('[2D-Side] Canvas parent:', cvs.parentElement);
      requestAnimationFrame(loop);
    }
  </script>
</head>
<body>
  <div id="gameCanvas" style="position:absolute;inset:0;background:#0b1020;"></div>
</body>
</html>

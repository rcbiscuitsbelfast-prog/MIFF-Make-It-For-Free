<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Isometric (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{ 
      try{ parent.postMessage({ type:'godot-ready', zone:'3d-topdown' }, '*'); }catch{}; 
      window.addEventListener('message',(e)=>{ 
        if(e&&e.data&&e.data.type==='scene-data'){ 
          const data=e.data.data||{}; 
          bootGame(data.entities||[]); 
        } 
      }); 
      setTimeout(async ()=>{ 
        if(!window.__isometricBooted){ 
          try{ 
            const pre=await fetch('../../../docs/site/studio/presets/sampler-3d-isometric.json').then(r=>r.json()); 
            bootGame(pre.entities||[]); 
          }catch{} 
        } 
      },1000); 
    });
    
    function bootGame(entities){ 
      if(window.__isometricBooted) return; 
      window.__isometricBooted=true; 
      // Remove existing gameCanvas div and create canvas
      const existingCanvas = document.getElementById('gameCanvas');
      if (existingCanvas) existingCanvas.remove();
      
      const cvs=document.createElement('canvas'); 
      cvs.id = 'gameCanvas';
      Object.assign(cvs.style,{position:'absolute',inset:'0',zIndex:'1'}); 
      document.body.appendChild(cvs); 
      const ctx=cvs.getContext('2d'); 
      const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; 
      window.addEventListener('resize',fit); 
      fit(); 
      
      const imgs=new Map(); 
      const loadedImgs=new Set(); 
      function getImg(s){ 
        if(!s) return null; 
        if(imgs.has(s)) return imgs.get(s); 
        const i=new Image(); 
        i.onload=()=>{console.log('[3D-Isometric] Loaded:',s); loadedImgs.add(s);}; 
        i.onerror=()=>{console.error('[3D-Isometric] Failed to load:',s);}; 
        i.src=s; 
        imgs.set(s,i); 
        return i; 
      } 
      
      const ents=entities.map(e=>({ ...e, frame:0, frameTime:0, frameRate:0.1, depth: e.y + (e.h||32) })); 
      console.log('[3D-Isometric] Booted with entities:',ents);
      
      // 3D Isometric movement with depth sorting
      const keys={}; 
      window.addEventListener('keydown',e=>keys[e.key]=true); 
      window.addEventListener('keyup',e=>keys[e.key]=false);
      const SPEED = 100;
      const ROTATION_SPEED = 2;
      let cameraAngle = 0;
      
      // Game state
      let score = 0;
      let treasures = 0;
      let gameTime = 0;
      let gameStarted = true; // Start automatically for testing
      
      function update(dt){ 
        if (!gameStarted) {
          if (keys[' '] || keys['Enter']) {
            gameStarted = true;
          }
          return;
        }
        
        gameTime += dt;
        
        ents.forEach(e => {
          const isPlayer = (e.id||'').includes('player') || (e.name||'').toLowerCase().includes('mage');
          const isEnemy = (e.name||'').toLowerCase().includes('rogue');
          const isChest = (e.name||'').toLowerCase().includes('chest');
          
          if (isPlayer) {
            // 3D movement with camera rotation
            let dx = 0, dy = 0;
            
            if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += SPEED * dt;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= SPEED * dt;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= SPEED * dt;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += SPEED * dt;
            
            // Apply camera rotation
            const cos = Math.cos(cameraAngle);
            const sin = Math.sin(cameraAngle);
            const rotatedX = dx * cos - dy * sin;
            const rotatedY = dx * sin + dy * cos;
            
            e.x += rotatedX;
            e.y += rotatedY;
            
            // Camera rotation with Q/E keys
            if (keys['q'] || keys['Q']) cameraAngle -= ROTATION_SPEED * dt;
            if (keys['e'] || keys['E']) cameraAngle += ROTATION_SPEED * dt;
            
            // Keep player on screen
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h > cvs.height) e.y = cvs.height - e.h;
            
            // Update depth for sorting
            e.depth = e.y + e.h;
            
            // Animate player
            if (dx !== 0 || dy !== 0) { 
              e.frameTime += dt; 
              if(e.frameTime > e.frameRate){ 
                e.frameTime=0; 
                e.frame = (e.frame+1) % 4; 
              } 
            }
            
            // Check collisions with chests
            ents.forEach(other => {
              if (other !== e && (other.name||'').toLowerCase().includes('chest')) {
                if (e.x < other.x + other.w && e.x + e.w > other.x && 
                    e.y < other.y + other.h && e.y + e.h > other.y) {
                  // Collect chest
                  score += 100;
                  treasures++;
                  other.collected = true;
                }
              }
            });
            
            // Check collisions with enemies
            ents.forEach(other => {
              if (other !== e && (other.name||'').toLowerCase().includes('rogue')) {
                if (e.x < other.x + other.w && e.x + e.w > other.x && 
                    e.y < other.y + other.h && e.y + e.h > other.y) {
                  // Combat with enemy
                  score += 50;
                  other.defeated = true;
                }
              }
            });
          } else if (isEnemy) {
            // Enemy AI - simple patrol
            if (!e.patrolDirection) e.patrolDirection = 1;
            e.vx = e.patrolDirection * 20;
            e.x += e.vx * dt;
            
            // Turn around at edges
            if (e.x <= 0 || e.x + e.w >= cvs.width) {
              e.patrolDirection *= -1;
            }
            
            // Keep on screen
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h > cvs.height) e.y = cvs.height - e.h;
            
            // Update depth for sorting
            e.depth = e.y + e.h;
            
            // Animate enemy
            e.frameTime += dt;
            if(e.frameTime > e.frameRate){ 
              e.frameTime=0; 
              e.frame = (e.frame+1) % 4; 
            }
          } else {
            // Non-player entities: keep on screen and update depth
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h > cvs.height) e.y = cvs.height - e.h;
            e.depth = e.y + e.h;
          }
        });
      }
      
      function render(){ 
        ctx.fillStyle='#0a1322'; 
        ctx.fillRect(0,0,cvs.width,cvs.height); 
        
        // Draw isometric grid
        ctx.strokeStyle = 'rgba(88,166,255,0.1)';
        ctx.lineWidth = 1;
        const gridSize = 32;
        for (let x = 0; x < cvs.width; x += gridSize) {
          for (let y = 0; y < cvs.height; y += gridSize) {
            // Isometric diamond pattern
            ctx.beginPath();
            ctx.moveTo(x + gridSize/2, y);
            ctx.lineTo(x + gridSize, y + gridSize/2);
            ctx.lineTo(x + gridSize/2, y + gridSize);
            ctx.lineTo(x, y + gridSize/2);
            ctx.closePath();
            ctx.stroke();
          }
        }
        
        // Draw ground
        ctx.fillStyle='#2F4F2F'; 
        ctx.fillRect(0, cvs.height-20, cvs.width, 20);
        
        // Sort entities by depth (back to front)
        const sortedEnts = [...ents].sort((a, b) => a.depth - b.depth);
        
        sortedEnts.forEach(e=>{ 
          const img=getImg(e.src); 
          if(img && img.complete && loadedImgs.has(e.src)){ 
            ctx.save();
            
            // Apply isometric perspective transformation
            const centerX = e.x + e.w/2;
            const centerY = e.y + e.h/2;
            ctx.translate(centerX, centerY);
            ctx.rotate(cameraAngle);
            ctx.translate(-centerX, -centerY);
            
            // Check if this is a sprite sheet
            if(e.type==='sprite' && img.width > img.height && img.width > 64 && img.width % 32 === 0){
              // Sprite sheet slicing
              const frameW = 32; 
              const frameH = 32;
              const frameX = (e.frame || 0) * frameW;
              const frameY = 0;
              ctx.drawImage(img, frameX, frameY, frameW, frameH, e.x, e.y, e.w, e.h);
            } else {
              // Single image
              ctx.drawImage(img, e.x, e.y, e.w, e.h);
            }
            ctx.restore();
          } else { 
            // Debug overlay with isometric styling
            ctx.save();
            const centerX = e.x + e.w/2;
            const centerY = e.y + e.h/2;
            ctx.translate(centerX, centerY);
            ctx.rotate(cameraAngle);
            ctx.translate(-centerX, -centerY);
            
            ctx.fillStyle='#58a6ff33'; 
            ctx.fillRect(e.x,e.y,e.w,e.h); 
            ctx.strokeStyle='#58a6ff'; 
            ctx.strokeRect(e.x,e.y,e.w,e.h);
            ctx.fillStyle='#fff'; ctx.font='10px monospace'; 
            ctx.fillText(e.name||'?', e.x+2, e.y+12);
            ctx.fillText(e.src?.split('/').pop()||'no src', e.x+2, e.y+24);
            if(img && !img.complete) ctx.fillText('Loading...', e.x+2, e.y+36);
            else if(!loadedImgs.has(e.src)) ctx.fillText('Failed', e.x+2, e.y+36);
            ctx.restore();
          } 
        }); 
        
        // Draw UI
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, cvs.width, 60);
        
        ctx.fillStyle = '#e6edf3';
        ctx.font = '16px monospace';
        ctx.fillText(`Score: ${score}`, 10, 25);
        ctx.fillText(`Treasures: ${treasures}`, 10, 45);
        ctx.fillText(`Time: ${Math.floor(gameTime)}s`, cvs.width - 100, 25);
        
        // Draw camera angle indicator
        ctx.fillStyle = 'rgba(88,166,255,0.8)';
        ctx.font = '12px monospace';
        ctx.fillText(`Camera: ${Math.round(cameraAngle * 180 / Math.PI)}°`, 10, cvs.height - 40);
        ctx.fillText('Q/E to rotate', 10, cvs.height - 25);
        
        if (!gameStarted) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.fillStyle = '#e6edf3';
          ctx.font = '24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('🏰 3D Isometric Adventure', cvs.width/2, cvs.height/2 - 40);
          ctx.font = '16px monospace';
          ctx.fillText('WASD to Move, Q/E to Rotate Camera', cvs.width/2, cvs.height/2 - 10);
          ctx.fillText('Collect chests, defeat enemies!', cvs.width/2, cvs.height/2 + 20);
          ctx.fillText('Press SPACE or ENTER to Start', cvs.width/2, cvs.height/2 + 50);
          ctx.textAlign = 'left';
        }
      }
      
      let last=performance.now(); 
      function loop(ts){ 
        const dt=Math.min(0.033,(ts-last)/1000); 
        last=ts; 
        update(dt); 
        render(); 
        requestAnimationFrame(loop); 
      }
      requestAnimationFrame(loop);
    }
  </script>
</head>
<body>
  <div id="gameCanvas" style="position:absolute;inset:0;background:#0a1322;"></div>
</body>
</html>

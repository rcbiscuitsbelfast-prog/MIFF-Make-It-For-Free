<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
  <title>3D Isometric (Godot Export Placeholder)</title>
  <style> html, body { margin:0; padding:0; height:100%; background:#000; } .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e6edf3;font-family:system-ui} </style>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{ 
      try{ parent.postMessage({ type:'godot-ready', zone:'3d-topdown' }, '*'); }catch{}; 
      window.addEventListener('message',(e)=>{ 
        if(e&&e.data&&e.data.type==='scene-data'){ 
          const data=e.data.data||{}; 
          bootGame(data.entities||[]); 
        } 
      }); 
      setTimeout(async ()=>{ 
        if(!window.__isometricBooted){ 
          try{ 
            const pre=await fetch('../../site/studio/presets/sampler-3d-isometric.json').then(r=>r.json()); 
            bootGame(pre.entities||[]); 
          }catch{} 
        } 
      },1000); 
    });
    
    function bootGame(entities){ 
      if(window.__isometricBooted) return; 
      window.__isometricBooted=true; 
      // Remove existing gameCanvas div and create canvas
      const existingCanvas = document.getElementById('gameCanvas');
      if (existingCanvas) existingCanvas.remove();
      
      const cvs=document.createElement('canvas'); 
      cvs.id = 'gameCanvas';
      Object.assign(cvs.style,{position:'absolute',inset:'0',zIndex:'1'}); 
      document.body.appendChild(cvs); 
      const ctx=cvs.getContext('2d'); 
      const fit=()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }; 
      window.addEventListener('resize',fit); 
      fit(); 
      
      const imgs=new Map(); 
      const loadedImgs=new Set(); 
      function getImg(s){ 
        if(!s) return null; 
        if(imgs.has(s)) return imgs.get(s); 
        const i=new Image(); 
        i.onload=()=>{console.log('[3D-Isometric] Loaded:',s); loadedImgs.add(s);}; 
        i.onerror=()=>{console.error('[3D-Isometric] Failed to load:',s);}; 
        i.src=s; 
        imgs.set(s,i); 
        return i; 
      } 
      
      const ents=entities.map(e=>({ ...e, frame:0, frameTime:0, frameRate:0.1, depth: e.y + (e.h||32), z: e.z || 0 })); 
      console.log('[3D-Isometric] Booted with entities:',ents);
      
      // 3D Isometric movement with depth sorting and camera views
      const keys={}; 
      window.addEventListener('keydown',e=>keys[e.key]=true); 
      window.addEventListener('keyup',e=>keys[e.key]=false);
      const SPEED = 100;
      const ROTATION_SPEED = 2;
      let cameraAngle = 0;
      let cameraView = '3rd'; // '1st' or '3rd' person
      let cameraZoom = 1.0;
      let cameraHeight = 0; // For 1st person view
      
      // Game state
      let score = 0;
      let treasures = 0;
      let gameTime = 0;
      let gameStarted = true; // Start automatically for testing
      
      function update(dt){ 
        if (!gameStarted) {
          if (keys[' '] || keys['Enter']) {
            gameStarted = true;
          }
          return;
        }
        
        gameTime += dt;
        
        ents.forEach(e => {
          const isPlayer = (e.id||'').includes('player') || (e.name||'').toLowerCase().includes('mage');
          const isEnemy = (e.name||'').toLowerCase().includes('rogue');
          const isChest = (e.name||'').toLowerCase().includes('chest');
          
          if (isPlayer) {
            // 3D movement with camera rotation
            let dx = 0, dy = 0;
            
            if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += SPEED * dt;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= SPEED * dt;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= SPEED * dt;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += SPEED * dt;
            
            // Apply camera rotation
            const cos = Math.cos(cameraAngle);
            const sin = Math.sin(cameraAngle);
            const rotatedX = dx * cos - dy * sin;
            const rotatedY = dx * sin + dy * cos;
            
            e.x += rotatedX;
            e.y += rotatedY;
            
            // Jumping in 3D world
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && e.y + e.h >= cvs.height - 40) {
              e.vy = -400; // Jump force
            }
            
            // Apply gravity for 3D world
            if (!e.vy) e.vy = 0;
            e.vy += 500 * dt; // Gravity
            e.y += e.vy * dt;
            
            // Camera rotation with Q/E keys
            if (keys['q'] || keys['Q']) cameraAngle -= ROTATION_SPEED * dt;
            if (keys['e'] || keys['E']) cameraAngle += ROTATION_SPEED * dt;
            
            // Camera view toggle with V key
            if (keys['v'] || keys['V']) {
              cameraView = cameraView === '3rd' ? '1st' : '3rd';
              keys['v'] = false; keys['V'] = false; // Prevent rapid toggling
            }
            
            // Camera zoom with +/- keys
            if (keys['='] || keys['+']) cameraZoom = Math.min(2.0, cameraZoom + 0.1);
            if (keys['-']) cameraZoom = Math.max(0.5, cameraZoom - 0.1);
            
            // Camera height adjustment for 1st person (R/F keys)
            if (cameraView === '1st') {
              if (keys['r'] || keys['R']) cameraHeight = Math.min(100, cameraHeight + 50 * dt);
              if (keys['f'] || keys['F']) cameraHeight = Math.max(-50, cameraHeight - 50 * dt);
            }
            
            // Keep player on screen and above floor
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h >= cvs.height - 40) {
              e.y = cvs.height - 40 - e.h; // Floor constraint
              e.vy = 0; // Stop falling
            }
            
            // Update depth for sorting
            e.depth = e.y + e.h;
            
            // Animate player
            if (dx !== 0 || dy !== 0) { 
              e.frameTime += dt; 
              if(e.frameTime > e.frameRate){ 
                e.frameTime=0; 
                e.frame = (e.frame+1) % 4; 
              } 
            }
            
            // Check collisions with chests
            ents.forEach(other => {
              if (other !== e && (other.name||'').toLowerCase().includes('chest')) {
                if (e.x < other.x + other.w && e.x + e.w > other.x && 
                    e.y < other.y + other.h && e.y + e.h > other.y) {
                  // Collect chest
                  score += 100;
                  treasures++;
                  other.collected = true;
                }
              }
            });
            
            // Check collisions with enemies
            ents.forEach(other => {
              if (other !== e && (other.name||'').toLowerCase().includes('rogue')) {
                if (e.x < other.x + other.w && e.x + e.w > other.x && 
                    e.y < other.y + other.h && e.y + e.h > other.y) {
                  // Combat with enemy
                  score += 50;
                  other.defeated = true;
                }
              }
            });
          } else if (isEnemy) {
            // Enemy AI - simple patrol
            if (!e.patrolDirection) e.patrolDirection = 1;
            e.vx = e.patrolDirection * 20;
            e.x += e.vx * dt;
            
            // Turn around at edges
            if (e.x <= 0 || e.x + e.w >= cvs.width) {
              e.patrolDirection *= -1;
            }
            
            // Keep on screen and above floor
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h >= cvs.height - 40) {
              e.y = cvs.height - 40 - e.h; // Floor constraint
              if (e.vy) e.vy = 0; // Stop falling
            }
            
            // Update depth for sorting
            e.depth = e.y + e.h;
            
            // Animate enemy
            e.frameTime += dt;
            if(e.frameTime > e.frameRate){ 
              e.frameTime=0; 
              e.frame = (e.frame+1) % 4; 
            }
          } else {
            // Non-player entities: keep on screen and above floor
            if (e.x < 0) e.x = 0;
            if (e.x + e.w > cvs.width) e.x = cvs.width - e.w;
            if (e.y < 0) e.y = 0;
            if (e.y + e.h >= cvs.height - 40) {
              e.y = cvs.height - 40 - e.h; // Floor constraint
              if (e.vy) e.vy = 0; // Stop falling
            }
            e.depth = e.y + e.h;
          }
        });
      }
      
      // Draw 3D world with buildings, trees, and terrain
      function draw3DWorld(offsetX, offsetY) {
        const tileSize = 40;
        const worldWidth = 20;
        const worldHeight = 15;
        
        // Draw 3D buildings and structures
        for (let x = 0; x < worldWidth; x++) {
          for (let y = 0; y < worldHeight; y++) {
            const screenX = x * tileSize + offsetX;
            const screenY = y * tileSize + offsetY;
            
            // Create a simple world layout
            const terrainType = getTerrainType(x, y);
            
            if (terrainType === 'building') {
              draw3DBuilding(screenX, screenY, tileSize);
            } else if (terrainType === 'tree') {
              draw3DTree(screenX, screenY, tileSize);
            } else if (terrainType === 'mountain') {
              draw3DMountain(screenX, screenY, tileSize);
            } else if (terrainType === 'water') {
              draw3DWater(screenX, screenY, tileSize);
            }
          }
        }
      }
      
      // Determine terrain type based on position
      function getTerrainType(x, y) {
        // Create a simple world layout
        if (x === 5 && y === 5) return 'building';
        if (x === 8 && y === 3) return 'building';
        if (x === 12 && y === 7) return 'building';
        if (x === 3 && y === 10) return 'building';
        if (x === 15 && y === 12) return 'building';
        
        if (x === 2 && y === 2) return 'tree';
        if (x === 6 && y === 8) return 'tree';
        if (x === 10 && y === 4) return 'tree';
        if (x === 14 && y === 9) return 'tree';
        if (x === 7 && y === 12) return 'tree';
        if (x === 11 && y === 11) return 'tree';
        
        if (x === 1 && y === 1) return 'mountain';
        if (x === 18 && y === 2) return 'mountain';
        if (x === 16 && y === 14) return 'mountain';
        
        if (x === 0 || x === 19 || y === 0 || y === 14) return 'water';
        
        return 'grass';
      }
      
      // Draw 3D building
      function draw3DBuilding(x, y, size) {
        const height = size * 2;
        const depth = size * 0.8;
        
        // Building base
        ctx.fillStyle = '#8B4513'; // Brown
        ctx.fillRect(x, y + size - depth, size, depth);
        
        // Building walls
        ctx.fillStyle = '#A0522D'; // Saddle brown
        ctx.fillRect(x, y, size, height);
        
        // Building roof
        ctx.fillStyle = '#B22222'; // Fire brick
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + size/2, y - size/2);
        ctx.lineTo(x + size, y);
        ctx.closePath();
        ctx.fill();
        
        // Windows
        ctx.fillStyle = '#87CEEB'; // Sky blue
        ctx.fillRect(x + 5, y + 10, 8, 12);
        ctx.fillRect(x + 18, y + 10, 8, 12);
        ctx.fillRect(x + 5, y + 30, 8, 12);
        ctx.fillRect(x + 18, y + 30, 8, 12);
        
        // Door
        ctx.fillStyle = '#654321'; // Dark brown
        ctx.fillRect(x + size/2 - 6, y + height - 20, 12, 20);
      }
      
      // Draw 3D tree
      function draw3DTree(x, y, size) {
        // Tree trunk
        ctx.fillStyle = '#8B4513'; // Brown
        ctx.fillRect(x + size/2 - 3, y + size/2, 6, size/2);
        
        // Tree leaves
        ctx.fillStyle = '#228B22'; // Forest green
        ctx.beginPath();
        ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI * 2);
        ctx.fill();
        
        // Tree shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(x + size/2 + 2, y + size - 5, size/2, 5);
      }
      
      // Draw 3D mountain
      function draw3DMountain(x, y, size) {
        const height = size * 1.5;
        
        // Mountain base
        ctx.fillStyle = '#696969'; // Dim gray
        ctx.fillRect(x, y + size - size/2, size, size/2);
        
        // Mountain peak
        ctx.fillStyle = '#A9A9A9'; // Dark gray
        ctx.beginPath();
        ctx.moveTo(x, y + size);
        ctx.lineTo(x + size/2, y + size - height);
        ctx.lineTo(x + size, y + size);
        ctx.closePath();
        ctx.fill();
        
        // Snow cap
        ctx.fillStyle = '#F0F8FF'; // Alice blue
        ctx.beginPath();
        ctx.moveTo(x + size/4, y + size - height/2);
        ctx.lineTo(x + size/2, y + size - height);
        ctx.lineTo(x + 3*size/4, y + size - height/2);
        ctx.closePath();
        ctx.fill();
      }
      
      // Draw 3D water
      function draw3DWater(x, y, size) {
        // Water surface
        ctx.fillStyle = '#4682B4'; // Steel blue
        ctx.fillRect(x, y + size - size/3, size, size/3);
        
        // Water waves
        ctx.strokeStyle = '#87CEEB'; // Sky blue
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(x + i * size/3, y + size - size/6);
          ctx.quadraticCurveTo(x + i * size/3 + size/6, y + size - size/6 - 3, x + (i + 1) * size/3, y + size - size/6);
          ctx.stroke();
        }
      }
      
      function render(){ 
        // Draw sky gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, cvs.height);
        gradient.addColorStop(0, '#87CEEB'); // Sky blue
        gradient.addColorStop(0.7, '#98FB98'); // Light green
        gradient.addColorStop(1, '#8FBC8F'); // Dark sea green
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, cvs.width, cvs.height);
        
        // Find player for camera positioning
        const player = ents.find(e => (e.id||'').includes('player') || (e.name||'').toLowerCase().includes('mage'));
        const playerX = player ? player.x + player.w/2 : cvs.width/2;
        const playerY = player ? player.y + player.h/2 : cvs.height/2;
        
        // Camera offset for 1st person view
        const offsetX = cameraView === '1st' ? cvs.width/2 - playerX : 0;
        const offsetY = cameraView === '1st' ? cvs.height/2 - playerY + cameraHeight : 0;
        
        // Draw 3D terrain and structures
        draw3DWorld(offsetX, offsetY);
        
        // Draw ground plane
        ctx.fillStyle = '#90EE90'; // Light green ground
        ctx.fillRect(0, cvs.height - 60 + offsetY, cvs.width, 60);
        
        // Draw ground texture (grass pattern)
        ctx.fillStyle = '#7CCD7C';
        for (let x = 0; x < cvs.width; x += 20) {
          for (let y = cvs.height - 60 + offsetY; y < cvs.height + offsetY; y += 20) {
            if ((x + y) % 40 < 20) {
              ctx.fillRect(x, y, 10, 10);
            }
          }
        }
        
        // Sort entities by depth (back to front) and apply camera transformations
        const sortedEnts = [...ents].sort((a, b) => {
          const depthA = a.depth + (a.z || 0);
          const depthB = b.depth + (b.z || 0);
          return depthA - depthB;
        });
        
        // Draw matrix-style entities as simple geometric shapes
        sortedEnts.forEach(e=>{ 
          const isPlayer = (e.id||'').includes('player') || (e.name||'').toLowerCase().includes('mage');
          const isEnemy = (e.name||'').toLowerCase().includes('rogue') || (e.name||'').toLowerCase().includes('skeleton');
          const isChest = (e.name||'').toLowerCase().includes('chest');
          
          // Calculate screen position with camera transformations
          let screenX = e.x + offsetX;
          let screenY = e.y + offsetY;
          let screenW = e.w * cameraZoom;
          let screenH = e.h * cameraZoom;
          
          ctx.save();
          
          // Apply camera transformations
          const centerX = screenX + screenW/2;
          const centerY = screenY + screenH/2;
          ctx.translate(centerX, centerY);
          ctx.rotate(cameraAngle);
          ctx.scale(cameraZoom, cameraZoom);
          ctx.translate(-centerX/cameraZoom, -centerY/cameraZoom);
          
          // Draw matrix-style geometric shapes
          if (isPlayer) {
            // Player as green cube
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(screenX, screenY, screenW, screenH);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(screenX, screenY, screenW, screenH);
            // Player indicator
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px monospace';
            ctx.fillText('PLAYER', screenX + 2, screenY + 12);
          } else if (isEnemy) {
            // Enemy as red cube
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(screenX, screenY, screenW, screenH);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(screenX, screenY, screenW, screenH);
            // Enemy indicator
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px monospace';
            ctx.fillText('ENEMY', screenX + 2, screenY + 10);
          } else if (isChest) {
            // Chest as yellow cube
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(screenX, screenY, screenW, screenH);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(screenX, screenY, screenW, screenH);
            // Chest indicator
            ctx.fillStyle = '#000000';
            ctx.font = '10px monospace';
            ctx.fillText('CHEST', screenX + 2, screenY + 10);
          } else {
            // Other entities as blue cubes
            ctx.fillStyle = '#0088ff';
            ctx.fillRect(screenX, screenY, screenW, screenH);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(screenX, screenY, screenW, screenH);
            // Entity name
            ctx.fillStyle = '#ffffff';
            ctx.font = '8px monospace';
            ctx.fillText(e.name || '?', screenX + 2, screenY + 8);
          }
          
          ctx.restore();
        }); 
        
        // Draw 3D world UI
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, cvs.width, 80);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = '16px monospace';
        ctx.fillText(`Score: ${score}`, 10, 25);
        ctx.fillText(`Treasures: ${treasures}`, 10, 45);
        ctx.fillText(`Time: ${Math.floor(gameTime)}s`, cvs.width - 150, 25);
        
        // Draw camera controls
        ctx.fillStyle = '#e6edf3';
        ctx.font = '12px monospace';
        ctx.fillText(`Camera: ${cameraView.toUpperCase()} Person`, 10, cvs.height - 80);
        ctx.fillText(`Angle: ${Math.round(cameraAngle * 180 / Math.PI)}°`, 10, cvs.height - 65);
        ctx.fillText(`Zoom: ${cameraZoom.toFixed(1)}x`, 10, cvs.height - 50);
        if (cameraView === '1st') {
          ctx.fillText(`Height: ${cameraHeight.toFixed(0)}`, 10, cvs.height - 35);
        }
        
        // Draw controls
        ctx.fillText('WASD: Move | Q/E: Rotate | V: Toggle View', 10, cvs.height - 20);
        ctx.fillText('+/-: Zoom | R/F: Height | Space: Jump', 10, cvs.height - 5);
        
        if (!gameStarted) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.fillStyle = '#e6edf3';
          ctx.font = '24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('🏰 3D Adventure World', cvs.width/2, cvs.height/2 - 80);
          ctx.font = '16px monospace';
          ctx.fillText('WASD: Move | Q/E: Rotate Camera | V: Toggle View', cvs.width/2, cvs.height/2 - 50);
          ctx.fillText('+/-: Zoom | R/F: Height | Space: Jump', cvs.width/2, cvs.height/2 - 30);
          ctx.fillText('Explore buildings, trees, mountains, and water!', cvs.width/2, cvs.height/2 - 10);
          ctx.fillText('Press SPACE or ENTER to Start', cvs.width/2, cvs.height/2 + 20);
          ctx.textAlign = 'left';
        }
      }
      
      let last=performance.now(); 
      function loop(ts){ 
        const dt=Math.min(0.033,(ts-last)/1000); 
        last=ts; 
        update(dt); 
        render(); 
        requestAnimationFrame(loop); 
      }
      requestAnimationFrame(loop);
    }
  </script>
</head>
<body>
  <div id="gameCanvas" style="position:absolute;inset:0;background:#0a1322;"></div>
</body>
</html>

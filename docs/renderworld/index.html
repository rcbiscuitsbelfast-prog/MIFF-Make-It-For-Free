<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RenderWorld Hub</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
	<style>
		html, body { margin:0; padding:0; height:100%; height:100dvh; background:#000; overflow:hidden; }
		#gameCanvas { position:fixed; inset:0; width:100vw; height:100dvh; display:block; }
		#status { position:fixed; left:8px; bottom:8px; color:#7fffd4; font:12px monospace; background:rgba(0,0,0,0.5); padding:6px 8px; border-radius:4px; }
		#joystick { position:fixed; left:16px; bottom:16px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
		#joystickKnob { width:56px; height:56px; border-radius:50%; background:rgba(0, 212, 255, 0.8); box-shadow:0 0 15px rgba(0,212,255,0.5); }
		#portalLinks { position:fixed; left:50%; transform:translateX(-50%); bottom:140px; display:flex; gap:12px; }
		#portalLinks a { text-decoration:none; color:#00ff88; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.12); padding:10px 14px; border-radius:8px; font-weight:600; }
	</style>
</head>
<body>
	<canvas id="gameCanvas"></canvas>
	<div id="status" style="position:fixed;left:8px;bottom:8px;color:#7fffd4;font:12px monospace;background:rgba(0,0,0,0.5);padding:6px 8px;border-radius:4px;">loading…</div>
	<div id="hud" style="position:fixed;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font:14px monospace;color:#e6edf3;background:rgba(0,0,0,0.45);backdrop-filter:saturate(120%) blur(2px);-webkit-backdrop-filter:saturate(120%) blur(2px);pointer-events:none;z-index:1000;text-shadow:0 1px 2px rgba(0,0,0,0.8);">
		<span id="hud-pos">pos 0.0, 0.0</span>
		<span id="hud-fps">60 fps</span>
	</div>
    <!-- Top-right controls -->
    <button id="btn-fullscreen" style="position:fixed;right:16px;top:64px;z-index:1100;min-width:110px;min-height:44px;border-radius:12px;background:rgba(0,0,0,0.55);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:14px monospace;">Fullscreen</button>
    <button id="btn-view" style="position:fixed;right:16px;top:116px;z-index:1100;min-width:110px;min-height:44px;border-radius:12px;background:rgba(0,0,0,0.55);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:14px monospace;">View: 3rd</button>
    <div id="hint" style="position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:1050;padding:8px 12px;font:14px monospace;color:#e6edf3;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.22);border-radius:10px;display:none;">hint</div>
	<!-- Phase 5: Virtual joystick and action buttons -->
	<div id="vj" style="position:fixed;left:16px;bottom:16px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.24);display:flex;align-items:center;justify-content:center;z-index:1100;">
		<div id="vj-knob" style="width:70px;height:70px;border-radius:50%;background:rgba(0,212,255,0.90);box-shadow:0 0 20px rgba(0,212,255,0.65);"></div>
	</div>
	<div style="position:fixed;right:16px;bottom:16px;display:flex;gap:14px;z-index:1100;">
		<button id="btn-interact" style="min-width:80px;min-height:80px;border-radius:14px;background:rgba(0,0,0,0.50);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:16px monospace;">Interact</button>
		<button id="btn-jump" style="min-width:80px;min-height:80px;border-radius:14px;background:rgba(0,0,0,0.50);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:16px monospace;">Jump</button>
	</div>
	<script type="module">
	// Use CDN module to avoid MIME issues with local backup extension
	import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

	const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, Math.max(1, window.devicePixelRatio || 1)));
// Color/tone mapping for consistent mobile brightness
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

	const scene = new THREE.Scene();
	scene.background = new THREE.Color(0x002a1a);
	renderer.setClearColor(0x002a1a, 1);

	const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
	camera.position.set(0, 1.5, 4);

	// Phase 2: Simple drag camera controls with damping
	let isPointerDown = false;
	let lastX = 0, lastY = 0;
	let yaw = 0, pitch = 0;
	let targetYaw = 0, targetPitch = 0;
	const minPitch = -Math.PI/3, maxPitch = Math.PI/3;
const damping = 0.12;
let isFirstPerson = false;

function updateCamera(){
    yaw += (targetYaw - yaw) * damping;
    pitch += (targetPitch - pitch) * damping;
    const radius = 4;
    if (isFirstPerson) {
        const eyeY = 0.6;
        const dirX = Math.sin(yaw) * Math.cos(pitch);
        const dirY = Math.sin(pitch);
        const dirZ = Math.cos(yaw) * Math.cos(pitch);
        camera.position.set(cube.position.x, cube.position.y + eyeY, cube.position.z);
        camera.lookAt(cube.position.x + dirX, cube.position.y + eyeY + dirY, cube.position.z + dirZ);
    } else {
        const offX = Math.sin(yaw) * Math.cos(pitch) * radius;
        const offY = Math.sin(pitch) * radius + 1.2;
        const offZ = Math.cos(yaw) * Math.cos(pitch) * radius;
        camera.position.set(cube.position.x + offX, cube.position.y + offY, cube.position.z + offZ);
        camera.lookAt(cube.position.x, cube.position.y + 0.3, cube.position.z);
    }
}

	function onPointerDown(x, y){ isPointerDown = true; lastX = x; lastY = y; }
	function onPointerMove(x, y){
		if (!isPointerDown) return;
		const dx = x - lastX; const dy = y - lastY; lastX = x; lastY = y;
		// Sensitivity tuned for mobile portrait
		targetYaw -= dx * 0.005;
		targetPitch -= dy * 0.004;
		if (targetPitch < minPitch) targetPitch = minPitch;
		if (targetPitch > maxPitch) targetPitch = maxPitch;
	}
	function onPointerUp(){ isPointerDown = false; }

	canvas.addEventListener('mousedown', (e)=>{ onPointerDown(e.clientX, e.clientY); });
	window.addEventListener('mousemove', (e)=>{ onPointerMove(e.clientX, e.clientY); });
	window.addEventListener('mouseup', onPointerUp);
	canvas.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; onPointerDown(t.clientX, t.clientY); }, { passive:false });
	canvas.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; onPointerMove(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
	canvas.addEventListener('touchend', onPointerUp, { passive:false });

// Lighting setup (hemi + key + gentle fill)
const hemi = new THREE.HemisphereLight(0xe0ffe0, 0x103018, 0.8); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(3,5,2); key.castShadow = false; scene.add(key);
const fill = new THREE.DirectionalLight(0x88c0a8, 0.35); fill.position.set(-4,3,-2); scene.add(fill);

	const cube = new THREE.Mesh(
		new THREE.BoxGeometry(1,1,1),
		new THREE.MeshStandardMaterial({ color: 0x00ff66, roughness: 0.4, metalness: 0.1, emissive: 0x003311, emissiveIntensity: 0.6 })
	);
	cube.position.set(0,0.75,0);
	scene.add(cube);

	// Phase 5: movement state
	const move = { x: 0, z: 0 };
	const moveSpeed = 1.8; // m/s
	// Simple jump physics
	let velY = 0; const gravity = -9.8; const groundY = 0.75;

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(32,32, 1,1),
    new THREE.MeshStandardMaterial({ color: 0x0a1f17, roughness: 0.95, metalness: 0.0 })
);
	ground.rotation.x = -Math.PI/2;
	ground.position.y = 0;
	scene.add(ground);

    // Phase 7: visual-only portal markers
    function createPortal(color){
        const g = new THREE.Group();
        const matGlow = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5 });
        const frame = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.06, 16, 48), matGlow);
        frame.rotation.x = Math.PI/2; frame.position.y = 1.0; g.add(frame);
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.6), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.25 }));
        plane.position.y = 0.9; g.add(plane);
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.55, 32), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5 }));
        ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; g.add(ring);
        const light = new THREE.PointLight(color, 0.9, 6); light.position.set(0,1.2,0); g.add(light);
        return g;
    }
    const p1 = createPortal(0x44aaff); p1.position.set(-3, 0, -6); p1.userData = { label: 'Spirit Tamer' }; scene.add(p1);
    const p2 = createPortal(0x44ff88); p2.position.set( 0, 0, -6); p2.userData = { label: 'Toppler' }; scene.add(p2);
    const p3 = createPortal(0xff6688); p3.position.set( 3, 0, -6); p3.userData = { label: 'Witcher Grove' }; scene.add(p3);

	function fit(){
		const w = window.innerWidth;
		const h = (window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight);
		renderer.setSize(w, h, true);
		camera.aspect = w / h;
		camera.updateProjectionMatrix();
	}
	window.addEventListener('resize', fit); fit();

	function animate(t){
		const tt = t * 0.001;
		cube.rotation.y = tt * 0.8;
		// Bob only when grounded
		if (Math.abs(velY) < 0.0001 && Math.abs(cube.position.y - groundY) < 0.0001) {
			cube.position.y = groundY + Math.sin(tt * 2.0) * 0.12;
		}
		// Apply jump/gravity
		if (cube.position.y > groundY || velY > 0) {
			const dt = (animate._lastFrame ? (t - animate._lastFrame) : 16.6) / 1000;
			velY += gravity * dt;
			cube.position.y += velY * dt;
			if (cube.position.y <= groundY) { cube.position.y = groundY; velY = 0; }
		}
		// apply movement aligned with camera forward/right on XZ
        if (move.x !== 0 || move.z !== 0) {
			const dt = (animate._lastFrame ? (t - animate._lastFrame) : 16.6) / 1000;
            // Use yaw-based forward/right; in 1st or 3rd person we keep the same yaw
            const nx = Math.sin(yaw);
            const nz = Math.cos(yaw);
            const rx = Math.cos(yaw);
            const rz = -Math.sin(yaw);
			const worldX = rx * move.x + nx * move.z;
			const worldZ = rz * move.x + nz * move.z;
			cube.position.x += worldX * moveSpeed * dt;
			cube.position.z += worldZ * moveSpeed * dt;
		}
		animate._lastFrame = t;
		updateCamera();
		renderer.render(scene, camera);
		// HUD updates
		try {
			const pos = cube.position;
			document.getElementById('hud-pos').textContent = 'pos ' + pos.x.toFixed(1) + ', ' + pos.z.toFixed(1);
		} catch {}
		// Proximity hint for portals
		try {
			const hint = document.getElementById('hint');
			let nearest = null, nearestD = 9999;
			for (const p of [p1,p2,p3]){
				const dx = p.position.x - cube.position.x;
				const dz = p.position.z - cube.position.z;
				const d = Math.hypot(dx, dz);
				if (d < nearestD) { nearestD = d; nearest = p; }
			}
			if (nearest && nearestD < 2.5) {
				hint.textContent = 'Interact: ' + (nearest.userData?.label || 'Portal');
				hint.style.display = 'block';
				animate._nearPortal = nearest;
			} else { hint.style.display = 'none'; animate._nearPortal = null; }
		} catch {}
		try {
			if (!animate._last) animate._last = t, animate._frames = 0;
			animate._frames++;
			if (t - animate._last > 1000) {
				document.getElementById('hud-fps').textContent = Math.round(animate._frames * 1000 / (t - animate._last)) + ' fps';
				animate._last = t; animate._frames = 0;
			}
		} catch {}
		requestAnimationFrame(animate);
	}
	requestAnimationFrame(animate);
	try { document.getElementById('status').textContent = 'running'; } catch {}

	// Phase 5: joystick logic
	(function(){
		const base = document.getElementById('vj');
		const knob = document.getElementById('vj-knob');
		if (!base || !knob) return;
		const radius = 72;
		let active = false;
		function setKnob(dx, dy){ knob.style.transform = 'translate('+dx+'px,'+dy+'px)'; }
		function start(x, y){ active = true; move.x = 0; move.z = 0; }
		function moveTo(x, y){
			if (!active) return;
			const r = base.getBoundingClientRect();
			const cx = r.left + r.width/2;
			const cy = r.top + r.height/2;
			let dx = x - cx, dy = y - cy;
			const d = Math.hypot(dx, dy);
			if (d > radius) { const a = Math.atan2(dy, dx); dx = Math.cos(a)*radius; dy = Math.sin(a)*radius; }
			setKnob(dx*0.6, dy*0.6);
			// map to [-1,1]
			move.x = dx / radius;
			move.z = -dy / radius;
		}
		function end(){ active = false; move.x = 0; move.z = 0; setKnob(0,0); }
		base.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; start(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
		base.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; moveTo(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
		base.addEventListener('touchend', (e)=>{ end(); e.preventDefault(); }, { passive:false });
		base.addEventListener('mousedown', (e)=>{ start(e.clientX, e.clientY); });
		window.addEventListener('mousemove', (e)=>{ moveTo(e.clientX, e.clientY); });
		window.addEventListener('mouseup', end);
	})();

	// Phase 5: action buttons
// Larger touch targets: handle both click and touchstart
const btnJump = document.getElementById('btn-jump');
const btnInteract = document.getElementById('btn-interact');
function doJump(){ if (velY === 0 && Math.abs(cube.position.y - groundY) < 0.001) { velY = 4.5; } }
function doInteract(){
    try {
        const s=document.getElementById('status');
        let msg = 'interact';
        if (animate._nearPortal) msg = 'Open: ' + (animate._nearPortal.userData?.label || 'Portal');
        s.textContent = msg;
        setTimeout(()=>{ s.textContent='running'; }, 900);
    } catch {}
}
if (btnJump){ btnJump.addEventListener('click', doJump); btnJump.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, { passive:false }); }
if (btnInteract){ btnInteract.addEventListener('click', doInteract); btnInteract.addEventListener('touchstart', (e)=>{ e.preventDefault(); doInteract(); }, { passive:false }); }

// Fullscreen handler
(function(){
    const btn = document.getElementById('btn-fullscreen');
    if (!btn) return;
    async function goFullscreen(){
        try {
            const el = document.documentElement;
            if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
            else if (document.body.requestFullscreen) await document.body.requestFullscreen();
            try { await screen.orientation.lock('landscape'); } catch {}
        } catch (e) {
            try { setTimeout(()=>window.scrollTo(0,1), 50); } catch {}
        }
    }
    function exitFullscreen(){ try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }
    function updateFsLabel(){ btn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen'; }
    btn.addEventListener('click', ()=>{ document.fullscreenElement ? exitFullscreen() : goFullscreen(); });
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); document.fullscreenElement ? exitFullscreen() : goFullscreen(); }, { passive:false });
    document.addEventListener('fullscreenchange', updateFsLabel);
    updateFsLabel();
})();

// View toggle (1st/3rd person)
(function(){
    const btn = document.getElementById('btn-view');
    if (!btn) return;
    function update(){ btn.textContent = 'View: ' + (isFirstPerson ? '1st' : '3rd'); }
    btn.addEventListener('click', ()=>{ isFirstPerson = !isFirstPerson; update(); });
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); isFirstPerson = !isFirstPerson; update(); }, { passive:false });
    update();
})();
	</script>
</body>
</html>

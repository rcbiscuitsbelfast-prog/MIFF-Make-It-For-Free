	<style>
		html, body { margin:0; padding:0; height:100%; height:100dvh; background:#000; overflow:hidden; }

<body>

    <div id="portal-labels" style="position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:1020;">
        <span id="lbl-p1" style="position:absolute;font:12px monospace;color:#e6edf3;background:rgba(0,0,0,0.45);padding:3px 6px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);display:none;">Spirit Tamer</span>

    </div>
    <div id="confirm" style="position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:1100;display:none;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.25);border-radius:12px;padding:10px 14px;color:#e6edf3;font:14px monospace;gap:10px;align-items:center;">
        <span id="confirm-text">Open?</span>
        <button id="confirm-open" style="min-height:36px;border-radius:10px;background:#00aa66;color:white;border:1px solid rgba(255,255,255,0.2);font:14px monospace;">Open</button>
        <button id="confirm-cancel" style="min-height:36px;border-radius:10px;background:rgba(0,0,0,0.5);color:#e6edf3;border:1px solid rgba(255,255,255,0.2);font:14px monospace;">Cancel</button>
    </div>
	<!-- Phase 5: Virtual joystick and action buttons -->
	<div id="vj" style="position:fixed;left:16px;bottom:16px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.24);display:flex;align-items:center;justify-content:center;z-index:1100;">
		<div id="vj-knob" style="width:70px;height:70px;border-radius:50%;background:rgba(0,212,255,0.90);box-shadow:0 0 20px rgba(0,212,255,0.65);"></div>
	</div>
	<div style="position:fixed;right:16px;bottom:16px;display:flex;gap:14px;z-index:1100;">
		<button id="btn-interact" style="min-width:80px;min-height:80px;border-radius:14px;background:rgba(0,0,0,0.50);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:16px monospace;">Interact</button>
		<button id="btn-jump" style="min-width:80px;min-height:80px;border-radius:14px;background:rgba(0,0,0,0.50);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:16px monospace;">Jump</button>
	</div>
	<script type="module">
	// Use CDN module to avoid MIME issues with local backup extension
	import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

	const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, Math.max(1, window.devicePixelRatio || 1)));
// Color/tone mapping for consistent mobile brightness
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

	const scene = new THREE.Scene();
	// Warehouse atmosphere - stark white with high contrast
	scene.background = new THREE.Color(0xf0f0f0);
	renderer.setClearColor(0xf0f0f0, 1);

	const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
	camera.position.set(0, 2, 6); // Start higher to see warehouse better

	// Phase 2: Simple drag camera controls with damping
	let isPointerDown = false;
	let lastX = 0, lastY = 0;
	let yaw = 0, pitch = 0;
	let targetYaw = 0, targetPitch = 0;
	const minPitch = -Math.PI/3, maxPitch = Math.PI/3;
const damping = 0.12;
let isFirstPerson = false;
let cameraRadius = 4.0;
const minCameraRadius = 2.0, maxCameraRadius = 12.0;

function updateCamera(){
    yaw += (targetYaw - yaw) * damping;
    pitch += (targetPitch - pitch) * damping;
    // Hide player in first-person to avoid obstructing view
    if (isFirstPerson) {
        try { player.visible = false; } catch {}
        // First-person: camera at head height
        const headY = 1.5;
        const dirX = Math.sin(yaw) * Math.cos(pitch);
        const dirY = Math.sin(pitch);
        const dirZ = Math.cos(yaw) * Math.cos(pitch);
        camera.position.set(player.position.x, player.position.y + headY, player.position.z);
        camera.lookAt(player.position.x + dirX, player.position.y + headY + dirY, player.position.z + dirZ);
    } else {
        try { player.visible = true; } catch {}
        // Keep camera BEHIND player based on yaw/pitch; look over-the-shoulder
        const r = cameraRadius;
        const offX = -Math.sin(yaw) * Math.cos(pitch) * r;
        const offY = 1.4 + Math.sin(pitch) * r; // slightly above head
        const offZ = -Math.cos(yaw) * Math.cos(pitch) * r;
        camera.position.set(player.position.x + offX, player.position.y + offY, player.position.z + offZ);
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
    }
}

	function onPointerDown(x, y){ isPointerDown = true; lastX = x; lastY = y; }
	function onPointerMove(x, y){
		if (!isPointerDown) return;
		const dx = x - lastX; const dy = y - lastY; lastX = x; lastY = y;
		// Sensitivity tuned for mobile portrait
		targetYaw -= dx * 0.005;
		targetPitch -= dy * 0.004;
		if (targetPitch < minPitch) targetPitch = minPitch;
		if (targetPitch > maxPitch) targetPitch = maxPitch;
	}
	function onPointerUp(){ isPointerDown = false; }

	canvas.addEventListener('mousedown', (e)=>{ onPointerDown(e.clientX, e.clientY); });
	window.addEventListener('mousemove', (e)=>{ onPointerMove(e.clientX, e.clientY); });
	window.addEventListener('mouseup', onPointerUp);
	canvas.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; onPointerDown(t.clientX, t.clientY); }, { passive:false });
// Touch move with pinch-to-zoom support
canvas.addEventListener('touchmove', (e)=>{
    if (e.touches.length === 2) {
        // Pinch zoom modifies cameraRadius (third person only)
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (!canvas._pinchLast) canvas._pinchLast = dist;
        const delta = dist - canvas._pinchLast;
        canvas._pinchLast = dist;
        cameraRadius = Math.min(maxCameraRadius, Math.max(minCameraRadius, cameraRadius - delta * 0.01));
        e.preventDefault();
    } else {
        canvas._pinchLast = undefined;
        const t=e.touches[0]; onPointerMove(t.clientX, t.clientY); e.preventDefault();
    }
}, { passive:false });
	canvas.addEventListener('touchend', onPointerUp, { passive:false });

// Tap-to-interact via raycast
const raycaster = new THREE.Raycaster();
const tapVec = new THREE.Vector2();
function canvasPointToNDC(x,y){
    const rect = canvas.getBoundingClientRect();
    tapVec.x = ((x - rect.left) / rect.width) * 2 - 1;
    tapVec.y = -((y - rect.top) / rect.height) * 2 + 1;
}
function handleTap(x,y){
    canvasPointToNDC(x,y);
    raycaster.setFromCamera(tapVec, camera);
    // Include NPC click colliders in raycast targets
    const targets = [p1,p2,p3,npc1,npc2,npc3,...npcClickColliders];
    const intersects = raycaster.intersectObjects(targets, true);
    if (intersects.length){
        const obj = intersects[0].object;
        // Handle NPC click colliders first
        if (obj.userData?.type === 'npc') {
            const npc = obj.userData.npc;
            try {
                const s=document.getElementById('status'); s.textContent='Interact: ' + (npc.userData?.label || 'NPC'); setTimeout(()=>{ s.textContent='running'; }, 900);
            } catch {}
            return;
        }
        let root = obj; while (root.parent && targets.indexOf(root) === -1) root = root.parent;
        if (targets.indexOf(root) !== -1){
            if (root === p1 || root === p2 || root === p3) { animate._nearPortal = root; doInteract(); }
            else {
                // Set hint and toast for NPC
                try {
                    const s=document.getElementById('status'); s.textContent='Interact: ' + (root.userData?.label || 'NPC'); setTimeout(()=>{ s.textContent='running'; }, 900);
                } catch {}
            }
        }
    }
}
canvas.addEventListener('click', (e)=>{ resumeAudio(); handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchend', (e)=>{ resumeAudio(); if (e.changedTouches && e.changedTouches[0]) handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive:true });
// Also allow tapping NPC via hint state
document.getElementById('hint')?.addEventListener('click', ()=>{
    try {
        resumeAudio();
        if (animate._nearPortal) { doInteract(); return; }
        if (animate._nearNPC) { doInteract(); return; }
    } catch {}
});

// Phase 7: Harsh fluorescent warehouse lighting
function createWarehouseLighting() {
    // Harsh fluorescent overhead lighting
    const fluorescent1 = new THREE.DirectionalLight(0xffffff, 1.2);
    fluorescent1.position.set(0, 10, 0);
    fluorescent1.target.position.set(0, 0, 0);
    scene.add(fluorescent1);
    scene.add(fluorescent1.target);
    
    // Secondary fluorescent for even coverage
    const fluorescent2 = new THREE.DirectionalLight(0xf8f8ff, 0.8);
    fluorescent2.position.set(5, 8, 5);
    fluorescent2.target.position.set(0, 0, 0);
    scene.add(fluorescent2);
    scene.add(fluorescent2.target);
    
    // Harsh side lighting for dramatic shadows
    const sideLight = new THREE.DirectionalLight(0xffffff, 0.6);
    sideLight.position.set(-8, 6, 0);
    sideLight.target.position.set(0, 0, 0);
    scene.add(sideLight);
    scene.add(sideLight.target);
    
    // Minimal ambient to prevent pure black shadows
    const ambient = new THREE.AmbientLight(0x404040, 0.3);
    scene.add(ambient);
    
    return { fluorescent1, fluorescent2, sideLight, ambient };
}

// Create warehouse lighting
const warehouseLights = createWarehouseLighting();

	// Phase 7: Low-poly humanoid player character
	function createPlayerCharacter() {
		const playerGroup = new THREE.Group();
		
		// Purple player material
		const playerMaterial = new THREE.MeshStandardMaterial({ 
			color: 0x800080, 
			roughness: 0.8, 
			metalness: 0.0,
			emissive: 0x220022,
			emissiveIntensity: 0.12
		});
		
		// Build from feet up; origin at feet on ground
		// Feet - minimal wedges resting on y=0
		const leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.22), playerMaterial);
		leftFoot.position.set(-0.1, 0.03, 0.05);
		playerGroup.add(leftFoot);
		const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.22), playerMaterial);
		rightFoot.position.set(0.1, 0.03, 0.05);
		playerGroup.add(rightFoot);

		// Legs - rectangular prisms for clean geometry
		const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), playerMaterial);
		leftLeg.position.set(-0.1, 0.33, 0);
		playerGroup.add(leftLeg);
		const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), playerMaterial);
		rightLeg.position.set(0.1, 0.33, 0);
		playerGroup.add(rightLeg);

		// Torso - tapered box
		const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.65, 0.22), playerMaterial);
		torso.position.set(0, 0.85, 0);
		playerGroup.add(torso);

		// Arms - clean extruded boxes in idle pose
		const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.12), playerMaterial);
		leftArm.position.set(-0.31, 0.95, 0);
		playerGroup.add(leftArm);
		const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.12), playerMaterial);
		rightArm.position.set(0.31, 0.95, 0);
		playerGroup.add(rightArm);

		// Hands - minimal blocks
		const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.10, 0.10), playerMaterial);
		leftHand.position.set(-0.31, 0.65, 0);
		playerGroup.add(leftHand);
		const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.10, 0.10), playerMaterial);
		rightHand.position.set(0.31, 0.65, 0);
		playerGroup.add(rightHand);

		// Head - rounded cube/capsule proxy
		const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.32, 0.3), playerMaterial);
		head.position.set(0, 1.3, 0);
		playerGroup.add(head);
		
		// Set up player group properties; feet at y=0
		playerGroup.position.set(0, 0, 0);
		playerGroup.userData = { type: 'player' };
		
		return playerGroup;
	}
	
	const player = createPlayerCharacter();
	player.position.set(0, 0, 2); // Spawn clear of pillars
	scene.add(player);

	// Phase 5: movement state
	const move = { x: 0, z: 0 };
	const moveSpeed = 1.8; // m/s
	// Simple jump physics
	let velY = 0; const gravity = -9.8; const groundY = 0.0;

// Phase 7: Warehouse Environment - Massive brutalist warehouse
function createWarehouseEnvironment() {
    const warehouseGroup = new THREE.Group();
    
    // Warehouse dimensions: 40ft ceilings, 100ft x 80ft floor
    const WAREHOUSE_WIDTH = 30;  // 100ft in meters
    const WAREHOUSE_LENGTH = 24; // 80ft in meters  
    const WAREHOUSE_HEIGHT = 12; // 40ft in meters
    
    // White concrete material with subtle weathering
    const concreteMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.9,
        metalness: 0.0,
        emissive: 0x000000,
        emissiveIntensity: 0.0
    });
    
    // Polished concrete floor with slight reflectivity
    const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0xf0f0f0,
        roughness: 0.1,
        metalness: 0.0,
        emissive: 0x000000,
        emissiveIntensity: 0.0
    });
    
    // Floor - polished concrete
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(WAREHOUSE_WIDTH, WAREHOUSE_LENGTH),
        floorMaterial
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = 0;
    warehouseGroup.add(floor);
    
    // Walls - stark white concrete
    const wallThickness = 0.5;
    
    // North wall
    const northWall = new THREE.Mesh(
        new THREE.BoxGeometry(WAREHOUSE_WIDTH + wallThickness*2, WAREHOUSE_HEIGHT, wallThickness),
        concreteMaterial
    );
    northWall.position.set(0, WAREHOUSE_HEIGHT/2, -WAREHOUSE_LENGTH/2 - wallThickness/2);
    warehouseGroup.add(northWall);
    
    // South wall  
    const southWall = new THREE.Mesh(
        new THREE.BoxGeometry(WAREHOUSE_WIDTH + wallThickness*2, WAREHOUSE_HEIGHT, wallThickness),
        concreteMaterial
    );
    southWall.position.set(0, WAREHOUSE_HEIGHT/2, WAREHOUSE_LENGTH/2 + wallThickness/2);
    warehouseGroup.add(southWall);
    
    // East wall
    const eastWall = new THREE.Mesh(
        new THREE.BoxGeometry(wallThickness, WAREHOUSE_HEIGHT, WAREHOUSE_LENGTH),
        concreteMaterial
    );
    eastWall.position.set(WAREHOUSE_WIDTH/2 + wallThickness/2, WAREHOUSE_HEIGHT/2, 0);
    warehouseGroup.add(eastWall);
    
    // West wall
    const westWall = new THREE.Mesh(
        new THREE.BoxGeometry(wallThickness, WAREHOUSE_HEIGHT, WAREHOUSE_LENGTH),
        concreteMaterial
    );
    westWall.position.set(-WAREHOUSE_WIDTH/2 - wallThickness/2, WAREHOUSE_HEIGHT/2, 0);
    warehouseGroup.add(westWall);
    
    // Geometric support pillars - dramatic shadows
    const pillarMaterial = new THREE.MeshStandardMaterial({
        color: 0xf5f5f5,
        roughness: 0.8,
        metalness: 0.0
    });
    
    // Create grid of pillars
    const pillarPositions = [
        [-8, 0, -6], [0, 0, -6], [8, 0, -6],
        [-8, 0, 0], /* removed center [0,0,0] */ [8, 0, 0], 
        [-8, 0, 6], [0, 0, 6], [8, 0, 6]
    ];
    
    pillarPositions.forEach(([x, y, z]) => {
        const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.25, WAREHOUSE_HEIGHT, 8),
            pillarMaterial
        );
        pillar.position.set(x, WAREHOUSE_HEIGHT/2, z);
        warehouseGroup.add(pillar);
    });
    
    // Ceiling - white concrete
    const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(WAREHOUSE_WIDTH, WAREHOUSE_LENGTH),
        concreteMaterial
    );
    ceiling.rotation.x = Math.PI/2;
    ceiling.position.y = WAREHOUSE_HEIGHT;
    warehouseGroup.add(ceiling);
    
    // Industrial details - exposed beams and pipes
    const beamMaterial = new THREE.MeshStandardMaterial({
        color: 0xe0e0e0,
        roughness: 0.7,
        metalness: 0.3
    });
    
    // Exposed ceiling beams
    for (let i = -2; i <= 2; i++) {
        const beam = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.3, WAREHOUSE_LENGTH),
            beamMaterial
        );
        beam.position.set(i * 6, WAREHOUSE_HEIGHT - 0.5, 0);
        warehouseGroup.add(beam);
    }
    
    // Industrial pipes along walls
    const pipeMaterial = new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.4,
        metalness: 0.6
    });
    
    // North wall pipes
    for (let i = 0; i < 3; i++) {
        const pipe = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, WAREHOUSE_WIDTH * 0.8, 8),
            pipeMaterial
        );
        pipe.rotation.z = Math.PI/2;
        pipe.position.set(0, 2 + i * 2, -WAREHOUSE_LENGTH/2 - 0.3);
        warehouseGroup.add(pipe);
    }
    
    // Add edge lines to make structure more visible
    const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xcccccc });
    
    // Floor edges
    const floorGeometry = new THREE.BufferGeometry();
    const floorPoints = [
        new THREE.Vector3(-WAREHOUSE_WIDTH/2, 0, -WAREHOUSE_LENGTH/2),
        new THREE.Vector3(WAREHOUSE_WIDTH/2, 0, -WAREHOUSE_LENGTH/2),
        new THREE.Vector3(WAREHOUSE_WIDTH/2, 0, WAREHOUSE_LENGTH/2),
        new THREE.Vector3(-WAREHOUSE_WIDTH/2, 0, WAREHOUSE_LENGTH/2),
        new THREE.Vector3(-WAREHOUSE_WIDTH/2, 0, -WAREHOUSE_LENGTH/2)
    ];
    floorGeometry.setFromPoints(floorPoints);
    const floorEdges = new THREE.Line(floorGeometry, edgeMaterial);
    warehouseGroup.add(floorEdges);
    
    return warehouseGroup;
}

// Create warehouse environment
const warehouse = createWarehouseEnvironment();
scene.add(warehouse);

// Phase 8: Spirit Lens centerpiece
function createSpiritLens(){
    const g = new THREE.Group();
    const cyan = 0x00e6ff;
    const coreMat = new THREE.MeshStandardMaterial({ color: cyan, emissive: 0x003344, emissiveIntensity: 1.2, roughness: 0.2, metalness: 0.0 });
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), coreMat);
    core.position.y = 1.1; g.add(core);
    // Pedestal
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.4,12), new THREE.MeshStandardMaterial({ color: 0x888888, roughness:0.8 }));
    ped.position.y = 0.2; g.add(ped);
    // Light rays (billboards)

	// Phase 5: joystick logic
	(function(){
		const base = document.getElementById('vj');
		const knob = document.getElementById('vj-knob');
		if (!base || !knob) return;
		const radius = 72;
		let active = false;
		function setKnob(dx, dy){ knob.style.transform = 'translate('+dx+'px,'+dy+'px)'; }
		function start(x, y){ active = true; move.x = 0; move.z = 0; }
		function moveTo(x, y){
			if (!active) return;
			const r = base.getBoundingClientRect();
			const cx = r.left + r.width/2;
			const cy = r.top + r.height/2;
			let dx = x - cx, dy = y - cy;
			const d = Math.hypot(dx, dy);
			if (d > radius) { const a = Math.atan2(dy, dx); dx = Math.cos(a)*radius; dy = Math.sin(a)*radius; }
			setKnob(dx*0.6, dy*0.6);
			// map to [-1,1]
			move.x = dx / radius;
			move.z = -dy / radius;
		}
		function end(){ active = false; move.x = 0; move.z = 0; setKnob(0,0); }
		base.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; start(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
		base.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; moveTo(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
		base.addEventListener('touchend', (e)=>{ end(); e.preventDefault(); }, { passive:false });
		base.addEventListener('mousedown', (e)=>{ start(e.clientX, e.clientY); });
		window.addEventListener('mousemove', (e)=>{ moveTo(e.clientX, e.clientY); });
		window.addEventListener('mouseup', end);
	})();

	// Phase 6: Audio System
	const audioContext = new (window.AudioContext || window.webkitAudioContext)();
	
	// Simple audio feedback functions
	function playJumpSound() {
		const oscillator = audioContext.createOscillator();
		const gainNode = audioContext.createGain();
		oscillator.connect(gainNode);
		gainNode.connect(audioContext.destination);
		oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
		oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
		gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
		gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
		oscillator.start(audioContext.currentTime);
		oscillator.stop(audioContext.currentTime + 0.2);
	}
	
	function playInteractSound() {
		const oscillator = audioContext.createOscillator();
		const gainNode = audioContext.createGain();
		oscillator.connect(gainNode);
		gainNode.connect(audioContext.destination);
		oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
		oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.15);
		gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
		gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
		oscillator.start(audioContext.currentTime);
		oscillator.stop(audioContext.currentTime + 0.15);
	}
	
	function playAmbientSound() {
		// Gentle ambient tone
		const oscillator = audioContext.createOscillator();
		const gainNode = audioContext.createGain();
		const filter = audioContext.createBiquadFilter();
		oscillator.connect(filter);
		filter.connect(gainNode);
		gainNode.connect(audioContext.destination);
		oscillator.frequency.setValueAtTime(60, audioContext.currentTime);
		filter.type = 'lowpass';
		filter.frequency.setValueAtTime(200, audioContext.currentTime);
		gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
		oscillator.start(audioContext.currentTime);
		return { oscillator, gainNode };
	}
	
	// Start ambient sound
	let ambientSound = null;
	function startAmbient() {
		if (!ambientSound) {
			ambientSound = playAmbientSound();
		}
	}
	
	// Resume audio context on first user interaction

			audioContext.resume();
		}
		startAmbient();
	}
	
	// Phase 5: action buttons
// Larger touch targets: handle both click and touchstart
const btnJump = document.getElementById('btn-jump');
const btnInteract = document.getElementById('btn-interact');
function doJump(){ 
	if (velY <= 0.01 && player.position.y <= groundY + 0.02) { 
		velY = 4.8; 
		playJumpSound();
	} 
}
function doInteract(){
    try {
        if (animate._nearPortal) {
            const label = animate._nearPortal.userData?.label || 'Portal';
            const confirmEl = document.getElementById('confirm');
            const txt = document.getElementById('confirm-text');
            txt.textContent = 'Open ' + label + ' in new tab?';
            confirmEl.style.display = 'inline-flex';
            confirmEl._target = label;
        } else if (animate._nearNPC) {
            const label = animate._nearNPC.userData?.label || 'NPC';
            const s=document.getElementById('status'); s.textContent='Interact: ' + label; setTimeout(()=>{ s.textContent='running'; }, 900);
            playInteractSound();
        } else {
            const s=document.getElementById('status'); s.textContent='Nothing nearby'; setTimeout(()=>{ s.textContent='running'; }, 600);
        }
    } catch {}
}
if (btnJump){ btnJump.addEventListener('click', ()=>{ resumeAudio(); doJump(); }); btnJump.addEventListener('touchstart', (e)=>{ e.preventDefault(); resumeAudio(); doJump(); }, { passive:false }); }
if (btnInteract){ btnInteract.addEventListener('click', ()=>{ resumeAudio(); doInteract(); }); btnInteract.addEventListener('touchstart', (e)=>{ e.preventDefault(); resumeAudio(); doInteract(); }, { passive:false }); }

// Fullscreen handler
(function(){
    const btn = document.getElementById('btn-fullscreen');
    if (!btn) return;
    async function goFullscreen(){
        try {
            const el = document.documentElement;
            if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
            else if (document.body.requestFullscreen) await document.body.requestFullscreen();
            try { await screen.orientation.lock('landscape'); } catch {}
        } catch (e) {
            try { setTimeout(()=>window.scrollTo(0,1), 50); } catch {}
        }
    }
    function exitFullscreen(){ try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }
    function updateFsLabel(){ btn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen'; }
    btn.addEventListener('click', ()=>{ document.fullscreenElement ? exitFullscreen() : goFullscreen(); });
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); document.fullscreenElement ? exitFullscreen() : goFullscreen(); }, { passive:false });
    document.addEventListener('fullscreenchange', updateFsLabel);
    updateFsLabel();
})();

// View toggle (1st/3rd person) - preserve yaw/pitch via camera direction
(function(){
    const btn = document.getElementById('btn-view');
    if (!btn) return;
    function update(){ btn.textContent = 'View: ' + (isFirstPerson ? '1st' : '3rd'); }
    function toggle(){
        // Derive yaw/pitch from current camera direction to avoid flips
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        // Convert to yaw/pitch (XZ yaw, Y pitch)
        const newYaw = Math.atan2(dir.x, dir.z);
        const newPitch = Math.asin(THREE.MathUtils.clamp(dir.y, -1, 1));
        yaw = targetYaw = newYaw;
        pitch = targetPitch = THREE.MathUtils.clamp(newPitch, minPitch, maxPitch);
        // Flip mode
        isFirstPerson = !isFirstPerson;
        update();
    }
    btn.addEventListener('click', toggle);
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); toggle(); }, { passive:false });
    update();
})();

// Confirm open handler (routes)
(function(){
    const box = document.getElementById('confirm');
    const btnOpen = document.getElementById('confirm-open');
    const btnCancel = document.getElementById('confirm-cancel');
    if (!box || !btnOpen || !btnCancel) return;
    function routeFor(label){
        if (/Spirit Tamer/i.test(label)) return '/site/#spirit-tamer';
        if (/Toppler/i.test(label)) return '/site/#toppler';
        if (/Witcher Grove/i.test(label)) return '/site/grove.html';
        return '/';
    }
    btnOpen.addEventListener('click', ()=>{
        const label = box._target || '';
        const href = routeFor(label);
        try { window.open(href, '_blank', 'noopener'); } catch {}
        box.style.display = 'none';
    });
    btnCancel.addEventListener('click', ()=>{ box.style.display = 'none'; });
    btnOpen.addEventListener('touchstart', (e)=>{ e.preventDefault(); btnOpen.click(); }, { passive:false });
    btnCancel.addEventListener('touchstart', (e)=>{ e.preventDefault(); btnCancel.click(); }, { passive:false });
})();
	</script>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RenderWorld Three.js Cube Test</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
	<style>
		html, body { margin:0; padding:0; height:100%; height:100dvh; background:#000; overflow:hidden; }
		#c { position:fixed; inset:0; width:100vw; height:100dvh; display:block; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script>
    (function(){
      var canvas = document.getElementById('c');
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(2, Math.max(1, window.devicePixelRatio || 1)));
      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
      camera.position.set(0, 0, 3);
      camera.lookAt(0,0,0);
      function fit(){ var w=window.innerWidth, h=(window.visualViewport?Math.round(window.visualViewport.height):window.innerHeight); renderer.setSize(w,h,true); camera.aspect=w/h; camera.updateProjectionMatrix(); }
      window.addEventListener('resize', fit); fit();
      var light = new THREE.DirectionalLight(0xffffff, 1.0); light.position.set(3,5,2); scene.add(light);
      var amb = new THREE.AmbientLight(0x404040, 0.9); scene.add(amb);
      // Cube
      var geo = new THREE.BoxGeometry(1,1,1);
      var mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness:0.4, metalness:0.1 });
      var cube = new THREE.Mesh(geo, mat); scene.add(cube);
      // Ground plane
      var gPlane = new THREE.PlaneGeometry(20, 20);
      var mPlane = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0, metalness: 0.0 });
      var ground = new THREE.Mesh(gPlane, mPlane); ground.rotation.x = -Math.PI/2; ground.position.y = -1; scene.add(ground);
      // Portal markers (bright, always-visible)
      function portal(color){
        var mat = new THREE.MeshBasicMaterial({ color: color });
        var m = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,1.6,24), mat);
        // glow ring
        var ringMat = new THREE.MeshBasicMaterial({ color: color, transparent:true, opacity:0.35 });
        var ring = new THREE.Mesh(new THREE.RingGeometry(0.35,0.6,32), ringMat);
        ring.rotation.x = -Math.PI/2; ring.position.y = -0.8; m.add(ring);
        // point light to accent cube/ground
        var pl = new THREE.PointLight(color, 0.7, 6);
        pl.position.set(0,0.6,0);
        m.add(pl);
        return m;
      }
      var p1 = portal(0x4488ff); p1.position.set(-2, 0, -2); scene.add(p1);
      var p2 = portal(0x44ff88); p2.position.set( 0, 0, -2); scene.add(p2);
      var p3 = portal(0xff4488); p3.position.set( 2, 0, -2); scene.add(p3);
      function animate(t){ cube.rotation.y = t*0.001; cube.rotation.x = t*0.0007; renderer.render(scene, camera); requestAnimationFrame(animate); }
      requestAnimationFrame(animate);
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RenderWorld Hub</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
	<style>
		html, body { margin:0; padding:0; height:100%; height:100dvh; background:#000; overflow:hidden; }
		#gameCanvas { position:fixed; inset:0; width:100vw; height:100dvh; display:block; }
		#status { position:fixed; left:8px; bottom:8px; color:#7fffd4; font:12px monospace; background:rgba(0,0,0,0.5); padding:6px 8px; border-radius:4px; }
		#joystick { position:fixed; left:16px; bottom:16px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
		#joystickKnob { width:56px; height:56px; border-radius:50%; background:rgba(0, 212, 255, 0.8); box-shadow:0 0 15px rgba(0,212,255,0.5); }
		#portalLinks { position:fixed; left:50%; transform:translateX(-50%); bottom:140px; display:flex; gap:12px; }
		#portalLinks a { text-decoration:none; color:#00ff88; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.12); padding:10px 14px; border-radius:8px; font-weight:600; }
	</style>
</head>
<body>
	<canvas id="gameCanvas"></canvas>
	<div id="status" style="position:fixed;left:8px;bottom:8px;color:#7fffd4;font:12px monospace;background:rgba(0,0,0,0.5);padding:6px 8px;border-radius:4px;">loading…</div>
	<div id="hud" style="position:fixed;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font:14px monospace;color:#e6edf3;background:rgba(0,0,0,0.45);backdrop-filter:saturate(120%) blur(2px);-webkit-backdrop-filter:saturate(120%) blur(2px);pointer-events:none;z-index:1000;text-shadow:0 1px 2px rgba(0,0,0,0.8);">
		<span id="hud-pos">pos 0.0, 0.0</span>
		<span id="hud-fps">60 fps</span>
	</div>
	<!-- Phase 5: Virtual joystick and action buttons -->
	<div id="vj" style="position:fixed;left:16px;bottom:16px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;z-index:900;">
		<div id="vj-knob" style="width:58px;height:58px;border-radius:50%;background:rgba(0,212,255,0.85);box-shadow:0 0 16px rgba(0,212,255,0.6);"></div>
	</div>
	<div style="position:fixed;right:16px;bottom:16px;display:flex;gap:12px;z-index:900;">
		<button id="btn-interact" style="min-width:64px;min-height:64px;border-radius:12px;background:rgba(0,0,0,0.45);color:#e6edf3;border:1px solid rgba(255,255,255,0.18);font:14px monospace;">Interact</button>
		<button id="btn-jump" style="min-width:64px;min-height:64px;border-radius:12px;background:rgba(0,0,0,0.45);color:#e6edf3;border:1px solid rgba(255,255,255,0.18);font:14px monospace;">Jump</button>
	</div>
	<script type="module">
	// Use CDN module to avoid MIME issues with local backup extension
	import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

	const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, Math.max(1, window.devicePixelRatio || 1)));
// Color/tone mapping for consistent mobile brightness
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

	const scene = new THREE.Scene();
	scene.background = new THREE.Color(0x002a1a);
	renderer.setClearColor(0x002a1a, 1);

	const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
	camera.position.set(0, 1.5, 4);

	// Phase 2: Simple drag camera controls with damping
	let isPointerDown = false;
	let lastX = 0, lastY = 0;
	let yaw = 0, pitch = 0;
	let targetYaw = 0, targetPitch = 0;
	const minPitch = -Math.PI/3, maxPitch = Math.PI/3;
	const damping = 0.12;

	function updateCamera(){
		yaw += (targetYaw - yaw) * damping;
		pitch += (targetPitch - pitch) * damping;
		const radius = 4;
		const cx = Math.sin(yaw) * Math.cos(pitch) * radius;
		const cy = Math.sin(pitch) * radius + 1.2;
		const cz = Math.cos(yaw) * Math.cos(pitch) * radius;
		camera.position.set(cx, cy, cz);
		camera.lookAt(0, 0.8, 0);
	}

	function onPointerDown(x, y){ isPointerDown = true; lastX = x; lastY = y; }
	function onPointerMove(x, y){
		if (!isPointerDown) return;
		const dx = x - lastX; const dy = y - lastY; lastX = x; lastY = y;
		// Sensitivity tuned for mobile portrait
		targetYaw -= dx * 0.005;
		targetPitch -= dy * 0.004;
		if (targetPitch < minPitch) targetPitch = minPitch;
		if (targetPitch > maxPitch) targetPitch = maxPitch;
	}
	function onPointerUp(){ isPointerDown = false; }

	canvas.addEventListener('mousedown', (e)=>{ onPointerDown(e.clientX, e.clientY); });
	window.addEventListener('mousemove', (e)=>{ onPointerMove(e.clientX, e.clientY); });
	window.addEventListener('mouseup', onPointerUp);
	canvas.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; onPointerDown(t.clientX, t.clientY); }, { passive:false });
	canvas.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; onPointerMove(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
	canvas.addEventListener('touchend', onPointerUp, { passive:false });

// Lighting setup (hemi + key + gentle fill)
const hemi = new THREE.HemisphereLight(0xe0ffe0, 0x103018, 0.8); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(3,5,2); key.castShadow = false; scene.add(key);
const fill = new THREE.DirectionalLight(0x88c0a8, 0.35); fill.position.set(-4,3,-2); scene.add(fill);

	const cube = new THREE.Mesh(
		new THREE.BoxGeometry(1,1,1),
		new THREE.MeshStandardMaterial({ color: 0x00ff66, roughness: 0.4, metalness: 0.1, emissive: 0x003311, emissiveIntensity: 0.6 })
	);
	cube.position.set(0,0.75,0);
	scene.add(cube);

	// Phase 5: movement state
	const move = { x: 0, z: 0 };
	const moveSpeed = 1.5; // m/s

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(32,32, 1,1),
    new THREE.MeshStandardMaterial({ color: 0x0a1f17, roughness: 0.95, metalness: 0.0 })
);
	ground.rotation.x = -Math.PI/2;
	ground.position.y = 0;
	scene.add(ground);

	function fit(){
		const w = window.innerWidth;
		const h = (window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight);
		renderer.setSize(w, h, true);
		camera.aspect = w / h;
		camera.updateProjectionMatrix();
	}
	window.addEventListener('resize', fit); fit();

	function animate(t){
		const tt = t * 0.001;
		cube.rotation.y = tt * 0.8;
		cube.position.y = 0.75 + Math.sin(tt * 2.0) * 0.25;
		// apply movement in camera-aligned XZ (yaw only)
		if (move.x !== 0 || move.z !== 0) {
			const dt = (animate._lastFrame ? (t - animate._lastFrame) : 16.6) / 1000;
			const dirYaw = yaw; // align with camera yaw
			const sx = Math.cos(dirYaw) * move.z + Math.sin(dirYaw) * move.x;
			const sz = Math.cos(dirYaw) * move.x - Math.sin(dirYaw) * move.z;
			cube.position.x += sx * moveSpeed * dt;
			cube.position.z += sz * moveSpeed * dt;
		}
		animate._lastFrame = t;
		updateCamera();
		renderer.render(scene, camera);
		// HUD updates
		try {
			const pos = cube.position;
			document.getElementById('hud-pos').textContent = 'pos ' + pos.x.toFixed(1) + ', ' + pos.z.toFixed(1);
		} catch {}
		try {
			if (!animate._last) animate._last = t, animate._frames = 0;
			animate._frames++;
			if (t - animate._last > 1000) {
				document.getElementById('hud-fps').textContent = Math.round(animate._frames * 1000 / (t - animate._last)) + ' fps';
				animate._last = t; animate._frames = 0;
			}
		} catch {}
		requestAnimationFrame(animate);
	}
	requestAnimationFrame(animate);
	try { document.getElementById('status').textContent = 'running'; } catch {}

	// Phase 5: joystick logic
	(function(){
		const base = document.getElementById('vj');
		const knob = document.getElementById('vj-knob');
		if (!base || !knob) return;
		const radius = 56;
		let active = false;
		function setKnob(dx, dy){ knob.style.transform = 'translate('+dx+'px,'+dy+'px)'; }
		function start(x, y){ active = true; move.x = 0; move.z = 0; }
		function moveTo(x, y){
			if (!active) return;
			const r = base.getBoundingClientRect();
			const cx = r.left + r.width/2;
			const cy = r.top + r.height/2;
			let dx = x - cx, dy = y - cy;
			const d = Math.hypot(dx, dy);
			if (d > radius) { const a = Math.atan2(dy, dx); dx = Math.cos(a)*radius; dy = Math.sin(a)*radius; }
			setKnob(dx*0.6, dy*0.6);
			// map to [-1,1]
			move.x = dx / radius;
			move.z = -dy / radius;
		}
		function end(){ active = false; move.x = 0; move.z = 0; setKnob(0,0); }
		base.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; start(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
		base.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; moveTo(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
		base.addEventListener('touchend', (e)=>{ end(); e.preventDefault(); }, { passive:false });
		base.addEventListener('mousedown', (e)=>{ start(e.clientX, e.clientY); });
		window.addEventListener('mousemove', (e)=>{ moveTo(e.clientX, e.clientY); });
		window.addEventListener('mouseup', end);
	})();

	// Phase 5: action buttons
	document.getElementById('btn-jump')?.addEventListener('click', ()=>{
		cube.position.y += 0.4;
		setTimeout(()=>{ cube.position.y = Math.max(0.75, cube.position.y - 0.4); }, 180);
	});
	document.getElementById('btn-interact')?.addEventListener('click', ()=>{
		try { document.getElementById('status').textContent = 'interact'; setTimeout(()=>{ document.getElementById('status').textContent='running'; }, 600); } catch {}
	});
	</script>
</body>
</html>

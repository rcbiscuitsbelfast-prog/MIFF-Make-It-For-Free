    <!-- Simple test script first -->
    <script>
        // Basic test - should work on any browser
        document.addEventListener('DOMContentLoaded', function() {
            const debug = document.getElementById('debug');
            if (debug) {
                debug.textContent = 'JS working!';
                debug.style.color = '#00ff00';
            }
            
            // Test start button
            setTimeout(function() {
                const startBtn = document.getElementById('sm-start');
                if (debug) {
                    debug.textContent = 'Start btn: ' + (startBtn ? 'found' : 'missing');
                }
                
                if (startBtn) {
                    startBtn.onclick = function() {
                        if (debug) debug.textContent = 'Start clicked!';
                        // Hide start menu - try multiple methods
                        const menu = document.getElementById('start-menu');
                        if (menu) {
                            menu.style.display = 'none';
                            menu.style.visibility = 'hidden';
                            menu.style.opacity = '0';
                            menu.style.pointerEvents = 'none';
                            if (debug) debug.textContent = 'Menu hidden!';
                        }
                        
                        // Test if 3D scene is working - show fallback if not
                        setTimeout(function() {
                            const canvas = document.getElementById('gameCanvas');
                            if (canvas) {
                                // Try to get canvas context to test if it's working
                                const ctx = canvas.getContext('2d');
                                if (ctx) {
                                    ctx.fillStyle = '#00ff00';
                                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    ctx.fillStyle = '#ff0000';
                                    ctx.fillRect(50, 50, 100, 100);
                                    if (debug) debug.textContent = 'Fallback 2D test';
                                }
                            }
                        }, 500);
                    };
                    startBtn.style.cursor = 'pointer';
                }
            }, 1000);
            
            // Add handlers for other buttons
            setTimeout(function() {
                const menuBtn = document.getElementById('btn-pause');
                if (menuBtn) {
                    menuBtn.onclick = function() {
                        if (debug) debug.textContent = 'Menu clicked!';
                        // Show start menu again
                        const menu = document.getElementById('start-menu');
                        if (menu) {
                            menu.style.display = 'flex';
                            menu.style.visibility = 'visible';
                            menu.style.opacity = '1';
                            menu.style.pointerEvents = 'auto';
                        }
                    };
                }
                
                const jumpBtn = document.getElementById('btn-jump');
                if (jumpBtn) {
                    jumpBtn.onclick = function() {
                        if (debug) debug.textContent = 'Jump clicked!';
                    };
                }
                
                const interactBtn = document.getElementById('btn-interact');
                if (interactBtn) {
                    interactBtn.onclick = function() {
                        if (debug) debug.textContent = 'Interact clicked!';
                    };
                }
            }, 2000);
        });
    </script>
    
    <script type="module">
	// Test if Three.js loads
	try {
		import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
		console.log('Three.js loaded successfully');
	} catch (error) {
		console.error('Three.js failed to load:', error);
		// Show error in debug panel
		const debug = document.getElementById('debug');
		if (debug) debug.textContent = 'Three.js error: ' + error.message;
	}
	
	// Use CDN module to avoid MIME issues with local backup extension
	import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

	const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, Math.max(1, window.devicePixelRatio || 1)));
// Color/tone mapping for consistent mobile brightness
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

// Make sure canvas is visible
canvas.style.display = 'block';
canvas.style.background = '#000000';

	const scene = new THREE.Scene();
	// Simple test background
	scene.background = new THREE.Color(0x00ff00); // Green background to test visibility
	renderer.setClearColor(0x00ff00, 1);
	
	// Add a simple test cube to verify 3D rendering
	const testGeometry = new THREE.BoxGeometry(1, 1, 1);
	const testMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
	const testCube = new THREE.Mesh(testGeometry, testMaterial);
	testCube.position.set(0, 0, -5);
	scene.add(testCube);

	const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
	camera.position.set(0, 2, 6); // Start higher to see warehouse better

	// Phase 2: Simple drag camera controls with damping
	let isPointerDown = false;
	let lastX = 0, lastY = 0;
	let yaw = 0, pitch = 0;
	let targetYaw = 0, targetPitch = 0;
	const minPitch = -Math.PI/3, maxPitch = Math.PI/3;
const damping = 0.12;
let isFirstPerson = false;
let cameraRadius = 4.0;
const minCameraRadius = 2.0, maxCameraRadius = 12.0;

function updateCamera(){
    yaw += (targetYaw - yaw) * damping;
    pitch += (targetPitch - pitch) * damping;
    // Hide player in first-person to avoid obstructing view
    if (isFirstPerson) {
        try { player.visible = false; } catch {}
        // First-person: camera at head height
        const headY = 1.7;
        const dirX = Math.sin(yaw) * Math.cos(pitch);
        const dirY = Math.sin(pitch);
        const dirZ = Math.cos(yaw) * Math.cos(pitch);
        camera.position.set(player.position.x, player.position.y + headY, player.position.z);
        camera.lookAt(player.position.x + dirX, player.position.y + headY + dirY, player.position.z + dirZ);
    } else {
        try { player.visible = true; } catch {}
        // Keep camera BEHIND player based on yaw/pitch; look over-the-shoulder
        const r = cameraRadius;
        const offX = -Math.sin(yaw) * Math.cos(pitch) * r;
        const offY = 3.0 + Math.sin(pitch) * r; // raise camera to see top of head
        const offZ = -Math.cos(yaw) * Math.cos(pitch) * r;
        camera.position.set(player.position.x + offX, player.position.y + offY, player.position.z + offZ);
        camera.lookAt(player.position.x, player.position.y + 1.4, player.position.z);
    }
}

	function onPointerDown(x, y){ isPointerDown = true; lastX = x; lastY = y; }
	function onPointerMove(x, y){
		if (!isPointerDown) return;
		const dx = x - lastX; const dy = y - lastY; lastX = x; lastY = y;
		// Sensitivity tuned for mobile portrait
		targetYaw -= dx * 0.005;
		targetPitch -= dy * 0.004;
		if (targetPitch < minPitch) targetPitch = minPitch;
		if (targetPitch > maxPitch) targetPitch = maxPitch;
	}
	function onPointerUp(){ isPointerDown = false; }

	canvas.addEventListener('mousedown', (e)=>{ onPointerDown(e.clientX, e.clientY); });
	window.addEventListener('mousemove', (e)=>{ onPointerMove(e.clientX, e.clientY); });
	window.addEventListener('mouseup', onPointerUp);
	canvas.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; onPointerDown(t.clientX, t.clientY); }, { passive:false });
// Touch move with pinch-to-zoom support
canvas.addEventListener('touchmove', (e)=>{
    if (e.touches.length === 2) {
        // Pinch zoom modifies cameraRadius (third person only)
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (!canvas._pinchLast) canvas._pinchLast = dist;
        const delta = dist - canvas._pinchLast;
        canvas._pinchLast = dist;
        cameraRadius = Math.min(maxCameraRadius, Math.max(minCameraRadius, cameraRadius - delta * 0.01));
        e.preventDefault();
    } else {
        canvas._pinchLast = undefined;
        const t=e.touches[0]; onPointerMove(t.clientX, t.clientY); e.preventDefault();
    }
}, { passive:false });
	canvas.addEventListener('touchend', onPointerUp, { passive:false });

// Tap-to-interact via raycast
const raycaster = new THREE.Raycaster();
const tapVec = new THREE.Vector2();
function canvasPointToNDC(x,y){
    const rect = canvas.getBoundingClientRect();
    tapVec.x = ((x - rect.left) / rect.width) * 2 - 1;
    tapVec.y = -((y - rect.top) / rect.height) * 2 + 1;
}
function handleTap(x,y){
    canvasPointToNDC(x,y);
    raycaster.setFromCamera(tapVec, camera);
    // Include NPC click colliders in raycast targets
    const targets = [p2,npc1,npc2,npc3,...npcClickColliders];
    const intersects = raycaster.intersectObjects(targets, true);
    if (intersects.length){
        const obj = intersects[0].object;
        // Handle NPC click colliders first
        if (obj.userData?.type === 'npc') {
            const npc = obj.userData.npc;
            try {
                const s=document.getElementById('status'); s.textContent='Interact: ' + (npc.userData?.label || 'NPC'); setTimeout(()=>{ s.textContent='running'; }, 900);
            } catch {}
            return;
        }
        let root = obj; while (root.parent && targets.indexOf(root) === -1) root = root.parent;
        if (targets.indexOf(root) !== -1){
            if (root === p2) { animate._nearPortal = root; doInteract(); }
            else {
                // Set hint and toast for NPC
                try {
                    const s=document.getElementById('status'); s.textContent='Interact: ' + (root.userData?.label || 'NPC'); setTimeout(()=>{ s.textContent='running'; }, 900);
                } catch {}
            }
        }
    }
}
canvas.addEventListener('click', (e)=>{ resumeAudio(); handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchend', (e)=>{ resumeAudio(); if (e.changedTouches && e.changedTouches[0]) handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive:true });
// Also allow tapping NPC via hint state
document.getElementById('hint')?.addEventListener('click', ()=>{
    try {
        resumeAudio();
        if (animate._nearPortal) { doInteract(); return; }
        if (animate._nearNPC) { doInteract(); return; }
    } catch {}
});

// Phase 7: Harsh fluorescent warehouse lighting
function createWarehouseLighting() {
    // Harsh fluorescent overhead lighting
    const fluorescent1 = new THREE.DirectionalLight(0xffffff, 1.2);
    fluorescent1.position.set(0, 10, 0);
    fluorescent1.target.position.set(0, 0, 0);
    scene.add(fluorescent1);
    scene.add(fluorescent1.target);
    
    // Secondary fluorescent for even coverage
    const fluorescent2 = new THREE.DirectionalLight(0xf8f8ff, 0.8);
    fluorescent2.position.set(5, 8, 5);
    fluorescent2.target.position.set(0, 0, 0);
    scene.add(fluorescent2);
    scene.add(fluorescent2.target);
    
    // Harsh side lighting for dramatic shadows
    const sideLight = new THREE.DirectionalLight(0xffffff, 0.6);
    sideLight.position.set(-8, 6, 0);
    sideLight.target.position.set(0, 0, 0);
    scene.add(sideLight);
    scene.add(sideLight.target);
    
    // Minimal ambient to prevent pure black shadows
    const ambient = new THREE.AmbientLight(0x404040, 0.3);
    scene.add(ambient);
    
    return { fluorescent1, fluorescent2, sideLight, ambient };
}

    // Create lighting (reuse for field)
const warehouseLights = createWarehouseLighting();

	// Phase 7: Low-poly humanoid player character
	function createPlayerCharacter() {
		const playerGroup = new THREE.Group();
		
		// Player material (green)
		const playerMaterial = new THREE.MeshStandardMaterial({ 
			color: 0xffa24d, 
			roughness: 0.8, 
			metalness: 0.0,
			emissive: 0x221100,
			emissiveIntensity: 0.12
		});
		
		// Build from feet up; origin at feet on ground
		// Leg groups anchored at hips; feet attached to legs so they swing together
		const leftLegGroup = new THREE.Group(); leftLegGroup.position.set(-0.1, 0.66, 0);
		const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), playerMaterial);
		leftLeg.position.set(0, -0.3, 0); // center of leg under hip
		leftLegGroup.add(leftLeg);
		const leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.22), playerMaterial);
		leftFoot.position.set(0, -0.63, 0.05);
		leftLegGroup.add(leftFoot);
		playerGroup.add(leftLegGroup);
		const rightLegGroup = new THREE.Group(); rightLegGroup.position.set(0.1, 0.66, 0);
		const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), playerMaterial);
		rightLeg.position.set(0, -0.3, 0);
		rightLegGroup.add(rightLeg);
		const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.22), playerMaterial);
		rightFoot.position.set(0, -0.63, 0.05);
		rightLegGroup.add(rightFoot);
		playerGroup.add(rightLegGroup);

		// Torso - tapered box
		const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.65, 0.22), playerMaterial);
		torso.position.set(0, 0.85, 0);
		playerGroup.add(torso);

    // PlayerStatePure (enhanced with facing, turn-rate, stopping ease, run multiplier)
    function createPlayerState(initial){ 
        return { 
            pos:{ x: initial.x, z: initial.z }, 
            vel:{ x:0, z:0 }, 
            anim:'idle', 
            facing:0,
            turnRate: 0,
            isRunning: false,
            moveSpeed: 1.0,
            runMultiplier: 2.0,
            stoppingEase: 0.85
        }; 
    }
    function reducePlayerAction(state, action){
        const s = { ...state, pos: { ...state.pos }, vel: { ...state.vel } };
        
        if (action.type === 'move' && action.dir){ 
            // Normalize input vector
            const mag = Math.sqrt(action.dir.x * action.dir.x + action.dir.z * action.dir.z);
            if (mag > 0) {
                s.vel.x = (action.dir.x / mag) * s.moveSpeed;
                s.vel.z = (action.dir.z / mag) * s.moveSpeed;
                
                // Apply run multiplier
                if (s.isRunning) {
                    s.vel.x *= s.runMultiplier;
                    s.vel.z *= s.runMultiplier;
                }
                
                // Update facing direction
                s.facing = Math.atan2(action.dir.x, action.dir.z);
                s.anim = s.isRunning ? 'run' : 'walk';
            }
        }
        else if (action.type === 'stop'){ 
            // Stopping ease - gradual deceleration
            s.vel.x *= s.stoppingEase; 
            s.vel.z *= s.stoppingEase; 
            
            // Stop when velocity is very small
            if (Math.abs(s.vel.x) < 0.01) s.vel.x = 0;
            if (Math.abs(s.vel.z) < 0.01) s.vel.z = 0;
            
            s.anim = 'idle'; 
        }
        else if (action.type === 'interact'){ s.anim = 'interact'; }
        else if (action.type === 'update' && action.dt){ 
            const dt = action.dt * 0.001; 
            s.pos.x += s.vel.x * dt; 
            s.pos.z += s.vel.z * dt; 
        }
        else if (action.type === 'setRunning') {
            s.isRunning = action.running || false;
        }
        else if (action.type === 'setMoveSpeed') {
            s.moveSpeed = action.speed || 1.0;
        }
        
        return s;
    }

    function addTree(x,z){

    const rng = [ [-6,-4], [-2,3], [4,-5], [8,2], [-10,6], [2,-8] ];
    rng.forEach(([x,z],i)=>{ (i%3===0)? addTree(x,z) : (i%3===1? addBush(x,z): addRock(x,z)); });
    
    // Wee houses dotted toward edges
    function addHouse(x,z){
        const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 2.0), new THREE.MeshStandardMaterial({ color: 0xcaa472, roughness:0.9 }));
        base.position.set(x, 0.7, z); g.add(base);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(1.7, 0.9, 4), new THREE.MeshStandardMaterial({ color: 0x7b4f2a, roughness:0.8 }));

    }
    const houseSpots = [ [-90,-90], [-85,70], [92,-80], [88,88], [0,95], [95,0], [-95,0], [0,-95], [-70,85], [85,-70] ];
    houseSpots.forEach(([x,z])=> addHouse(x,z));

    const street = [ [-18,-6], [-16,-3], [-14,0], [-12,3], [-10,6], [-8,9], [-6,12], [-4,15], [-2,18], [0,21] ];

    // Hedge maze covering one quarter (NE quadrant) - proper carved maze
    function addHedge(x,z,len,dir){
        // dir: 'x' or 'z'
        const thick = 0.3; const height = 2.4; // thinner paths, taller hedges
        const mat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness:0.9 });
        const geom = (dir==='x') ? new THREE.BoxGeometry(len, height, thick) : new THREE.BoxGeometry(thick, height, len);
        const hedge = new THREE.Mesh(geom, mat);
        hedge.position.set(x, height/2, z);
        g.add(hedge);
        // Colliders along the segment
        const steps = Math.max(1, Math.floor(len/0.8));
        for (let i=0;i<=steps;i++){
            const t = (i/steps - 0.5) * len;
            const cx = x + (dir==='x' ? t : 0);
            const cz = z + (dir==='z' ? t : 0);
            colliders.push({ x: cx, z: cz, r: 0.4 });
        }
    }
    (function buildMaze(){
        // Define maze bounds
        const x0=10, x1=100, z0=-100, z1=-10; // NE quadrant
        const cell=8; // smaller cell => thinner paths
        const cols = Math.floor((x1 - x0) / cell);
        const rows = Math.floor((z1 - z0) / cell);
        // Maze grid with walls: for each cell, walls N,E,S,W
        const grid = Array.from({length: rows}, ()=> Array.from({length: cols}, ()=> ({v:false,w:[true,true,true,true]})));
        function neighbors(r,c){
            const ns = [];
            if (r>0) ns.push([r-1,c,0,2]);
            if (c<cols-1) ns.push([r,c+1,1,3]);
            if (r<rows-1) ns.push([r+1,c,2,0]);
            if (c>0) ns.push([r,c-1,3,1]);
            return ns.sort(()=>Math.random()-0.5);
        }
        // Entrance near player spawn: west edge, row near z≈0 => closest to z1
        const startR = rows-2; const startC = 0; // west edge
        // Carve with DFS
        const stack=[[startR,startC]]; grid[startR][startC].v=true; grid[startR][startC].w[3]=false; // open west wall for entrance
        while (stack.length){
            const [r,c] = stack[stack.length-1];
            const opts = neighbors(r,c).filter(([nr,nc])=>!grid[nr][nc].v);
            if (!opts.length){ stack.pop(); continue; }
            const [nr,nc,w,ow] = opts[0];
            grid[r][c].w[w]=false; grid[nr][nc].w[ow]=false; grid[nr][nc].v=true; stack.push([nr,nc]);
        }
        // Draw outer borders
        addHedge((x0+x1)/2, z0, x1-x0, 'x');
        addHedge((x0+x1)/2, z1, x1-x0, 'x');
        addHedge(x0, (z0+z1)/2, z1-z0, 'z');
        addHedge(x1, (z0+z1)/2, z1-z0, 'z');
        // Render internal walls per cell
        for (let r=0;r<rows;r++){
            for (let c=0;c<cols;c++){
                const cx = x0 + c*cell + cell/2;
                const cz = z0 + r*cell + cell/2;
                const w = grid[r][c].w;
                if (w[0]) addHedge(cx, cz - cell/2, cell, 'x'); // north
                if (w[1]) addHedge(cx + cell/2, cz, cell, 'z'); // east
                if (w[2]) addHedge(cx, cz + cell/2, cell, 'x'); // south
                if (w[3]) addHedge(cx - cell/2, cz, cell, 'z'); // west
            }
        }
    })();
    g.userData.fieldColliders = colliders;
    return g;
}

		oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
		oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
		gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
		gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
		oscillator.start(audioContext.currentTime);
		oscillator.stop(audioContext.currentTime + 0.2);

		const oscillator = audioContext.createOscillator();

		oscillator.connect(gainNode);

		oscillator.frequency.setValueAtTime(800, audioContext.currentTime);

		oscillator.start(audioContext.currentTime);
		oscillator.stop(audioContext.currentTime + 0.15);
	}
	
	function playAmbientSound() {
		// Gentle ambient tone
		const oscillator = audioContext.createOscillator();
		const gainNode = audioContext.createGain();
		const filter = audioContext.createBiquadFilter();
		oscillator.connect(filter);
		filter.connect(gainNode);
		gainNode.connect(audioContext.destination);
		oscillator.frequency.setValueAtTime(60, audioContext.currentTime);
		filter.type = 'lowpass';
		filter.frequency.setValueAtTime(200, audioContext.currentTime);
		gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
		oscillator.start(audioContext.currentTime);
		return { oscillator, gainNode };
	}

// View toggle (1st/3rd person) - preserve yaw/pitch via camera direction
(function(){
    const btn = document.getElementById('btn-view');
    if (!btn) return;
    function update(){ btn.textContent = 'View: ' + (isFirstPerson ? '1st' : '3rd'); }
    function toggle(){
        // Derive yaw/pitch from current camera direction to avoid flips
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        // Convert to yaw/pitch (XZ yaw, Y pitch)
        const newYaw = Math.atan2(dir.x, dir.z);
        const newPitch = Math.asin(THREE.MathUtils.clamp(dir.y, -1, 1));
        yaw = targetYaw = newYaw;
        // Keep pitch orientation consistent when switching: do not invert
        pitch = targetPitch = THREE.MathUtils.clamp(newPitch, minPitch, maxPitch);
        // Flip mode
        isFirstPerson = !isFirstPerson;
        update();
    }
    btn.addEventListener('click', toggle);
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); toggle(); }, { passive:false });
    update();
})();

// Start menu wiring: vertical layout + Load submenu
(function(){
    const KEY = 'rw:snapshot:v1';
    const SLOT_KEY = (i)=> KEY+':slot:'+i;
    function slotInfo(i){ try { const s = localStorage.getItem(SLOT_KEY(i)); return s ? JSON.parse(s) : null; } catch { return null; } }
    function updateSmSlots(){ try { document.querySelectorAll('.sm-slot').forEach((el)=>{ const i=parseInt(el.getAttribute('data-slot')); const data=slotInfo(i); el.textContent = 'Slot ' + (i+1) + ' — ' + (data?.t ? new Date(data.t).toLocaleString() : 'empty'); }); } catch {} }
    function applySnap(s){ try { if (window.__RW && window.__RW.player && s && s.pos){ const p=window.__RW.player.position; p.x=s.pos.x; p.z=s.pos.z; } } catch {} }
    function loadSnap(i){ try { const s=localStorage.getItem(SLOT_KEY(i)); return s? JSON.parse(s): null; } catch { return null; } }
    function newGame(){ try { let x=0,z=2; try { if (window.__RW_COLLISION__?.spawn){ x=(window.__RW_COLLISION__.spawn.x-48)*0.12; z=(window.__RW_COLLISION__.spawn.y-32)*0.12; } } catch{} if (window.__RW?.player){ window.__RW.player.position.x=x; window.__RW.player.position.z=z; } } catch {} }
    function hideStart(){ try { const m=document.getElementById('start-menu'); if (m) m.remove(); } catch {} }
    // Visual debug function for mobile
    function showDebug(msg) {
        const debug = document.getElementById('debug');
        if (debug) {
            debug.textContent = msg;
            debug.style.display = 'block';
            setTimeout(() => { debug.style.display = 'none'; }, 3000);
        }
    }
    
    function bind(){
        showDebug('bind() called');
        const sm = document.getElementById('start-menu'); 
        showDebug('start-menu found: ' + !!sm);
        if (!sm) { 
            showDebug('No start-menu, retrying...');
            setTimeout(bind, 200);
            return; 
        }
        const bStart = document.getElementById('sm-start');
        const bLoad = document.getElementById('sm-load');
        const bOpt = document.getElementById('sm-options');
        const bCred = document.getElementById('sm-credits');
        const bBack = document.getElementById('sm-back');
        const sub = document.getElementById('sm-load-sub');
        const bSubBack = document.getElementById('sm-load-back');
        showDebug('buttons: ' + [bStart, bLoad, bOpt, bCred, bBack].map(b => !!b).join(','));
        
        // Clear any existing handlers first and add new ones
        if (bStart) { 
            bStart.onclick = null; 
            bStart.onclick = ()=>{ showDebug('Start clicked!'); newGame(); hideStart(); }; 
            bStart.style.cursor = 'pointer';
        }
        if (bLoad) { 
            bLoad.onclick = null; 
            bLoad.onclick = ()=>{ showDebug('Load clicked!'); sub.style.display='flex'; updateSmSlots(); }; 
            bLoad.style.cursor = 'pointer';
        }
        if (bSubBack) { 
            bSubBack.onclick = null; 
            bSubBack.onclick = ()=>{ sub.style.display='none'; }; 
            bSubBack.style.cursor = 'pointer';
        }
        if (bOpt) { 
            bOpt.onclick = null; 
            bOpt.onclick = ()=>{ showDebug('Options clicked!'); alert('Options coming soon'); }; 
            bOpt.style.cursor = 'pointer';
        }
        if (bCred) { 
            bCred.onclick = null; 
            bCred.onclick = ()=>{ showDebug('Credits clicked!'); alert('Credits coming soon'); }; 
            bCred.style.cursor = 'pointer';
        }
        if (bBack) { 
            bBack.onclick = null; 
            bBack.onclick = ()=>{ showDebug('Back clicked!'); try { window.location.href = '/MIFF-Make-It-For-Free/'; } catch {} }; 
            bBack.style.cursor = 'pointer';
        }
        
        // Remove existing listeners and add new ones
        document.querySelectorAll('.sm-slot').forEach((el)=>{
            el.removeEventListener('click', el._slotHandler);
            el._slotHandler = ()=>{ const i=parseInt(el.getAttribute('data-slot')); const s=loadSnap(i); if (s){ applySnap(s); hideStart(); } };
            el.addEventListener('click', el._slotHandler);
        });
        showDebug('bind() completed!');
    }
    window.__RW_bindStartMenu = bind;
    // Simple test function
    function testButtons() {
        const debug = document.getElementById('debug');
        if (debug) {
            const startBtn = document.getElementById('sm-start');
            debug.textContent = 'Test: start btn ' + (startBtn ? 'found' : 'missing');
            setTimeout(() => {
                if (debug) debug.textContent = 'Test: bind() in 1s...';
                setTimeout(bind, 1000);
            }, 2000);
        }
    }
    
    // Ensure DOM is ready before binding
    if (document.readyState==='loading') {
        document.addEventListener('DOMContentLoaded', ()=>{ 
            testButtons();
        });
    } else {
        testButtons();
    }
})();

      async function loadJSON(url){ const r = await fetch(url, { cache:'no-store' }); return await r.json(); }
      async function applySpawn(){
        try {
          const base = '/MIFF-Make-It-For-Free/render/assets/';
          const collision = await loadJSON(base+'collision.json');
          if (window.__RW && window.__RW.player && collision && collision.spawn){
            const p = window.__RW.player;
            // Map grid coords to scene (simple scale/offset)
            p.position.x = (collision.spawn.x - 48) * 0.12;
            p.position.z = (collision.spawn.y - 32) * 0.12;
            try{ document.getElementById('status').textContent = 'spawn outside warehouse'; }catch{}
          }
        } catch(e){ console.warn('[RW] spawn apply failed', e); }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applySpawn);
      else applySpawn();
    })();

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RenderWorld Hub</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
	<style>
		html, body { margin:0; padding:0; height:100%; height:100dvh; background:#000; overflow:hidden; }
		#gameCanvas { position:fixed; inset:0; width:100vw; height:100dvh; display:block; }
		#status { position:fixed; left:8px; bottom:8px; color:#7fffd4; font:12px monospace; background:rgba(0,0,0,0.5); padding:6px 8px; border-radius:4px; }
		#joystick { position:fixed; left:16px; bottom:16px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
		#joystickKnob { width:56px; height:56px; border-radius:50%; background:rgba(0, 212, 255, 0.8); box-shadow:0 0 15px rgba(0,212,255,0.5); }
		#portalLinks { position:fixed; left:50%; transform:translateX(-50%); bottom:140px; display:flex; gap:12px; }
		#portalLinks a { text-decoration:none; color:#00ff88; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.12); padding:10px 14px; border-radius:8px; font-weight:600; }
	</style>
</head>
<body>
	<canvas id="gameCanvas"></canvas>
	<div id="status">init</div>
	<div id="joystick"><div id="joystickKnob"></div></div>
	<div id="portalLinks">
		<a href="/site/#spirit-tamer">Spirit Tamer</a>
		<a href="/site/#toppler">Toppler</a>
		<a href="/site/grove.html">Witcher Grove</a>
	</div>
	<script>
	(function(){
		var canvas = document.getElementById('gameCanvas');
		var statusEl = document.getElementById('status');
		function fit(){ canvas.width = window.innerWidth; canvas.height = (window.visualViewport?Math.round(window.visualViewport.height):window.innerHeight); }
		window.addEventListener('resize', fit); fit();
		function log(msg){ try{ statusEl.textContent = String(msg); }catch{} }

		// Minimal joystick -> emit custom event consumed by hub bridge
		var joy = document.getElementById('joystick');
		var knob = document.getElementById('joystickKnob');
		var center = { x: 60, y: 60 }; var active=false; var pos={ x:0, y:0 };
		function setKnob(dx,dy){ knob.style.transform = 'translate('+dx+'px,'+dy+'px)'; }
		joy.addEventListener('touchstart', function(e){ e.preventDefault(); active=true; }, { passive:false });
		joy.addEventListener('touchmove', function(e){ e.preventDefault(); if(!active) return; var t=e.touches[0]; var r=joy.getBoundingClientRect(); var x=t.clientX-r.left; var y=t.clientY-r.top; var dx=x-center.x; var dy=y-center.y; var d=Math.hypot(dx,dy); var m=50; if(d>m){ var a=Math.atan2(dy,dx); dx=Math.cos(a)*m; dy=Math.sin(a)*m; } setKnob(dx,dy); pos.x=dx/m; pos.y=dy/m; window.dispatchEvent(new CustomEvent('rw-joystick',{ detail:{ x:pos.x, y:pos.y }})); }, { passive:false });
		joy.addEventListener('touchend', function(e){ e.preventDefault(); active=false; setKnob(0,0); pos.x=0; pos.y=0; window.dispatchEvent(new CustomEvent('rw-joystick',{ detail:{ x:0, y:0 }})); }, { passive:false });

		function startBridge(){
			try {
				if (!window.RenderWorldWebBridge) throw new Error('RenderWorldWebBridge missing');
				var rw = new window.RenderWorldWebBridge(canvas, { width: canvas.width, height: canvas.height, enableDebug: false, quality: 'high' });
				rw.start();
				window.renderworld = rw;
				log('hub started');
			} catch (e) { console.error(e); log('failed to start'); }
		}

		// Load bundle from repo root docs level
		try {
			fetch('../renderworld-hub.js', { method:'HEAD', cache:'no-store' })
				.then(function(){ var s=document.createElement('script'); s.src='../renderworld-hub.js?v='+Date.now(); s.onload=function(){ log('bundle loaded'); startBridge(); }; s.onerror=function(){ log('bundle error'); }; document.head.appendChild(s); })
				.catch(function(){ log('bundle not found'); });
		} catch(e){ log('bundle probe error'); }
	})();
	</script>
</body>
</html>

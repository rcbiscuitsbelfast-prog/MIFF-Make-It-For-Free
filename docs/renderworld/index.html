<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RenderWorld Canvas Test</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
	<style>
		html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
		#c { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<script>
	(function(){
		var canvas = document.getElementById('c');
		var ctx = canvas.getContext('2d');
		function fit(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
		window.addEventListener('resize', fit); fit();
		var t=0; (function loop(){ t+=0.016; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#00ff88'; var x=canvas.width/2+Math.cos(t)*120; var y=canvas.height/2+Math.sin(t*1.2)*80; ctx.beginPath(); ctx.arc(x,y,30,0,Math.PI*2); ctx.fill(); requestAnimationFrame(loop); })();
	})();
	</script>
</body>
</html>

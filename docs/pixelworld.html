<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MIFF — Pixel World</title>
	<style>
		html,body{margin:0;height:100%;background:#0f1116;color:#e6edf3;font-family:system-ui}
		#gameCanvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#0b1220}
		#hud{position:fixed;left:0;right:0;top:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font:12px monospace;color:#e6edf3;background:rgba(0,0,0,0.45);backdrop-filter:saturate(120%) blur(2px);-webkit-backdrop-filter:saturate(120%) blur(2px);pointer-events:none;z-index:10}
		#btn-fullscreen{position:fixed;right:12px;top:52px;z-index:10;min-width:110px;min-height:36px;border-radius:10px;background:rgba(0,0,0,0.55);color:#e6edf3;border:1px solid rgba(255,255,255,0.22);font:12px monospace}
		#pad{position:fixed;left:14px;bottom:14px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);display:none;align-items:center;justify-content:center;z-index:10}
		#pad .knob{width:60px;height:60px;border-radius:50%;background:rgba(0,255,136,0.9);box-shadow:0 0 16px rgba(0,255,136,0.5)}
		#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;font:12px monospace;color:#a9b8c6;background:rgba(0,0,0,0.45);padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);z-index:10}
		#btn-run{display:none;position:fixed;right:14px;bottom:100px;min-width:84px;min-height:48px;border-radius:10px;background:#21262d;color:#e6edf3;border:1px solid #30363d;z-index:10}
	</style>
</head>
<body>
	<div id="hud"><span id="hud-pos">Pixel World</span><span id="hud-fps"></span></div>
	<button id="btn-fullscreen">Fullscreen</button>
	<canvas id="gameCanvas"></canvas>
	<div id="hint">Use D‑pad or WASD/Arrows to move</div>
	<div id="pad"><div class="knob"></div></div>
	<button id="btn-run">Run</button>
	<script>
	(function(){
		function launch(){
			const cvs = document.getElementById('gameCanvas');
			const ctx = cvs.getContext('2d');
			function fit(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
			window.addEventListener('resize', fit); fit();

			const startMenu = document.createElement('div');
			startMenu.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;flex-direction:column;background:linear-gradient(135deg,#0a1322,#1a2332)';
			startMenu.innerHTML = '<div style="text-align:center">\
				<h2 style="margin:0;color:#00ff88;letter-spacing:1px">Pixel World</h2>\
				<p style="margin:6px 0;color:#a9b8c6;font-size:12px">Press Start to Continue</p>\
			</div>\
			<div style="display:flex;gap:10px">\
				<button id="startBtn" style="background:#00a86b;color:#fff;padding:8px 16px;border-radius:8px;border:1px solid #1e4434;box-shadow:0 2px 6px rgba(0,255,136,0.2)">Start</button>\
			</div>';
			document.body.appendChild(startMenu);
			startMenu.querySelector('#startBtn').addEventListener('click', ()=>{ startMenu.remove(); showCharacterSelect(); });

			function showCharacterSelect(){
				const panel = document.createElement('div');
				panel.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(135deg,#0a1322,#1a2332)';
				panel.innerHTML = '<div style="display:flex;gap:12px">\
				<button data-c="Knight" style="padding:10px 14px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3">Knight</button>\
				<button data-c="Mage" style="padding:10px 14px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3">Mage</button>\
				<button data-c="Rogue" style="padding:10px 14px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3">Rogue</button>\
				</div>';
				document.body.appendChild(panel);
				panel.addEventListener('click', (e)=>{
					const t = e.target; const cid = t && t.getAttribute && t.getAttribute('data-c');
					if (!cid) return; panel.remove(); showMainMenu(cid);
				});
			}

			function showMainMenu(characterId){
				const menu = document.createElement('div');
				menu.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(135deg,#0a1322,#1a2332)';
				menu.innerHTML = '<div style="text-align:center">\
				<h3 style="margin:0;color:#00ff88">Pixel World — Menu</h3>\
				<p style="margin:6px 0;color:#a9b8c6;font-size:12px">Character: <strong>'+characterId+'</strong></p>\
				</div>\
				<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">\
				<button id="btnPlay" style="padding:8px 14px;background:#00a86b;color:white;border:1px solid #1e4434;border-radius:8px">Play</button>\
				<button id="btnAudio" style="padding:8px 14px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px">Audio: On</button>\
				<button id="btnLinks" style="padding:8px 14px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px">Links</button>\
				<button id="btnOptions" style="padding:8px 14px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px">Options</button>\
				<button id="btnBack" style="padding:8px 14px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px">Back</button>\
				</div>';
				document.body.appendChild(menu);
				let audioOn = true;
				document.getElementById('btnBack').addEventListener('click', ()=>{ menu.remove(); showCharacterSelect(); });
				document.getElementById('btnAudio').addEventListener('click', (e)=>{ audioOn = !audioOn; e.target.textContent = 'Audio: ' + (audioOn?'On':'Off'); });
				document.getElementById('btnLinks').addEventListener('click', ()=>{ window.open('https://rcbiscuitsbelfast-prog.github.io/MIFF-Make-It-For-Free/', '_blank'); });
				document.getElementById('btnOptions').addEventListener('click', ()=>{ alert('Options coming soon'); });
				document.getElementById('btnPlay').addEventListener('click', ()=>{ menu.remove(); startGame(characterId, audioOn); });
			}

			function showWorld(characterId){
				let last=0, frames=0;
				const grid = 16;
				function drawGrid(){
					ctx.clearRect(0,0,cvs.width,cvs.height);
					ctx.strokeStyle = '#1f2d3c';
					for (let x=0;x<=cvs.width;x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cvs.height); ctx.stroke(); }
					for (let y=0;y<=cvs.height;y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cvs.width,y); ctx.stroke(); }
				}
				drawGrid();

				async function loadDemo(){
					try{
						const r = await fetch('./site/studio/presets/grove.json');
						const data = await r.json();
						const normalized = data?.zones ? data : { zones:[ data ] };
						renderWorld(normalized);
					}catch(err){ console.error('[PixelWorld] Failed to load demo', err); }
				}
				loadDemo();

				function renderWorld(world){
					drawGrid();
					const zone = world && world.zones && world.zones[0];
					if (!zone) return;
					var colors = { tree:'#228B22', bush:'#32CD32', rock:'#696969', grass:'#90EE90' };
					(zone.tiles||[]).forEach(function(tile){
						const x = tile.x*grid, y=tile.y*grid;
						const parts = String(tile.assetId||'').split('_');
						const assetType = parts[1]||'unknown';
						ctx.fillStyle = colors[assetType] || '#888';
						ctx.fillRect(x,y,grid,grid);
					});

					// Draw player character as purple square
					try {
						var playerColor = '#800080'; // purple
						var px = Math.floor(cvs.width/(2*grid))*grid;
						var py = Math.floor(cvs.height/(2*grid))*grid;
						ctx.fillStyle = playerColor;
						ctx.fillRect(px, py, grid, grid);
					} catch (e) { console.warn('Player render failed', e); }
				}

				function tick(t){
					if(!last) last=t; frames++;
					if(t-last>1000){ document.getElementById('hud-fps').textContent = frames + ' fps'; last=t; frames=0; }
					requestAnimationFrame(tick);
				}
				requestAnimationFrame(tick);
				document.getElementById('hud-pos').textContent = 'Character: ' + characterId;
			}

			function startGame(characterId, audioOn){
				const cvs = document.getElementById('gameCanvas');
				const ctx = cvs.getContext('2d');
				const grid = 16;
				let player = { x: 10, y: 8, color:'#800080' };
				let npcs = [];
				const palette = { bg:'#0b1220', grid:'#1f2d3c', grass:'#2e8b57', water:'#1e90ff', sand:'#c2b280' };
				const mapW = 32, mapH = 24;
				const map = new Array(mapW*mapH).fill('grass');
				for(let y=10;y<14;y++) for(let x=20;x<26;x++) map[y*mapW+x] = (x===20||x===25||y===10||y===13)?'sand':'water';
				let keys = {}; let isRunning = false; let canRunAt = 0;
				window.addEventListener('keydown', (e)=>{ keys[e.key]=true; });
				window.addEventListener('keyup', (e)=>{ keys[e.key]=false; });

				// Virtual joystick (D‑pad)
				(function(){
					try {
						const pad = document.getElementById('pad');
						const knob = pad?.querySelector('.knob');
						if (!pad || !knob) return;
						let active=false; let cx=0, cy=0;
						function center(){ const r=pad.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; }
						function setKnob(dx,dy){ knob.style.transform = 'translate('+dx+'px,'+dy+'px)'; }
						function start(x,y){ active=true; move(x,y); }
						function move(x,y){ if(!active) return; center(); let dx=x-cx, dy=y-cy; const lim=50; const d=Math.hypot(dx,dy); if(d>lim){ const a=Math.atan2(dy,dx); dx=Math.cos(a)*lim; dy=Math.sin(a)*lim; } setKnob(dx*0.6,dy*0.6); keys['ArrowLeft']=dx<-15; keys['ArrowRight']=dx>15; keys['ArrowUp']=dy<-15; keys['ArrowDown']=dy>15; }
						function end(){ active=false; setKnob(0,0); keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false; }
						pad.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; start(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
						pad.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; move(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
						pad.addEventListener('touchend', (e)=>{ end(); e.preventDefault(); }, {passive:false});
						pad.addEventListener('mousedown', (e)=>{ start(e.clientX,e.clientY); });
						window.addEventListener('mousemove', (e)=>{ move(e.clientX,e.clientY); });
						window.addEventListener('mouseup', end);
					} catch {}
				})();
				let lastTime = performance.now();
				let camera = { x: player.x, y: player.y, zoom: 2 };
				function update(){
					const now = performance.now();
					const dt = Math.min(0.033, (now - lastTime)/1000);
					lastTime = now;
					let dx=0, dy=0;
					if(keys['ArrowUp']||keys['w']||keys['W']) dy=-1;
					if(keys['ArrowDown']||keys['s']||keys['S']) dy=1;
					if(keys['ArrowLeft']||keys['a']||keys['A']) dx=-1;
					if(keys['ArrowRight']||keys['d']||keys['D']) dx=1;
					const nowMs = Date.now();
					if (isRunning && nowMs >= canRunAt) { isRunning = false; canRunAt = nowMs + 3000; }
					const speed = (isRunning ? 1.25 : 0.6) * (dt / (1/60));
					if(dx||dy){ player.x = Math.max(0, Math.min(mapW-1, player.x+dx*speed)); player.y = Math.max(0, Math.min(mapH-1, player.y+dy*speed)); }
					camera.x += (player.x - camera.x) * 0.15;
					camera.y += (player.y - camera.y) * 0.15;
					document.getElementById('hud-pos').textContent = 'Character: ' + characterId + ' — ('+player.x+','+player.y+')';
				}
				function render(){
					ctx.imageSmoothingEnabled = false;
					ctx.fillStyle = palette.bg; ctx.fillRect(0,0,cvs.width,cvs.height);
					const sx = Math.floor(cvs.width/(mapW*grid));
					const sy = Math.floor(cvs.height/(mapH*grid));
					const scale = Math.max(1, Math.min(sx, sy));
					const worldW = mapW*grid*scale, worldH = mapH*grid*scale;
					const centerX = camera.x*grid*scale + grid*scale/2;
					const centerY = camera.y*grid*scale + grid*scale/2;
					const ox = Math.floor(cvs.width/2 - centerX);
					const oy = Math.floor(cvs.height/2 - centerY);
					for(let y=0;y<mapH;y++){
						for(let x=0;x<mapW;x++){
							const t = map[y*mapW+x];
							ctx.fillStyle = t==='grass'?palette.grass : t==='water'?palette.water : palette.sand;
							ctx.fillRect(ox + x*grid*scale, oy + y*grid*scale, grid*scale, grid*scale);
						}
					}
					// draw player as pixel humanoid
					const px = ox + player.x*grid*scale;
					const py = oy + player.y*grid*scale;
					ctx.fillStyle = player.color; // torso
					ctx.fillRect(px+2*scale, py+4*scale, (grid-8)*scale, 6*scale);
					ctx.fillStyle = '#ffd966'; // head
					ctx.fillRect(px+4*scale, py+1*scale, (grid-12)*scale, 3*scale);
					ctx.fillStyle = player.color; // legs
					ctx.fillRect(px+2*scale, py+10*scale, 4*scale, 4*scale);
					ctx.fillRect(px+(grid-6)*scale, py+10*scale, 4*scale, 4*scale);
					ctx.fillRect(px, py+5*scale, 2*scale, 4*scale); // arms
					ctx.fillRect(px+(grid-2)*scale, py+5*scale, 2*scale, 4*scale);
					for(const n of npcs){
						const bob = Math.sin(Date.now()/400 + n.spawn.x*0.3 + n.spawn.y*0.2) * scale;
						const nx = ox + n.spawn.x*grid*scale + 2*scale;
						const ny = oy + n.spawn.y*grid*scale + 2*scale - bob;
						const base = n.sprite.palette[0]||'#6e40c9';
						const accent = n.sprite.palette[2]||'#ffd966';
						ctx.fillStyle = base; ctx.fillRect(nx, ny+3*scale, (grid-4)*scale, 6*scale);
						ctx.fillStyle = accent; ctx.fillRect(nx+2*scale, ny, (grid-8)*scale, 3*scale);
						ctx.fillStyle = base; ctx.fillRect(nx, ny+9*scale, 3*scale, 4*scale);
						ctx.fillRect(nx+(grid-4)*scale, ny+9*scale, 3*scale, 4*scale);
					}
				}
				function loop(){ update(); render(); requestAnimationFrame(loop); }
				loop();
				// Reveal controls now that game is running
				try { document.getElementById('pad').style.display='flex'; document.getElementById('btn-run').style.display='inline-block'; document.getElementById('hint').style.display='none'; } catch {}
				// Load NPC registry and attach interaction
				(async function(){
					try{
						const r = await fetch('render/viewport/npc_registry.json?v=2025-10-01-2');
						const j = await r.json();
						npcs = (j.npcs||[]);
					}catch(e){ console.warn('NPC registry missing', e); }
				})();
				window.addEventListener('keydown', (e)=>{
					if(e.key===' '||e.key==='Enter') tryOpenDialog();
				});
				const actionBtn = document.createElement('button');
				actionBtn.textContent='Action';
				actionBtn.style.cssText='position:fixed;right:14px;bottom:14px;min-width:84px;min-height:48px;border-radius:10px;background:#00a86b;color:#fff;border:1px solid #1e4434;z-index:10';
				actionBtn.addEventListener('click', ()=>tryOpenDialog());
				document.body.appendChild(actionBtn);
				function tryOpenDialog(){
					for(const n of npcs){
						const d = Math.hypot(n.spawn.x - player.x, n.spawn.y - player.y);
						if(d<=1.2){ showDialog(n); break; }
					}
				}
				function showDialog(n){
					const box = document.createElement('div');
					box.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);min-width:260px;background:#0e1622;border:1px solid #1f2d3c;border-radius:10px;padding:12px;z-index:2000;color:#e6edf3;font:12px monospace;';
					const overlay = document.createElement('div');
					overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1999';
					box.innerHTML = '<div style="margin-bottom:8px;color:#00ff88">'+(n.name||'NPC')+'</div><div style="margin-bottom:10px;color:#a9b8c6">'+(n.dialogueTree?.[0]?.text||'...')+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button id="dlgClose" style="padding:6px 10px;border-radius:8px;background:#21262d;color:#e6edf3;border:1px solid #30363d">Close</button></div>';
					function close(){ try { box.remove(); overlay.remove(); } catch {} }
					document.body.appendChild(overlay);
					document.body.appendChild(box);
					document.getElementById('dlgClose').addEventListener('click', close);
					overlay.addEventListener('click', close);
					window.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); window.removeEventListener('keydown', esc); } });
				}
				// Run toggle with auto-off and cooldown
				(function(){
					try {
						const btn = document.getElementById('btn-run');
						if (!btn) return;
						function update(){
							const now = Date.now();
							if (now < canRunAt) { btn.textContent = 'Cooldown ' + Math.ceil((canRunAt-now)/1000) + 's'; btn.disabled = true; btn.style.opacity = '0.6'; }
							else { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = isRunning ? 'Running' : 'Run'; }
						}
						let autoOff = null, tick = null;
						function startRun(){ if (Date.now() < canRunAt) { update(); return; } isRunning = true; update(); if (autoOff) clearTimeout(autoOff); autoOff = setTimeout(()=>{ isRunning = false; canRunAt = Date.now()+3000; update(); }, 2000); if (!tick) tick = setInterval(update, 250); }
						function toggle(){ if (Date.now() < canRunAt) { update(); return; } if (isRunning) { isRunning = false; canRunAt = Date.now()+3000; } else { startRun(); } update(); }
						btn.addEventListener('click', toggle);
						btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); toggle(); }, { passive:false });
						update();
					} catch {}
				})();
			}
		}

		window.addEventListener('DOMContentLoaded', launch);

		(function(){
			const btn = document.getElementById('btn-fullscreen');
			if (!btn) return;
			async function go(){ try { const el=document.documentElement; if (el.requestFullscreen) await el.requestFullscreen({ navigationUI:'hide' }); } catch {} }
			function exit(){ try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }
			function update(){ btn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen'; }
			btn.addEventListener('click', ()=>{ document.fullscreenElement ? exit() : go(); });
			document.addEventListener('fullscreenchange', update);
			update();
		})();
	})();
	</script>
</body>
</html>

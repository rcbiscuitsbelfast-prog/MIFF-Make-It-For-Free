<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
  <title>MIFF Scene Builder</title>
  <link rel="stylesheet" href="studio.css?v=20250911" />
</head>
<body>
  <header class="studio-header">
    <h1>Scene Builder</h1>
    <nav>
      <a href="./index.html">Studio</a>
      <a href="./sprite.html">Sprite Studio</a>
    </nav>
  </header>
  <main class="studio-main">
    <div class="studio-grid">
      <aside class="panel">
        <h3>Palette</h3>
        <div class="list" id="palette"></div>
      </aside>
      <section class="panel">
        <div class="toolbar">
          <button id="tool-select">Select</button>
          <button id="tool-add">Add</button>
          <button id="tool-move">Move</button>
          <button id="tool-rotate">Rotate</button>
          <button id="tool-resize">Resize</button>
          <select id="presetSelect"><option value="">Load Preset…</option><option value="presets/toppler.json">Toppler</option><option value="presets/spirit.json">Spirit</option><option value="presets/grove.json">Grove</option></select>
          <button id="btn-load-preset">Load</button>
          <select id="spriteSelect"><option value="">Sprites…</option></select>
          <select id="tileSelect"><option value="">Tiles…</option></select>
          <button id="btn-preview-sprite">Preview Sprite</button>
          <button id="btn-preview-map">Preview Map</button>
          <select id="worldSelectScene"><option value="">Preview World…</option><option value="../toppler.html">Toppler</option><option value="../spirit.html">Spirit</option><option value="../grove.html">Grove</option></select>
          <button id="openWorldScene">Open</button>
          <button id="injectPreview">Inject to Preview</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="sceneCanvas"></canvas>
          <canvas id="previewCanvas" style="position:absolute; right:10px; bottom:10px; width:160px; height:160px; border:1px solid #1f2d3c; background:#0006"></canvas>
        </div>
        <div class="panel" style="position:relative; height:40vh; margin-top:8px;">
          <iframe id="worldFrameScene" style="position:absolute; inset:0; width:100%; height:100%; border:1px solid #1f2d3c" allowfullscreen></iframe>
        </div>
        <div class="export-bar">
          <button id="btn-export-json">Export JSON</button>
          <button id="btn-export-yaml">Export YAML</button>
          <button id="btn-inject-runtime">Inject to Runtime</button>
          <button id="btn-save">Save</button>
          <button id="btn-load">Load</button>
          <label>Grid <input type="number" id="gridSize" value="32" min="4" max="256" step="4" style="width:64px" /></label>
          <label><input type="checkbox" id="snapToGrid" checked /> Snap</label>
        </div>
      </section>
      <aside class="panel">
        <h3>Properties</h3>
        <div id="props">
          <label>Name <input type="text" id="prop-name" /></label>
          <label>Type <select id="prop-type"></select></label>
          <label>Tags <input type="text" id="prop-tags" placeholder="comma,separated" /></label>
          <label>Behavior <textarea id="prop-behavior" rows="4"></textarea></label>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="scene_builder.js?v=20250911"></script>
  <script>
    (function(){
      function setLayout(){ const isMobile = window.matchMedia('(max-width: 900px)').matches || (navigator.userAgent||'').toLowerCase().includes('mobile'); document.documentElement.classList.toggle('mobile', !!isMobile); }
      window.addEventListener('resize', setLayout); setLayout();
    })();
  </script>
</body>
</html>

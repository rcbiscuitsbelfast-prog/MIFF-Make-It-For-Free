<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'">
    <title>🐉 Spirit Tamer - MIFF Framework</title>
    <link rel="stylesheet" href="overlays/style.css?v=20250911">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a1322;
            color: #e6edf3;
            font-family: 'Times New Roman', serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            background: #0a1322;
            touch-action: none;
        }
        
        .zone-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .zone-header h1 {
            margin: 0;
            font-size: 18px;
            color: #58a6ff;
        }
        
        .zone-header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .back-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="embed-hook"></div>
    </div>
    
    <script type="module" src="overlays/OverlayManager.js?v=20250911"></script>
    <script type="module" src="overlays/MovementToggle.js?v=20250911"></script>
    <script type="module" src="godot-embed.js?v=20250911"></script>
    <script type="module">
      import { embedGodot } from './godot-embed.js?v=20250911';
      window.addEventListener('DOMContentLoaded', ()=>{ embedGodot({ zone:'spirit', path:'../godot/spirit/spirit.html' }); });
    </script>
    <script>
    (function(){
      function fit(){
        const c = document.getElementById('gameCanvas');
        if (!c) return; c.width = window.innerWidth; c.height = window.innerHeight;
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', ()=> setTimeout(fit, 100));
      function onFS(){ fit(); }
      document.addEventListener('fullscreenchange', onFS);
      window.addEventListener('DOMContentLoaded', ()=>{
        fit();
        try { document.body.setAttribute('data-zone','spirit_tamer'); } catch {}
        // Splash screen removed - load directly into game
        setTimeout(()=>{
          try {
            if (!document.querySelector('.start-menu')) window.miffShowStartMenu && window.miffShowStartMenu({
              themeClass: 'theme-sci-fi',
              title: 'SPIRIT TAMER',
              subtitle: 'Made by MIFF',
              onAction: (a)=>{
                if (a==='options'){ window.miffOverlay && window.miffOverlay.show && window.miffOverlay.show('options', '<h2>Options</h2><p>Audio</p>'); }
                if (a==='remix'){ try { window.open('https://github.com/rcbiscuitsbelfast-prog/MIFF-Make-It-For-Free','_blank'); } catch {} }
              }
            });
          } catch {}
        }, 950);
        // Click anywhere to focus inner iframe for input
        document.body.addEventListener('pointerdown', ()=>{ try{ document.getElementById('godot-frame')?.focus(); }catch{} });
      });
    })();
    </script>
</body>
</html>

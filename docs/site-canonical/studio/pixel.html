<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MIFF Studio — Pixel Draw</title>
	<style>
		body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui}
		header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222;background:#0f1116;position:sticky;top:0;z-index:10}
		.wrap{padding:12px;display:grid;grid-template-columns:300px 1fr;gap:12px}
		.panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622}
		.panel h3{margin:0;padding:10px;border-bottom:1px solid #1f2d3c}
		.panel .content{padding:10px}
		.kv{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
		input[type="text"],select{width:100%;background:#0b1320;border:1px solid #2b3b4f;color:#e6edf3;border-radius:6px;padding:6px}
		.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
		canvas{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px}
		pre{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px;padding:8px;max-height:260px;overflow:auto}
	</style>
	<script type="module">
		import { PixelDrawPure } from '../../miff/pure/PixelDrawPure/index.ts';
		const $ = (id)=>document.getElementById(id);
		let grid = PixelDrawPure.create(16,16,16);
		let currentColor = '#58a6ff';

		function resize(){
			const size = String(($('size').value||'16x16'));
			const [w,h] = size.split('x').map(v=>parseInt(v,10));
			grid = PixelDrawPure.create(w,h,16);
			render();
		}

		function render(){
			const cvs = $('c'); const ctx = cvs.getContext('2d');
			cvs.width = grid.meta.width * grid.meta.cellSize;
			cvs.height = grid.meta.height * grid.meta.cellSize;
			PixelDrawPure.renderToCanvas(ctx, grid);
			// grid lines
			ctx.strokeStyle = '#1f2d3c'; ctx.lineWidth = 1;
			for (let x=0; x<=grid.meta.width; x++){ ctx.beginPath(); ctx.moveTo(x*grid.meta.cellSize,0); ctx.lineTo(x*grid.meta.cellSize,cvs.height); ctx.stroke(); }
			for (let y=0; y<=grid.meta.height; y++){ ctx.beginPath(); ctx.moveTo(0,y*grid.meta.cellSize); ctx.lineTo(cvs.width,y*grid.meta.cellSize); ctx.stroke(); }
			$('out').textContent = JSON.stringify(PixelDrawPure.exportJSON(grid), null, 2);
		}

		function canvasClick(e){
			const rect = e.target.getBoundingClientRect();
			const sx = Math.floor((e.clientX - rect.left) / grid.meta.cellSize);
			const sy = Math.floor((e.clientY - rect.top) / grid.meta.cellSize);
			PixelDrawPure.setColor(grid, sx, sy, currentColor);
			render();
		}

		function download(filename, text) {
			const a = document.createElement('a');
			a.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
			a.setAttribute('download', filename);
			a.style.display = 'none';
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
		}

		function exportJSON(){
			const payload = JSON.stringify(PixelDrawPure.exportJSON(grid), null, 2);
			download('pixel_sprite.json', payload);
		}

		function remixAsset(){
			// Fork current grid as a remix
			const remixGrid = JSON.parse(JSON.stringify(grid));
			remixGrid.meta.remix = true;
			remixGrid.meta.original = 'pixel_sprite';
			remixGrid.meta.remixId = `remix_${Date.now()}`;
			
			// Update the current grid to the remix
			grid = remixGrid;
			render();
			
			// Show remix info
			$('out').textContent = JSON.stringify(PixelDrawPure.exportJSON(grid), null, 2);
			console.log('🎨 Asset remixed! Edit and export as new asset.');
		}

		function exportToGodot(){
			// Create a simple world manifest for this sprite
			const worldManifest = {
				schema: "miff.world.v1",
				version: "1.0.0",
				zones: [{
					id: "sprite_zone",
					name: "Sprite Zone",
					width: grid.meta.width,
					height: grid.meta.height,
					tiles: [],
					metadata: { style: "pixel-topdown", generated: false }
				}],
				metadata: { title: "Pixel Sprite", created: new Date().toISOString() }
			};
			
			// Add tiles for each colored cell
			for (let y = 0; y < grid.meta.height; y++) {
				for (let x = 0; x < grid.meta.width; x++) {
					const color = PixelDrawPure.getColor(grid, x, y);
					if (color) {
						worldManifest.zones[0].tiles.push({
							x, y, assetId: `pixel_${color.replace('#', '')}`, layer: 1
						});
					}
				}
			}
			
			// Convert to Godot scene JSON
			const godotScene = {
				scene: {
					name: "PixelSprite",
					type: "Node2D",
					children: worldManifest.zones.map(zone => ({
						name: zone.name,
						type: "Node2D",
						children: zone.tiles.map(tile => ({
							name: `tile_${tile.x}_${tile.y}`,
							type: "Sprite2D",
							properties: {
								texture: `res://assets/${tile.assetId}.png`,
								position: { x: tile.x * 16, y: tile.y * 16 },
								z_index: tile.layer
							}
						}))
					}))
				}
			};
			
			download('godot_scene.json', JSON.stringify(godotScene, null, 2));
			console.log('🎮 Godot scene exported!');
		}

		window.addEventListener('DOMContentLoaded', ()=>{
			$('size').addEventListener('change', resize);
			$('color').addEventListener('input', ()=>{ currentColor = $('color').value; });
			$('c').addEventListener('click', canvasClick);
			$('btn-export-json').addEventListener('click', exportJSON);
			$('btn-remix').addEventListener('click', remixAsset);
			$('btn-export-godot').addEventListener('click', exportToGodot);
			render();
		});
	</script>
</head>
<body>
	<header>
		<strong>MIFF Studio — Pixel Draw</strong>
		<nav class="toolbar">
			<a href="./index.html" style="color:#58a6ff;text-decoration:none">Studio Home</a>
		</nav>
	</header>
	<div class="wrap">
		<aside class="panel">
			<h3>Controls</h3>
			<div class="content">
				<div class="kv"><label>Size</label><select id="size"><option>16x16</option><option>32x32</option><option>64x64</option></select></div>
				<div class="kv"><label>Color</label><input id="color" type="color" value="#58a6ff" /></div>
				<div class="toolbar" style="margin-top:8px">
					<button id="btn-export-json">Export JSON</button>
					<button id="btn-remix">Remix Asset</button>
					<button id="btn-export-godot">Export to Godot</button>
				</div>
				<details style="margin-top:8px"><summary>Output</summary><pre id="out"></pre></details>
			</div>
		</aside>
		<main class="panel">
			<h3>Canvas</h3>
			<div class="content">
				<canvas id="c" width="256" height="256"></canvas>
			</div>
		</main>
	</div>
</body>
</html>

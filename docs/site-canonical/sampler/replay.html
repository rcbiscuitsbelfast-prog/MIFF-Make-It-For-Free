<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Sampler — Replay Viewer</title>
  <style>
    body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222;background:#0f1116;position:sticky;top:0;z-index:10}
    .wrap{padding:12px;display:grid;grid-template-columns:300px 1fr;gap:12px}
    .panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622}
    .panel h3{margin:0;padding:10px;border-bottom:1px solid #1f2d3c}
    .panel .content{padding:10px}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
    input[type="text"],select{width:100%;background:#0b1320;border:1px solid #2b3b4f;color:#e6edf3;border-radius:6px;padding:6px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    canvas{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px}
    pre{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px;padding:8px;max-height:260px;overflow:auto}
  </style>
  <script type="module">
    const $ = (id)=>document.getElementById(id);
    let replayData = [];
    let replayIndex = 0;
    let isPlaying = false;
    let replayInterval = null;
    let netState = new Map();

    function loadReplay() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            replayData = data.frames || [];
            replayIndex = 0;
            netState.clear();
            $('replay-info').textContent = `Loaded: ${replayData.length} frames`;
            console.log('📼 Replay loaded:', replayData.length, 'frames');
          } catch (error) {
            console.error('Failed to load replay:', error);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function playReplay() {
      if (replayData.length === 0) return;
      isPlaying = true;
      $('btn-play').disabled = true;
      $('btn-pause').disabled = false;
      $('btn-step').disabled = false;
      $('btn-rewind').disabled = false;
      
      replayInterval = setInterval(() => {
        if (replayIndex < replayData.length) {
          const frame = replayData[replayIndex];
          for (const player of frame.players || []) {
            netState.set(player.playerId, player);
          }
          replayIndex++;
          $('frame-info').textContent = `Frame: ${replayIndex}/${replayData.length}`;
        } else {
          pauseReplay();
        }
      }, 100);
    }

    function pauseReplay() {
      isPlaying = false;
      if (replayInterval) {
        clearInterval(replayInterval);
        replayInterval = null;
      }
      $('btn-play').disabled = false;
      $('btn-pause').disabled = true;
    }

    function stepReplay() {
      if (replayIndex < replayData.length) {
        const frame = replayData[replayIndex];
        for (const player of frame.players || []) {
          netState.set(player.playerId, player);
        }
        replayIndex++;
        $('frame-info').textContent = `Frame: ${replayIndex}/${replayData.length}`;
      }
    }

    function rewindReplay() {
      replayIndex = 0;
      netState.clear();
      $('frame-info').textContent = `Frame: 0/${replayData.length}`;
    }

    function render() {
      const cvs = $('canvas');
      const ctx = cvs.getContext('2d');
      cvs.width = 640;
      cvs.height = 320;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      
      // Render players
      for (const [id, p] of netState) {
        ctx.fillStyle = id === 'p1' ? '#58a6ff' : '#2ea043';
        ctx.fillRect(80 + p.position.x * 0.1, 150 + p.position.y * 0.1, 16, 16);
      }
      
      // Render frame info
      ctx.fillStyle = '#e6edf3';
      ctx.font = '14px system-ui';
      ctx.fillText(`Frame: ${replayIndex}/${replayData.length}`, 10, 30);
    }

    function loop() {
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('DOMContentLoaded', () => {
      $('btn-load').addEventListener('click', loadReplay);
      $('btn-play').addEventListener('click', playReplay);
      $('btn-pause').addEventListener('click', pauseReplay);
      $('btn-step').addEventListener('click', stepReplay);
      $('btn-rewind').addEventListener('click', rewindReplay);
      loop();
    });
  </script>
</head>
<body>
  <header>
    <strong>MIFF Sampler — Replay Viewer</strong>
    <nav class="toolbar">
      <a href="../index.html" style="color:#58a6ff;text-decoration:none">Sampler Home</a>
      <a href="../studio/multiplayer.html" style="color:#58a6ff;text-decoration:none">Studio Multiplayer</a>
    </nav>
  </header>
  <div class="wrap">
    <aside class="panel">
      <h3>Replay Controls</h3>
      <div class="content">
        <div class="toolbar">
          <button id="btn-load">Load Replay</button>
        </div>
        <div style="margin-top:8px;font-size:12px;color:#a9b8c6">
          <div id="replay-info">No replay loaded</div>
          <div id="frame-info">Frame: 0/0</div>
        </div>
        <div class="toolbar" style="margin-top:12px">
          <button id="btn-play" disabled>Play</button>
          <button id="btn-pause" disabled>Pause</button>
          <button id="btn-step" disabled>Step</button>
          <button id="btn-rewind" disabled>Rewind</button>
        </div>
        <div style="margin-top:12px;font-size:12px;color:#a9b8c6">
          <p>Load a replay manifest from Studio Multiplayer to visualize session playback.</p>
        </div>
      </div>
    </aside>
    <main class="panel">
      <h3>Replay Visualization</h3>
      <div class="content">
        <canvas id="canvas" width="640" height="320"></canvas>
        <div style="margin-top:8px;font-size:12px;color:#a9b8c6">
          Blue: Player 1, Green: Player 2
        </div>
      </div>
    </main>
  </div>
</body>
</html>

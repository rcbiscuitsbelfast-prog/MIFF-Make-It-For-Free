<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenderWorld Hub - 3D Interactive Experience</title>
    <meta name="description" content="Immersive 3D warehouse hub with portals to MIFF game worlds. Experience modular 3D characters, interactive environments, and seamless game navigation.">
    <meta name="keywords" content="RenderWorld, 3D hub, interactive environment, game portals, 3D NPCs, modular characters">
    <meta name="author" content="MIFF Team">
    
    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0f;
            color: #ffffff;
            overflow: hidden;
            cursor: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            background: #0a0a0f;
            touch-action: none;
        }

        /* HUD Elements */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Mobile HUD Top Bar */
        .mobile-hud-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 999;
            font-family: 'JetBrains Mono', monospace;
        }

        .hud-section {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .hud-icon {
            font-size: 16px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .hud-content {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .hud-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hud-value {
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            color: #ffffff;
        }

        /* Specific HUD section colors */
        .position-indicator .hud-value {
            color: #00ff88;
        }

        .spirit-status .hud-value {
            color: #00ffff;
        }

        .spirit-status.held .hud-value {
            color: #ffbf00;
            animation: pulse 1s infinite;
        }

        .fps-counter .hud-value {
            color: #ffffff;
        }

        .fps-counter.low-fps .hud-value {
            color: #ff6b6b;
        }

        .interaction-hints .hud-value {
            color: #ffbf00;
            font-size: 11px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Mobile Controls */
        .mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            display: none;
            pointer-events: auto;
        }

        .joystick-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
        }

        .joystick {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            position: relative;
            touch-action: none;
        }

        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            background: #00ff88;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
        }

        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Spirit Lens Button - Glowing cyan orb */
        .spirit-lens-btn {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, rgba(0, 255, 255, 0.1) 70%, transparent 100%);
            border: 2px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .spirit-lens-btn .btn-glow {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #00ffff, transparent);
            animation: rotate 2s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Interact Button - Amber speech bubble */
        .interact-btn {
            background: rgba(255, 191, 0, 0.2);
            border: 2px solid #ffbf00;
            color: #ffbf00;
            box-shadow: 0 0 10px rgba(255, 191, 0, 0.3);
        }

        /* Jump Button - White upward arrow */
        .jump-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #ffffff;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .spirit-lens-btn:active {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .interact-btn:active {
            box-shadow: 0 0 20px rgba(255, 191, 0, 0.5);
            background: rgba(255, 191, 0, 0.3);
        }

        .jump-btn:active {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 1001;
        }

        .menu-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        /* View Toggle */
        .view-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 1001;
            font-size: 12px;
        }

        .view-toggle:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 1s ease-out;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-text {
            font-size: 1.5rem;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(0, 255, 136, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: #00ff88;
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-controls {
                display: block;
            }
            
            .hud-info {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-logo">
                <svg width="80" height="80" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M15 25 Q10 20 15 15 L35 15 Q40 20 35 25 Q30 30 25 25 Q20 30 15 25 Z"
                          fill="url(#logoGradient)" opacity="0.9"/>
                    <path d="M45 25 Q50 20 55 15 L75 15 Q80 20 75 25 Q70 30 65 25 Q60 30 55 25 Q50 30 45 25 Z"
                          fill="url(#logoGradient)" opacity="0.8"/>
                    <path d="M45 55 Q50 50 55 45 L75 45 Q80 50 75 55 Q70 60 65 55 Q60 60 55 55 Q50 60 45 55 Z"
                          fill="url(#logoGradient)" opacity="0.9"/>
                    <path d="M15 55 Q10 50 15 45 L35 45 Q40 50 35 55 Q30 60 25 55 Q20 60 15 55 Z"
                          fill="url(#logoGradient)" opacity="0.7"/>
                    <circle cx="40" cy="40" r="8" fill="url(#logoGradient)" opacity="0.5"/>
                </svg>
            </div>
            <div class="loading-text">RenderWorld Hub</div>
            <div class="loading-progress">
                <div id="loadingBar" class="loading-bar"></div>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div class="hud">
            <a href="../sampler/" id="backToMiff" class="mobile-hud-bar" style="height:40px; display:flex; align-items:center; gap:8px; text-decoration:none;">
                <span style="font-size:18px;">←</span>
                <span style="font-weight:600;">Back to MIFF Website</span>
            </a>
            <!-- Mobile HUD Top Bar -->
            <div class="mobile-hud-bar" id="mobileHudTop">
                <div class="hud-section position-indicator">
                    <div class="hud-icon">📍</div>
                    <div class="hud-content">
                        <div class="hud-label">Position</div>
                        <div class="hud-value" id="playerPosition">0, 0</div>
                    </div>
                </div>
                
                <div class="hud-section spirit-status">
                    <div class="hud-icon" id="spiritLensIcon">🔮</div>
                    <div class="hud-content">
                        <div class="hud-label">Spirit Lens</div>
                        <div class="hud-value" id="spiritLensStatus">Available</div>
                    </div>
                </div>
                
                <div class="hud-section fps-counter">
                    <div class="hud-icon">⚡</div>
                    <div class="hud-content">
                        <div class="hud-label">FPS</div>
                        <div class="hud-value" id="fpsCounter">60</div>
                    </div>
                </div>
                
                <div class="hud-section interaction-hints">
                    <div class="hud-icon">💡</div>
                    <div class="hud-content">
                        <div class="hud-label">Nearby</div>
                        <div class="hud-value" id="interactionHint">-</div>
                    </div>
                </div>
            </div>

            <!-- View Toggle -->
            <button class="view-toggle" id="viewToggle">Switch View</button>
            
            <!-- Menu Button -->
            <button class="menu-btn" id="menuBtn" title="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <div class="joystick-container">
                <div class="joystick" id="joystick">
                    <div class="joystick-knob" id="joystickKnob"></div>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn spirit-lens-btn" id="spiritLensBtn" title="Spirit Lens">
                    <div class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            <path d="M12 4v2M12 18v2M4 12h2M18 12h2" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <div class="btn-glow"></div>
                </button>
                <button class="action-btn interact-btn" id="interactBtn" title="Interact">
                    <div class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                </button>
                <button class="action-btn jump-btn" id="jumpBtn" title="Jump">
                    <div class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M7 14l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Touch Controls System -->
    <script src="../../renderworld/mobile_touch_controls.js"></script>
    
    <!-- Main RenderWorld Script -->
    <script src="renderworld.js"></script>
    <script>
      (function(){
        const back = document.getElementById('backToMiff');
        if (back) back.addEventListener('click', function(e){
          e.preventDefault();
          try { window.miffOverlay && window.miffOverlay.cleanup && window.miffOverlay.cleanup(); } catch {}
          window.location.href = '../sampler/';
        });
      })();
    </script>
</body>
</html>

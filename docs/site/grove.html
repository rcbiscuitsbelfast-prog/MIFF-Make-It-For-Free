<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🧙 Witcher Grove - MIFF Framework</title>
    <link rel="stylesheet" href="overlays/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a1322;
            color: #e6edf3;
            font-family: 'Times New Roman', serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            background: #0a1322;
            touch-action: none;
        }
        
        .zone-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .zone-header h1 {
            margin: 0;
            font-size: 18px;
            color: #58a6ff;
        }
        
        .zone-header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .back-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="zone-header">
            <h1>🧙 Witcher Grove</h1>
            <p>Environmental storytelling with NPC interactions</p>
        </div>
        <a href="index.html" class="back-button">← Back to MIFF</a>
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <script type="module" src="overlays/dispatcher.js"></script>
    <script type="module" src="overlays/footer.js"></script>
    <script type="module" src="overlays/OverlayManager.js"></script>
    <script type="module" src="overlays/SplashScreen.js"></script>
    <script type="module" src="overlays/StartMenu.js"></script>
    <script type="module" src="world/WorldViewRegistry.js"></script>
    <script type="module" src="world/MapGenerator.js"></script>
    <script type="module" src="world/TileGrid.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', function(){
        try {
            if (window.miffStartSequence){
                window.miffStartSequence({
                    duration: 1600,
                    title: 'GROVE',
                    subtitle: 'Explore the Isles',
                    themeClass: 'theme-medieval',
                    startMenu: { themeClass: 'theme-medieval' }
                });
            }
        } catch {}
    });
    </script>
    <script type="module" src="zones/witcher_grove/assets.js"></script>
    <script type="module" src="zones/witcher_grove/index.js"></script>
</body>
</html>

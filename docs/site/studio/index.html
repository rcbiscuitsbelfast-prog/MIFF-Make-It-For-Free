<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Studio</title>
  <link rel="stylesheet" href="studio.css?v=20250911" />
</head>
<body>
  <header class="studio-header">
    <h1>MIFF Studio</h1>
    <nav>
      <a href="./scene.html">Scene Builder</a>
      <a href="./sprite.html">Sprite Studio</a>
    </nav>
  </header>
  <main class="studio-main">
    <section>
      <p>Create and remix scenes, entities, sprites, and animations directly in your browser. Export remix-safe JSON and inject into runtime.</p>
      <div class="toolbar">
        <input type="text" id="prompt" placeholder="e.g. Add NPC named 'Elder' to Grove zone" style="width:60%" />
        <button id="runPrompt">Run Prompt</button>
        <input type="text" id="assetSearch" placeholder="Search assets…" style="width:30%" />
      </div>
      <div class="toolbar">
        <select id="worldSelect">
          <option value="">View World…</option>
          <option value="../toppler.html">Toppler</option>
          <option value="../spirit.html">Spirit</option>
          <option value="../grove.html">Grove</option>
        </select>
        <button id="openWorld">Open</button>
      </div>
      <div class="panel" style="position:relative; height:50vh; margin-top:8px;">
        <iframe id="worldFrame" style="position:absolute; inset:0; width:100%; height:100%; border:1px solid #1f2d3c" allowfullscreen></iframe>
      </div>
      <pre id="promptResult" style="background:#0e1a2a;border:1px solid #1f2d3c;border-radius:10px;padding:10px;overflow:auto"></pre>
    </section>
  </main>
  <script type="module">
    import { runPrompt, listAssets } from './asset_registry.js?v=20250911';
    document.getElementById('runPrompt').onclick = ()=>{
      const p = document.getElementById('prompt').value||'';
      const res = runPrompt(p);
      document.getElementById('promptResult').textContent = JSON.stringify({ result: res, assets:listAssets() }, null, 2);
    };
    const search = document.getElementById('assetSearch');
    search.addEventListener('input', ()=>{
      const q = (search.value||'').toLowerCase();
      const a = listAssets();
      const matches = {
        sprites: a.sprites.filter(s=> (s.name||'').toLowerCase().includes(q) || (s.tags||[]).join(',').toLowerCase().includes(q)),
        tiles: a.animations.filter(s=> false),
        templates: a.templates.filter(s=> (s.name||'').toLowerCase().includes(q) || (s.tags||[]).join(',').toLowerCase().includes(q))
      };
      document.getElementById('promptResult').textContent = JSON.stringify({ search:q, matches }, null, 2);
    });
    document.getElementById('openWorld').onclick = ()=>{ const s=document.getElementById('worldSelect'); const src=s&&s.value; const f=document.getElementById('worldFrame'); if (src){ f.src=src; } };
  </script>
  <script>
    (function(){
      function setLayout(){ const isMobile = window.matchMedia('(max-width: 900px)').matches || (navigator.userAgent||'').toLowerCase().includes('mobile'); document.documentElement.classList.toggle('mobile', !!isMobile); }
      window.addEventListener('resize', setLayout); setLayout();
    })();
  </script>
</body>
</html>

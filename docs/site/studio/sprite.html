<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Sprite Studio</title>
  <link rel="stylesheet" href="studio.css?v=20250911" />
</head>
<body>
  <header class="studio-header">
    <h1>Sprite Studio</h1>
    <nav>
      <a href="./index.html">Studio</a>
      <a href="./scene.html">Scene Builder</a>
    </nav>
  </header>
  <main class="studio-main">
    <div class="studio-grid">
      <aside class="panel">
        <h3>Layers</h3>
        <div class="toolbar"><button id="btn-add-layer">Add Layer</button><input type="file" id="file-import" accept="image/*" /></div>
        <div class="list" id="layerList"></div>
      </aside>
      <section class="panel">
        <div class="toolbar"><button id="tool-brush">Brush</button><button id="tool-erase">Erase</button><button id="tool-move">Move</button></div>
        <div class="canvas-wrap"><canvas id="drawCanvas"></canvas></div>
        <div class="export-bar"><button id="btn-export-sheet">Export Sprite Sheet</button><button id="btn-export-json">Export Anim JSON</button></div>
      </section>
      <aside class="panel">
        <h3>Timeline</h3>
        <div class="toolbar"><button id="btn-add-key">Add Keyframe</button><button id="btn-play">Play</button><button id="btn-stop">Stop</button></div>
        <div id="timeline"></div>
      </aside>
    </div>
  </main>
  <script type="module" src="sprite_studio.js?v=20250911"></script>
  <script>
    (function(){
      function setLayout(){ const isMobile = window.matchMedia('(max-width: 900px)').matches || (navigator.userAgent||'').toLowerCase().includes('mobile'); document.documentElement.classList.toggle('mobile', !!isMobile); }
      window.addEventListener('resize', setLayout); setLayout();
    })();
  </script>
</body>
</html>

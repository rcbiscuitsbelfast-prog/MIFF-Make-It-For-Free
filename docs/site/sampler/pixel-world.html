<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MIFF Sampler — Pixel World</title>
	<style>
		body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui}
		header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222;background:#0f1116;position:sticky;top:0;z-index:10}
		.wrap{padding:12px;display:grid;grid-template-columns:300px 1fr;gap:12px}
		.panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622}
		.panel h3{margin:0;padding:10px;border-bottom:1px solid #1f2d3c}
		.panel .content{padding:10px}
		.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
		canvas{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px}
	</style>
	<script type="module">
		const $ = (id)=>document.getElementById(id);
		let sprites = [];
		let worldData = null;
		let gridSize = 16;

		function loadSprite(){
			const input = document.createElement('input');
			input.type = 'file'; input.accept = 'application/json';
			input.onchange = (e)=>{
				const file = e.target.files?.[0]; if(!file) return;
				const reader = new FileReader(); reader.onload = ()=>{
					try{ const data = JSON.parse(reader.result); sprites.push(data); render(); }
					catch(err){ console.error('Failed to load sprite', err); }
				}; reader.readAsText(file);
			}; input.click();
		}

		async function loadDemoWorld(){
			try {
				// Adjusted path for GitHub Pages under docs/site
				const response = await fetch('../studio/presets/grove.json');
				worldData = await response.json();
				render();
			} catch(err) {
				console.error('Failed to load demo world', err);
			}
		}

		function render(){
			const cvs = $('c'); const ctx = cvs.getContext('2d');
			cvs.width = 640; cvs.height = 320; ctx.clearRect(0,0,cvs.width,cvs.height);
			// draw grid
			ctx.strokeStyle = '#1f2d3c'; ctx.lineWidth = 1;
			for (let x=0;x<=cvs.width;x+=gridSize){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cvs.height); ctx.stroke(); }
			for (let y=0;y<=cvs.height;y+=gridSize){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cvs.width,y); ctx.stroke(); }
			
			if (worldData) {
				// render world tiles
				const zone = worldData.zones?.[0] || worldData.zone || null;
				const tiles = zone?.tiles || worldData.tiles || [];
				for (const tile of tiles) {
					const x = tile.x * gridSize;
					const y = tile.y * gridSize;
					// Simple colored rectangles for different asset types
					const colors = {
						'tree': '#228B22', 'bush': '#32CD32', 'rock': '#696969', 
						'grass': '#90EE90'
					};
					const assetType = (tile.assetId||'').split('_')[1] || 'grass';
					ctx.fillStyle = colors[assetType] || '#888888';
					ctx.fillRect(x, y, gridSize, gridSize);
				}
			} else {
				// draw sprites (as colored pixels from JSON grid)
				let ox = 16, oy = 16;
				for (const s of sprites){
					const meta = s.meta || s.sprite?.meta; const cells = s.cells || s.sprite?.cells;
					if (!meta || !cells) continue;
					const cs = 2; // scale for sampler
					for (let y=0; y<meta.height; y++){
						for (let x=0; x<meta.width; x++){
							const c = cells[y*meta.width + x];
							if (c){ ctx.fillStyle = c; ctx.fillRect(ox + x*cs, oy + y*cs, cs, cs); }
						}
					}
					ox += meta.width*cs + 12;
				}
			}
		}

		window.addEventListener('DOMContentLoaded', ()=>{
			$('btn-load').addEventListener('click', loadSprite);
			$('btn-demo').addEventListener('click', loadDemoWorld);
			render();
		});
	</script>
</head>
<body>
	<header>
		<strong>MIFF Sampler — Pixel World</strong>
		<nav class="toolbar">
			<a href="index.html" style="color:#58a6ff;text-decoration:none">Sampler Home</a>
			<a href="../studio/pixel.html" style="color:#58a6ff;text-decoration:none">Pixel Studio</a>
		</nav>
	</header>
	<div class="wrap">
		<aside class="panel">
			<h3>Assets</h3>
			<div class="content">
		<div class="toolbar">
			<button id="btn-load">Load Pixel JSON</button>
			<button id="btn-demo">Load Demo World</button>
		</div>
		<p style="font-size:12px;color:#a9b8c6;margin-top:8px">Load JSON exported from Pixel Draw Studio or try the demo forest world.</p>
			</div>
		</aside>
		<main class="panel">
			<h3>World Preview</h3>
			<div class="content">
				<canvas id="c" width="640" height="320"></canvas>
			</div>
		</main>
	</div>
</body>
</html>

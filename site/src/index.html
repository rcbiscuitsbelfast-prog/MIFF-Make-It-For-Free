<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIFF Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { Launcher } from './launcher.tsx';
      const root = createRoot(document.getElementById('root'));
      root.render(React.createElement(Launcher));

      // JS Bridge: forward RenderPayload frames to embedded Godot iframe
      const godotIframe = () => document.querySelector('iframe');

      // External producers can post frames to the launcher window
      window.addEventListener('message', (ev) => {
        if (!ev?.data) return;
        const data = ev.data;
        // Accept frames as { type: 'MIFF_FRAME', frame } and forward to Godot
        if (data.type === 'MIFF_FRAME') {
          const target = godotIframe()?.contentWindow;
          if (target) target.postMessage({ type: 'MIFF_FRAME', frame: data.frame }, '*');
        }
      });

      // Expose a simple global for debugging
      window.MIFF_BRIDGE = {
        sendFrame(frame) {
          const target = godotIframe()?.contentWindow;
          if (target) target.postMessage({ type: 'MIFF_FRAME', frame }, '*');
        }
      };
    </script>
  </body>
  </html>

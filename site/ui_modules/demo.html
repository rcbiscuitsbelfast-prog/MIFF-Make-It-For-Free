<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Modules Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style> body{margin:0;background:#0f1116;color:#e6edf3;min-height:100vh} .playfield{position:relative;min-height:80vh} .toolbar{padding:12px} </style>
</head>
<body>
  <div class="toolbar">
    <button id="showMain" class="btn">Show Main Menu</button>
    <button id="showQuest" class="btn">Show Quest Log</button>
    <button id="showInv" class="btn">Show Inventory</button>
    <button id="showDial" class="btn">Show Dialogue</button>
    <button id="showPause" class="btn">Show Pause</button>
  </div>
  <div id="root" class="playfield"></div>

  <script type="module">
    import { createOverlayDispatcher } from '../overlays/dispatcher.js';
    import { MainMenu, QuestLog, InventoryGrid, DialogueBox, HUDBar, PauseMenu } from './index.js';

    const root = document.getElementById('root');
    const UI = createOverlayDispatcher(root);
    UI.useModule('HUD', HUDBar, { inputMode: 'Keyboard', info: 'Demo' });

    document.getElementById('showMain').onclick = ()=>{ UI.showIntro({ title: 'Demo Main Menu' }); UI.useModule('IntroModal', MainMenu, { title: 'Demo Main Menu', onAction: (id)=>{ if(id==='start'){ UI.hide('intro'); } } }); };
    document.getElementById('showQuest').onclick = ()=>{ UI.showLore({ title: 'Quest Log' }); UI.useModule('LoreModal', QuestLog, { entries: ['Find the Grove','Tame the Spirit','Conquer the Isles'] }); };
    document.getElementById('showInv').onclick = ()=>{ UI.showLore({ title: 'Inventory' }); UI.useModule('LoreModal', InventoryGrid, { size: 12, items: [{label:'Herb'},{label:'Key'}] }); };
    document.getElementById('showDial').onclick = ()=>{ UI.showLore({ title: 'Dialogue' }); UI.useModule('LoreModal', DialogueBox, { speaker: 'Elder', text: 'Welcome, traveler.' }); };
    document.getElementById('showPause').onclick = ()=>{ UI.showGameOver({ title: 'Paused', message: 'Demo state' }); UI.useModule('GameOverModal', PauseMenu, { title: 'Paused', onResume: ()=>UI.hide('gameover'), onRestart: ()=>location.reload() }); };
  </script>
</body>
</html>

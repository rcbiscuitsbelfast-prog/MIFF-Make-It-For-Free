<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Modules Demo</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="UI Modules Demo - Part of the MIFF Framework. Explore game development tools, demos, and documentation.">
    <meta name="keywords" content="MIFF, game framework, TypeScript, game development">
    <meta property="og:title" content="UI Modules Demo">
    <meta property="og:description" content="UI Modules Demo - Part of the MIFF Framework. Explore game development tools, demos, and documentation.">
    <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css" />
  <style> body{margin:0;background:#0f1116;color:#e6edf3;min-height:100vh} .playfield{position:relative;min-height:80vh} .toolbar{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center} label{opacity:.8} select{background:#21262d;color:#e6edf3;border:1px solid #30363d;padding:6px 10px;border-radius:4px} </style>
</head>
<body>
  <div class="toolbar">
    <button id="showMain" class="btn">Show Main Menu</button>
    <button id="showQuest" class="btn">Show Quest Log</button>
    <button id="showInv" class="btn">Show Inventory</button>
    <button id="showDial" class="btn">Show Dialogue</button>
    <button id="showPause" class="btn">Show Pause</button>
    <label for="styleSel">UI Style:</label>
    <select id="styleSel">
      <option value="default">default</option>
      <option value="minimal">minimal</option>
      <option value="fantasy">fantasy</option>
      <option value="sciFi">sciFi</option>
    </select>
  </div>
  <div id="root" class="playfield"></div>

  <script type="module">
    import { createOverlayDispatcher } from '../overlays/dispatcher.js';
    import { MainMenu, QuestLog, InventoryGrid, DialogueBox, HUDBar, PauseMenu } from './index.js';
    import { UI_STYLES } from './style_presets.js';

    const root = document.getElementById('root');
    const UI = createOverlayDispatcher(root);

    // Load last style
    const saved = localStorage.getItem('miff_ui_style') || 'default';
    const styleSel = document.getElementById('styleSel');
    styleSel.value = saved;
    UI.setDefaultStyle && UI.setDefaultStyle(UI_STYLES[saved]);

    styleSel.onchange = () => {
      const key = styleSel.value;
      localStorage.setItem('miff_ui_style', key);
      UI.setDefaultStyle && UI.setDefaultStyle(UI_STYLES[key]);
    };

    UI.useModule('HUD', HUDBar, { inputMode: 'Keyboard', info: 'Demo', style: UI_STYLES[saved] });

    document.getElementById('showMain').onclick = ()=>{ UI.showIntro({ title: 'Demo Main Menu' }); UI.useModule('IntroModal', MainMenu, { title: 'Demo Main Menu', style: UI_STYLES[styleSel.value], onAction: (id)=>{ if(id==='start'){ UI.hide('intro'); } } }); };
    document.getElementById('showQuest').onclick = ()=>{ UI.showLore({ title: 'Quest Log' }); UI.useModule('LoreModal', QuestLog, { entries: ['Find the Grove','Tame the Spirit','Conquer the Isles'], style: UI_STYLES[styleSel.value] }); };
    document.getElementById('showInv').onclick = ()=>{ UI.showLore({ title: 'Inventory' }); UI.useModule('LoreModal', InventoryGrid, { size: 12, items: [{label:'Herb'},{label:'Key'}], style: UI_STYLES[styleSel.value] }); };
    document.getElementById('showDial').onclick = ()=>{ UI.showLore({ title: 'Dialogue' }); UI.useModule('LoreModal', DialogueBox, { speaker: 'Elder', text: 'Welcome, traveler.', style: UI_STYLES[styleSel.value] }); };
    document.getElementById('showPause').onclick = ()=>{ UI.showGameOver({ title: 'Paused', message: 'Demo state' }); UI.useModule('GameOverModal', PauseMenu, { title: 'Paused', style: UI_STYLES[styleSel.value], onResume: ()=>UI.hide('gameover'), onRestart: ()=>location.reload() }); };
  </script>
</body>
</html>

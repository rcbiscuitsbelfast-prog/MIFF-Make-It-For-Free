<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Studio — Multiplayer Preview</title>
  <style>
    body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222;background:#0f1116;position:sticky;top:0;z-index:10}
    .wrap{padding:12px;display:grid;grid-template-columns:300px 1fr;gap:12px}
    .panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622}
    .panel h3{margin:0;padding:10px;border-bottom:1px solid #1f2d3c}
    .panel .content{padding:10px}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
    input[type="text"],select{width:100%;background:#0b1320;border:1px solid #2b3b4f;color:#e6edf3;border-radius:6px;padding:6px}
    canvas{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px}
    .warn{position:fixed;right:12px;bottom:12px;background:#2b1520;border:1px solid #5a1a2a;color:#ff9ba3;padding:10px 12px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.4);display:none;z-index:20}
  </style>
  <script type="module">
    import { PlayerStatePure } from '../../miff/pure/PlayerStatePure/index.ts';
    import { ZoneServerPure } from '../../miff/pure/ZoneServerPure/index.ts';
    import { SessionManifestPure } from '../../miff/pure/SessionManifestPure/index.ts';
    import { WebSocketBridgePure } from '../../miff/pure/WebSocketBridgePure/index.ts';

    const $ = (id)=>document.getElementById(id);
    let server = new ZoneServerPure({ zone:'toppler' });
    let bridge = new WebSocketBridgePure();
    let isConnected = false;

    function updateStatus(status, clientCount = 0) {
      $('status').textContent = status;
      $('client-count').textContent = clientCount.toString();
    }

    function loadPreset(path){
      fetch(path).then(r=>r.json()).then(m=>{
        const v = SessionManifestPure.validate(m); if(!v.ok){ alert('Invalid preset'); return; }
        server = new ZoneServerPure({ zone: m.zone });
        
        const useRealWebSocket = $('websocket-mode').value === 'realtime';
        const serverUrl = $('server-url').value;
        
        bridge = new WebSocketBridgePure({ 
          useRealWebSocket,
          serverUrl: useRealWebSocket ? serverUrl : undefined
        });
        server.setBridge(bridge);
        m.players.forEach(p=>{ server.addPlayer(PlayerStatePure.create(p.playerId, p.avatar, p.style)); });
        
        // Listen for network updates
        bridge.onMessage((ch, payload)=>{
          if (payload.type === 'state-delta') {
            console.log('📡 Network update:', payload.players.length, 'players');
          }
        });
      }).catch(()=>{});
    }

    async function connect() {
      if (isConnected) return;
      
      try {
        const useRealWebSocket = $('websocket-mode').value === 'realtime';
        const serverUrl = $('server-url').value;
        
        bridge = new WebSocketBridgePure({ 
          useRealWebSocket,
          serverUrl: useRealWebSocket ? serverUrl : undefined
        });
        
        await bridge.connect();
        isConnected = true;
        updateStatus(useRealWebSocket ? 'Connected (WebSocket)' : 'Connected (Simulation)');
        
        // Listen for network updates
        bridge.onMessage((ch, payload)=>{
          if (payload.type === 'state-delta') {
            console.log('📡 Network update:', payload.players.length, 'players');
          }
        });
        
        server.setBridge(bridge);
      } catch (error) {
        console.error('Connection failed:', error);
        updateStatus('Connection Failed');
      }
    }

    function disconnect() {
      if (!isConnected) return;
      
      bridge.close();
      isConnected = false;
      updateStatus('Disconnected');
    }

    let tracing = false;
    const trace: any[] = [];
    let overThresholdStreak = 0;
    const thresholdMs = 10;
    const thresholdFrames = 60;

    function download(filename, text) {
      const a = document.createElement('a');
      a.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
      a.setAttribute('download', filename);
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function loop(){
      const cvs = $('c'); const ctx = cvs.getContext('2d'); cvs.width=640; cvs.height=320;
      const netState = new Map();
      // maintain netState from bridge
      bridge.onMessage((ch, payload)=>{
        if (payload.type === 'state-delta') {
          for (const p of payload.players){ netState.set(p.playerId, p); }
        }
      });
      function frame(){ server.tick(); ctx.clearRect(0,0,cvs.width,cvs.height);
        for (const [id,p] of netState){ ctx.fillStyle = id==='p1' ? '#58a6ff' : '#2ea043'; ctx.fillRect(80+p.position.x*0.1, 150+p.position.y*0.1, 16, 16); }
        // Update perf HUD
        const perf = server.getPerfSnapshot ? server.getPerfSnapshot() : null;
        if (perf) {
          $('perf-avg-dt').textContent = perf.avgDtMs.toFixed(2);
          $('perf-avg-tick').textContent = perf.avgTickMs.toFixed(2);
          $('perf-max-tick').textContent = perf.maxTickMs.toFixed(2);
          $('perf-min-tick').textContent = perf.minTickMs.toFixed(2);
          $('perf-ticks').textContent = String(perf.ticks);
          $('perf-players').textContent = String(perf.playersSimulatedLast);
          if (tracing) {
            trace.push({ t: Date.now(), perf });
          }
          // Perf warning logic
          if (perf.avgTickMs > thresholdMs) {
            overThresholdStreak++;
          } else {
            overThresholdStreak = 0;
          }
          const warnEl = $('perf-warn');
          if (overThresholdStreak > thresholdFrames) {
            warnEl.style.display = 'block';
          } else if (warnEl.style.display !== 'none' && overThresholdStreak === 0) {
            warnEl.style.display = 'none';
          }
        }
        requestAnimationFrame(frame);
      }
      frame();
    }

    window.addEventListener('DOMContentLoaded', ()=>{
      $('preset').addEventListener('change', ()=>{ const v=$('preset').value; if(v) loadPreset(v); });
      $('btn-connect').addEventListener('click', connect);
      $('btn-disconnect').addEventListener('click', disconnect);
      $('btn-trace-toggle').addEventListener('click', ()=>{
        tracing = !tracing;
        $('btn-trace-toggle').textContent = tracing ? 'Stop Trace' : 'Start Trace';
      });
      $('btn-trace-download').addEventListener('click', ()=>{
        const payload = JSON.stringify({ schema: 'miff.perf.trace.v1', frames: trace }, null, 2);
        download('miff_perf_trace.json', payload);
      });
      $('trace-file').addEventListener('change', (e)=>{
        const file = (e.target as HTMLInputElement).files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{
          try {
            const data = JSON.parse(String(reader.result));
            const frames = Array.isArray(data.frames) ? data.frames : [];
            const cvs = $('trace-canvas') as HTMLCanvasElement; const ctx = cvs.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0,0,cvs.width,cvs.height);
            // Find max for scaling
            let maxVal = 0;
            for (const f of frames){
              if (f.perf) {
                maxVal = Math.max(maxVal, f.perf.maxTickMs || 0, f.perf.avgTickMs || 0, f.perf.minTickMs || 0);
              }
            }
            const pad = 6; const w = cvs.width - pad*2; const h = cvs.height - pad*2;
            function y(v){ return pad + h - (h * (v / (maxVal || 1))); }
            function x(i){ return pad + (w * (i / Math.max(1, frames.length-1))); }
            // Grid
            ctx.strokeStyle = '#182231'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, pad+h); ctx.lineTo(pad+w, pad+h); ctx.stroke();
            // Draw series helper
            function drawSeries(key, color){
              ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
              let started = false; let i = 0;
              for (const f of frames){
                const v = f?.perf?.[key];
                if (typeof v !== 'number') { i++; continue; }
                const px = x(i); const py = y(v);
                if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
                i++;
              }
              ctx.stroke();
            }
            drawSeries('minTickMs', '#2ea043');
            drawSeries('avgTickMs', '#58a6ff');
            drawSeries('maxTickMs', '#f85149');
          } catch {}
        };
        reader.readAsText(file);
      });
      loadPreset('../../presets/sessions/duel.json');
      loop();
    });
  </script>
</head>
<body>
  <header>
    <strong>MIFF Studio — Multiplayer Preview</strong>
    <nav><a href="./index.html" style="color:#58a6ff;text-decoration:none">Studio Home</a></nav>
  </header>
  <div class="wrap">
    <aside class="panel">
      <h3>Session</h3>
      <div class="content">
        <div class="kv"><label>Preset</label>
          <select id="preset">
            <option value="../../presets/sessions/duel.json">Duel</option>
            <option value="../../presets/sessions/co-op.json">Co-op</option>
          </select>
        </div>
        <div class="kv"><label>WebSocket</label>
          <select id="websocket-mode">
            <option value="simulation">Simulation (Local)</option>
            <option value="realtime">Real-time (WebSocket)</option>
          </select>
        </div>
        <div class="kv"><label>Server URL</label>
          <input id="server-url" type="text" value="ws://localhost:8080" placeholder="ws://localhost:8080" />
        </div>
        <div class="toolbar" style="margin-top:8px">
          <button id="btn-connect">Connect</button>
          <button id="btn-disconnect">Disconnect</button>
        </div>
        <div style="margin-top:8px;font-size:12px;color:#a9b8c6">
          <div>Status: <span id="status">Disconnected</span></div>
          <div>Clients: <span id="client-count">0</span></div>
        </div>
      </div>
    </aside>
    <main class="panel">
      <h3>Preview</h3>
      <div class="content">
        <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
          <canvas id="c" width="640" height="320"></canvas>
          <div style="min-width:220px;border:1px solid #1f2d3c;border-radius:8px;padding:8px;background:#0b1220">
            <div style="margin-bottom:6px;color:#a9b8c6">Performance</div>
            <div style="font-size:12px;line-height:1.6">
              <div>avg dt: <span id="perf-avg-dt">0</span> ms</div>
              <div>avg tick: <span id="perf-avg-tick">0</span> ms</div>
              <div>max tick: <span id="perf-max-tick">0</span> ms</div>
              <div>min tick: <span id="perf-min-tick">0</span> ms</div>
              <div>ticks: <span id="perf-ticks">0</span></div>
              <div>players: <span id="perf-players">0</span></div>
            </div>
            <div class="toolbar" style="margin-top:8px">
              <button id="btn-trace-toggle">Start Trace</button>
              <button id="btn-trace-download">Download</button>
            </div>
            <div style="margin-top:10px">
              <div style="margin-bottom:6px;color:#a9b8c6">Trace Viewer</div>
              <input id="trace-file" type="file" accept="application/json" />
              <canvas id="trace-canvas" width="280" height="120" style="margin-top:6px;background:#0a101a;border:1px solid #1f2d3c;border-radius:6px"></canvas>
              <div style="font-size:12px;color:#a9b8c6;margin-top:4px">Shows avg/min/max tick (ms) over time</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="perf-warn" class="warn">Performance warning: avg tick > 10 ms sustained</div>
</body>
</html>

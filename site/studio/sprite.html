<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MIFF Sprite Studio - Real-time Preview</title>
    <link rel="stylesheet" href="../overlays/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a1322;
            color: #e6edf3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #spriteStudio {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .toolbar {
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .toolbar button {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .toolbar button:hover {
            background: #58a6ff;
            border-color: #58a6ff;
        }
        
        .preview-container {
            flex: 1;
            position: relative;
            background: #0a1322;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #previewCanvas {
            background: #0a1322;
            border: 2px solid #58a6ff;
            border-radius: 8px;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .back-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        
        .sprite-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="spriteStudio">
        <div class="toolbar">
            <button onclick="loadSprite()">Load Sprite</button>
            <button onclick="playAnimation()">Play Animation</button>
            <button onclick="pauseAnimation()">Pause Animation</button>
            <button onclick="resetAnimation()">Reset Animation</button>
            <button onclick="exportSprite()">Export Sprite</button>
        </div>
        
        <div class="preview-container">
            <canvas id="previewCanvas" width="400" height="300"></canvas>
        </div>
        
        <div class="sprite-info">
            <h3>Sprite Info</h3>
            <p>Frames: <span id="frameCount">0</span></p>
            <p>Current Frame: <span id="currentFrame">0</span></p>
            <p>FPS: <span id="fps">0</span></p>
        </div>
        
        <a href="../index.html" class="back-button">← Back to MIFF</a>
    </div>
    
    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let currentFrame = 0;
        let frameCount = 0;
        let isPlaying = false;
        let lastTime = 0;
        let fps = 0;
        
        // Demo sprite data
        const demoSprites = [
            { name: 'Player', frames: 4, color: '#00ff88' },
            { name: 'Enemy', frames: 3, color: '#ff4444' },
            { name: 'Power-up', frames: 6, color: '#ffaa00' }
        ];
        
        function loadSprite() {
            const sprite = demoSprites[Math.floor(Math.random() * demoSprites.length)];
            frameCount = sprite.frames;
            currentFrame = 0;
            updateSpriteInfo();
            drawSprite(sprite);
        }
        
        function drawSprite(sprite) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sprite frame
            ctx.fillStyle = sprite.color;
            const size = 50;
            const x = canvas.width / 2 - size / 2;
            const y = canvas.height / 2 - size / 2;
            
            ctx.fillRect(x, y, size, size);
            
            // Add frame indicator
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px monospace';
            ctx.fillText(`Frame ${currentFrame + 1}/${frameCount}`, 10, 20);
        }
        
        function playAnimation() {
            if (!isPlaying) {
                isPlaying = true;
                animate();
            }
        }
        
        function pauseAnimation() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }
        
        function resetAnimation() {
            currentFrame = 0;
            updateSpriteInfo();
            drawSprite(demoSprites[0]);
        }
        
        function animate() {
            if (!isPlaying) return;
            
            const currentTime = Date.now();
            if (currentTime - lastTime >= 100) { // 10 FPS
                currentFrame = (currentFrame + 1) % frameCount;
                updateSpriteInfo();
                drawSprite(demoSprites[0]);
                lastTime = currentTime;
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        function updateSpriteInfo() {
            document.getElementById('frameCount').textContent = frameCount;
            document.getElementById('currentFrame').textContent = currentFrame + 1;
            document.getElementById('fps').textContent = isPlaying ? '10' : '0';
        }
        
        function exportSprite() {
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'sprite-export.png';
            link.href = dataURL;
            link.click();
        }
        
        // Initialize
        loadSprite();
    </script>
</body>
</html>

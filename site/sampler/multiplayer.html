<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Multiplayer Sampler</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="MIFF Multiplayer Sampler - Part of the MIFF Framework. Explore game development tools, demos, and documentation.">
    <meta name="keywords" content="MIFF, game framework, TypeScript, game development">
    <meta property="og:title" content="MIFF Multiplayer Sampler">
    <meta property="og:description" content="MIFF Multiplayer Sampler - Part of the MIFF Framework. Explore game development tools, demos, and documentation.">
    <meta property="og:type" content="website">

  <style>body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui}.wrap{padding:12px}.panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622;padding:10px}canvas{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px}</style>
  <script type="module">
    import { PlayerStatePure } from '../../miff/pure/PlayerStatePure/index.ts';
    import { ZoneServerPure } from '../../miff/pure/ZoneServerPure/index.ts';

    const cvs = document.getElementById('c');
    const ctx = cvs.getContext('2d');
    cvs.width=512; cvs.height=256;

    const server = new ZoneServerPure({ zone:'toppler' });
    const p1 = PlayerStatePure.create('p1','presets/avatars/barbarian.json','2d-side');
    const p2 = PlayerStatePure.create('p2','presets/avatars/mage.json','2d-side');
    server.addPlayer(p1); server.addPlayer(p2);

    function loop(){
      server.tick();
      ctx.clearRect(0,0,cvs.width,cvs.height);
      const snap = server.getSnapshot();
      for (const s of snap){ ctx.fillStyle = s.identity.playerId==='p1'? '#58a6ff':'#2ea043'; ctx.fillRect(100+s.position.x*0.1, 120+s.position.y*0.1, 16, 16); }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</head>
<body>
  <div class="wrap">
    <h1>🕹️ MIFF Multiplayer Sampler</h1>
    <div class="panel">
      <canvas id="c" width="512" height="256"></canvas>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Avatar Sampler</title>
  <style>
    body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui} .wrap{padding:12px}
    .panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622;padding:10px}
    canvas{background:#0b1220;border:1px solid #1f2d3c;border-radius:8px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  </style>
  <script type="module">
    import { AvatarSystemPure } from '../../miff/pure/AvatarSystemPure/index.ts';
    import { AvatarRendererWebPure } from '../../miff/pure/AvatarRendererWebPure/index.ts';

    const registry = {
      version: '1.0.0',
      items: [
        { id:'base_barbarian', remixSafety:'CC0', compatibility:['web','godot'], anchors:{ '3d:anchor_head':'/site/assets/avatars/placeholders/3d/anchor_head.png', '3d:anchor_torso':'/site/assets/avatars/placeholders/3d/anchor_torso.png', '3d:anchor_shirt':'/site/assets/avatars/placeholders/3d/anchor_shirt.png' } }
      ]
    };

    function render(){
      const manifest = { base:'barbarian', clothing:['tunic'], face:'neutral', style:'3d' };
      const resolved = AvatarSystemPure.resolve(manifest, { registry, style: '3d' });
      const cvs = document.getElementById('cvs'); const ctx = cvs.getContext('2d');
      cvs.width = 256; cvs.height = 256; ctx.clearRect(0,0,cvs.width,cvs.height);
      AvatarRendererWebPure.renderToCanvas(ctx, resolved);
      document.getElementById('out').textContent = JSON.stringify(resolved, null, 2);
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
  </head>
<body>
  <div class="wrap">
    <h1>🧬 MIFF Avatar Sampler</h1>
    <div class="panel">
      <div class="toolbar">
        <button onclick="location.reload()">Re-render</button>
        <a href="../index.html" class="btn">Sampler Home</a>
      </div>
      <div style="display:grid;grid-template-columns:280px 1fr;gap:12px;align-items:start;margin-top:10px">
        <canvas id="cvs" width="256" height="256"></canvas>
        <pre id="out" style="max-height:300px;overflow:auto"></pre>
      </div>
    </div>
  </div>
</body>
</html>

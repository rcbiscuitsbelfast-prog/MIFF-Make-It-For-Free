<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIFF Remix</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="MIFF Remix - Part of the MIFF Framework. Explore game development tools, demos, and documentation.">
    <meta name="keywords" content="MIFF, game framework, TypeScript, game development">
    <meta property="og:title" content="MIFF Remix">
    <meta property="og:description" content="MIFF Remix - Part of the MIFF Framework. Explore game development tools, demos, and documentation.">
    <meta property="og:type" content="website">

  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#0f1116;color:#e6edf3}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222;background:#0f1116;position:sticky;top:0;z-index:10}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .wrap{display:grid;grid-template-columns:280px 1fr 280px;gap:12px;padding:12px}
    .panel{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622}
    .panel h3{margin:0;padding:10px;border-bottom:1px solid #1f2d3c}
    .panel .content{padding:10px}
    .palette-btn{display:inline-block;margin:2px 4px;padding:6px 10px;border-radius:8px;border:1px solid #2b3b4f;background:#101a28;color:#e6edf3;cursor:pointer}
    .palette-btn.active{border-color:#58a6ff;background:#0f243d}
    canvas{background:#0b1220;display:block;width:100%;height:100%;}
    .grid-wrap{position:relative;height:70vh}
    .status{font-size:12px;color:#a9b8c6}
    .btn{border:1px solid #2b3b4f;background:#101a28;color:#e6edf3;border-radius:8px;padding:6px 10px;cursor:pointer}
    .btn.primary{border-color:#58a6ff;background:#0f243d}
    .list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
    .history{max-height:160px;overflow:auto;border:1px dashed #1f2d3c;padding:6px;border-radius:8px}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
    label{font-size:12px;color:#a9b8c6}
    input[type="number"],input[type="text"],select{width:100%;background:#0b1320;border:1px solid #2b3b4f;color:#e6edf3;border-radius:6px;padding:6px}
  </style>
</head>
<body>
  <header>
    <div style="display:flex;gap:10px;align-items:center"><strong>🧪 MIFF Remix</strong><span class="status" id="status">ready</span></div>
    <div class="toolbar">
      <button class="btn" id="undoBtn">Undo</button>
      <button class="btn" id="redoBtn">Redo</button>
      <button class="btn" id="saveBtn">Save Remix</button>
    </div>
  </header>
  <div class="wrap">
    <aside class="panel">
      <h3>Palette</h3>
      <div class="content">
        <div id="palette"></div>
        <hr style="border-color:#1f2d3c" />
        <div class="kv"><label>Tool</label>
          <div class="toolbar">
            <button id="tool-select" class="btn">Select</button>
            <button id="tool-add" class="btn">Add</button>
            <button id="tool-move" class="btn">Move</button>
          </div>
        </div>
        <div class="kv"><label>Snap to Grid</label><input id="snapToGrid" type="checkbox" checked /></div>
        <div class="kv"><label>Grid Size</label><input id="gridSize" type="number" value="32" min="4" step="4" /></div>
        <hr style="border-color:#1f2d3c" />
        <div>
          <h4 style="margin:6px 0">Assets</h4>
          <div id="assetList" class="list"></div>
        </div>
      </div>
    </aside>
    <main class="panel">
      <h3>Scene</h3>
      <div class="content">
        <div class="grid-wrap"><canvas id="sceneCanvas"></canvas></div>
      </div>
    </main>
    <aside class="panel">
      <h3>Properties</h3>
      <div class="content">
        <div class="kv"><label>Name</label><input id="prop-name" type="text" /></div>
        <div class="kv"><label>Type</label>
          <select id="prop-type"></select>
        </div>
        <div class="kv"><label>Tags</label><input id="prop-tags" type="text" placeholder="comma,separated" /></div>
        <div class="kv"><label>Behavior</label><input id="prop-behavior" type="text" placeholder="e.g. patrol, idle" /></div>
        <hr style="border-color:#1f2d3c" />
        <div>
          <h4 style="margin:6px 0">History</h4>
          <div id="history" class="history"></div>
        </div>
        <hr style="border-color:#1f2d3c" />
        <details>
          <summary>Export Preview</summary>
          <pre id="exportPreview" style="white-space:pre-wrap"></pre>
        </details>
      </div>
    </aside>
  </div>

  <script src="./remix.core.js"></script>
  <script>
    RemixCore.bootstrap({
      palette: [
        { id:'tree', name:'Tree' },
        { id:'chest', name:'Chest' },
        { id:'enemy', name:'Enemy' },
        { id:'path', name:'Path' },
        { id:'sprite', name:'Sprite' },
        { id:'tile', name:'Tile' }
      ],
      assetWhitelistPaths: [
        'site/maps/tile_manifest.json',
        'site/contrib/remix-packs/toppler_medieval/pack.json',
        'site/contrib/remix-packs/grove3d/pack.json',
        'site/contrib/remix-packs/spirit_tamer/pack.json'
      ],
      onSave(manifest){
        const pre = document.getElementById('exportPreview');
        pre.textContent = JSON.stringify(manifest, null, 2);
      }
    });

    document.getElementById('undoBtn').onclick = ()=> RemixCore.undo();
    document.getElementById('redoBtn').onclick = ()=> RemixCore.redo();
    document.getElementById('saveBtn').onclick = ()=> RemixCore.save();
  </script>
</body>
</html>

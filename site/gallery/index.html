<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MIFF Gallery Submission</title>
<style>
 body { font-family: system-ui, sans-serif; background: #0f1116; color: #e6edf3; margin: 0; }
 .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
 .card { background: rgba(255,255,255,0.05); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
 h1 { color: #58a6ff; font-size: 20px; }
 label { display:block; margin: 8px 0 4px; }
 input, textarea { width: 100%; background: #0f1116; border: 1px solid #30363d; color: #e6edf3; padding: 8px; border-radius: 8px; }
 .btn { background: #1f6feb; border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Remix Gallery Submission</h1>
  <div class="card">
    <p>Share your remixed zone! Submit screenshots, orchestration JSON, and credits.</p>
    <label>Zone Name</label>
    <input id="zoneName" placeholder="My Awesome Remix" />
    <label>Credits & Asset Sources</label>
    <textarea id="credits" rows="4" placeholder="List contributors and asset attributions (CC0/GPL/etc.)"></textarea>
    <label>Upload Screenshots</label>
    <input id="shots" type="file" accept="image/png" multiple />
    <label>Paste Orchestration JSON</label>
    <textarea id="orchestration" rows="6" placeholder="{ \"zone\": \"...\", ... }"></textarea>
    <div style="margin-top:10px">
      <button class="btn" id="btnSubmit">Submit (Local Preview)</button>
    </div>
  </div>
  <div id="preview" class="card" style="display:none">
    <h2>Preview</h2>
    <div id="meta"></div>
    <div id="shotsPreview" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <pre id="orchPreview" style="white-space:pre-wrap"></pre>
  </div>
</div>
<script>
(function(){
  const shots = document.getElementById('shots');
  const btn = document.getElementById('btnSubmit');
  btn.onclick = ()=>{
    const name = document.getElementById('zoneName').value.trim();
    const credits = document.getElementById('credits').value.trim();
    const orch = document.getElementById('orchestration').value.trim();
    document.getElementById('preview').style.display='block';
    document.getElementById('meta').textContent = `${name} — Credits: ${credits}`;
    document.getElementById('orchPreview').textContent = orch;
    const wrap = document.getElementById('shotsPreview'); wrap.innerHTML='';
    Array.from(shots.files||[]).forEach(f=>{ const img=document.createElement('img'); img.style.width='240px'; img.style.border='1px solid #30363d'; img.style.borderRadius='6px'; img.src = URL.createObjectURL(f); wrap.appendChild(img); });
  };
})();
</script>
</body>
</html>

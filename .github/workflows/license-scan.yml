name: License & Asset Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License check (Node deps)
        run: npx license-checker --production --json --out ./license-report.json || true
      - name: Scan assets folder for non-CC0/GPL
        run: |
          grep -RIl "(CC0|GPL)" miff/assets || true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: license-assets-report
          path: |
            license-report.json

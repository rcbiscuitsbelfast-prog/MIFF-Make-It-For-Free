name: Multiplayer CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'miff/pure/PlayerStatePure/**'
      - 'miff/pure/SessionManifestPure/**'
      - 'miff/pure/SyncManagerPure/**'
      - 'miff/pure/ZoneServerPure/**'
      - 'miff/pure/WebSocketBridgePure/**'
      - 'site/studio/multiplayer.html'
      - 'package.json'
      - 'jest.config.cjs'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'miff/pure/PlayerStatePure/**'
      - 'miff/pure/SessionManifestPure/**'
      - 'miff/pure/SyncManagerPure/**'
      - 'miff/pure/ZoneServerPure/**'
      - 'miff/pure/WebSocketBridgePure/**'
      - 'site/studio/multiplayer.html'
      - 'package.json'
      - 'jest.config.cjs'

jobs:
  mp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm i
      - name: Run multiplayer tests only
        run: npm run -s test:mp:ci


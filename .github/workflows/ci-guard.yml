name: CI Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install yamllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint
          sudo apt-get install -y jq
      
      - name: Validate workflow syntax
        run: |
          echo "🔍 Validating workflow files..."
          for workflow in .github/workflows/*.yml; do
            echo "Checking $workflow..."
            if ! yamllint "$workflow"; then
              echo "❌ YAML syntax error in $workflow"
              exit 1
            fi
            echo "✅ $workflow syntax OK"
          done

      - name: Lint Markdown front matter (docs and site)
        run: |
          echo "🔍 Linting Markdown front matter in docs and site..."
          sudo apt-get install -y ripgrep >/dev/null 2>&1 || true
          find docs site -type f \( -name "*.md" -o -name "*.astro" \) -print0 | xargs -0 -I {} bash -c '
            if head -1 "{}" | grep -q "^---$"; then
              awk "/^---$/{f=!f;next}f" "{}" | sed -n "1,/^---$/p" | sed "$ d" > /tmp/frontmatter.yml || true
              if [ -s /tmp/frontmatter.yml ]; then
                yamllint -d "{extends: default, rules: {line-length: disable}}" /tmp/frontmatter.yml || exit 1
              fi
            fi'
      
      - name: Check required workflows
        run: |
          echo "🔍 Checking required CI workflows..."
          required_workflows=("miff-ci.yml" "pages.yml")
          for workflow in "${required_workflows[@]}"; do
            if [ ! -f ".github/workflows/$workflow" ]; then
              echo "❌ Missing required workflow: $workflow"
              exit 1
            fi
            echo "✅ Found $workflow"
          done
      
      - name: Validate Jest config
        run: |
          echo "🔍 Validating Jest configuration..."
          if [ ! -f "jest.config.js" ]; then
            echo "❌ Missing jest.config.js"
            exit 1
          fi
          node -e "
            try {
              require('./jest.config.js');
              console.log('✅ Jest config syntax OK');
            } catch (e) {
              console.error('❌ Jest config error:', e.message);
              process.exit(1);
            }
          "
      
      - name: Validate TypeScript config
        run: |
          echo "🔍 Validating TypeScript configuration..."
          if [ ! -f "tsconfig.json" ]; then
            echo "❌ Missing tsconfig.json"
            exit 1
          fi
          npx typescript --version || npm i -g typescript@latest
          npx tsc --noEmit -p tsconfig.ci.json
          echo "✅ TypeScript config OK"
      
      - name: Check test coverage
        run: |
          echo "🔍 Checking test coverage..."
          test_dirs=("src" "miff" "games")
          for dir in "${test_dirs[@]}"; do
            if [ -d "$dir" ]; then
              test_count=$(find "$dir" -name "*.test.ts" -o -name "*.spec.ts" | wc -l)
              echo "📊 $dir: $test_count test files"
            fi
          done

      - name: Placeholder hygiene
        run: |
          echo "🔍 Scanning for placeholders and brittle defaults..."
          npm run -s lint:placeholders || true

      - name: Check merge conflict markers
        run: |
          echo "🔍 Checking for merge conflict markers..."
          if git grep -n "^<<<<<<<\|^=======\|^>>>>>>>" -- ":(exclude).git"; then
            echo "❌ Merge conflict markers found. Please resolve before merging."
            exit 1
          else
            echo "✅ No merge conflict markers detected"
          fi
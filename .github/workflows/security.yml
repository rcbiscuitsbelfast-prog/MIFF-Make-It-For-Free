# PAUSED TEMPORARILY - Will be re-enabled later
name: Security and Compliance

on:
  workflow_dispatch: # Manual trigger only while paused
#  push: #    branches: [ master, develop ]
#  pull_request: #    branches: [ master, develop ]
#  schedule: #    - cron: '0 6 * * *' # Daily at 6 AM UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: |
        echo "🔍 Running npm security audit..."
        npm audit --audit-level=moderate || echo "⚠️ Audit issues found but continuing"

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true

    - name: Check for vulnerabilities
      run: |
        echo "🔍 Analyzing dependency vulnerabilities..."
        if [ -f "package-lock.json" ]; then
          echo "✅ Package lock file exists"
        else
          echo "⚠️ No package-lock.json found"
        fi

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  permissions-check:
    name: Permissions and Access Control
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check GitHub token permissions
      run: |
        echo "🔍 Validating GitHub token permissions..."

        # Check if we have minimal required permissions
        if [ "${{ github.token }}" != "" ]; then
          echo "✅ GitHub token available"
        else
          echo "❌ GitHub token not available"
          exit 1
        fi

    - name: Validate workflow permissions
      run: |
        echo "🔍 Checking workflow security settings..."

        # List all workflow files
        workflows=$(find .github/workflows -name "*.yml" | wc -l)
        echo "📊 Found $workflows workflow files"

        # Check for potentially dangerous permissions
        dangerous_workflows=$(grep -l "contents: read" .github/workflows/*.yml | wc -l)
        if [ "$dangerous_workflows" -eq 0 ]; then
          echo "✅ No workflows with dangerous permissions found"
        else
          echo "⚠️ Found $dangerous_workflows workflows with write permissions"
        fi

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check license files
      run: |
        echo "🔍 Validating license compliance..."

        if [ -f "LICENSE" ] || [ -f "LICENSE.md" ]; then
          echo "✅ License file found"
          ls -la LICENSE*
        else
          echo "⚠️ No license file found"
        fi

    - name: Validate package licenses
      run: |
        if [ -f "package.json" ]; then
          echo "🔍 Checking package.json license field..."
          if grep -q '"license"' package.json; then
            echo "✅ License field found in package.json"
          else
            echo "⚠️ No license field in package.json"
          fi
        fi

  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
name: site-build

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Build site (static copy)
        run: |
          mkdir -p build/site
          rsync -a --exclude 'node_modules' --exclude '.git' site/ build/site/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miff-site
          path: build/site

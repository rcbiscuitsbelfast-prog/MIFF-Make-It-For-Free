name: GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install yamllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint

      - name: Lint YAML Front Matter
        run: |
          # Extract YAML front matter blocks and validate
          # Validate .astro and .md files that use front matter
          find docs/src -type f \( -name "*.astro" -o -name "*.md" \) -print0 | xargs -0 -I {} bash -c '
            if head -1 "{}" | grep -q "^---"; then
              # Extract the first YAML block delimited by --- ... ---
              sed -n "/^---$/,/^---$/p" "{}" | sed '1d;$d' > /tmp/frontmatter.yml || true
              if [ -s /tmp/frontmatter.yml ]; then
                yamllint -d "{extends: default, rules: {line-length: disable}}" /tmp/frontmatter.yml
              fi
            fi'

      - name: Build (noop for static docs)
        run: |
          echo "Build step placeholder"

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
name: Link Checker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-linux-x86_64.tar.gz -o lychee.tar.gz
          tar -xzf lychee.tar.gz
          sudo mv lychee /usr/local/bin/
      - name: Run link check
        run: |
          # Check site HTML files (where most content is)
          lychee --no-progress --verbose --accept 200,429,403 --exclude-mail \
            --base "https://rcbiscuitsbelfast-prog.github.io/MIFF-Make-It-For-Free/" \
            site/**/*.html docs/**/*.html || echo "Link check completed with warnings"
      - name: Upload link check report
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report-${{ github.sha }}
          path: .

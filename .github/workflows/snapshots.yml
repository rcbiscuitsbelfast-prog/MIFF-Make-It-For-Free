name: sampler-snapshots

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Export snapshots and replays
        run: node scripts/export-snapshots.js build/snapshots
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sampler-snapshots
          path: build/snapshots

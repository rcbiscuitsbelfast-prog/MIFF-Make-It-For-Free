name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Install dependencies
      run: |
        cd docs
        npm ci --legacy-peer-deps

    - name: Build with Astro
      run: |
        cd docs
        npm run build

    - name: Copy RenderWorld Hub
      run: |
        if [ -f "docs/renderworld-hub.js" ] && [ -f "docs/index.html" ]; then
          cp docs/renderworld-hub.js docs/dist/
          cp docs/index.html docs/dist/
          echo "✅ RenderWorld Hub files copied to dist"
        else
          echo "⚠️ RenderWorld Hub files not found"
        fi

    - name: Verify SplashScreenPure integration
      run: |
        if grep -q "miff-splash-screen" docs/dist/index.html; then
          echo "✅ SplashScreenPure integration detected"
        else
          echo "⚠️ SplashScreenPure integration not found"
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Verify GitHub Pages deployment
      run: |
        echo "🔍 Verifying GitHub Pages deployment..."
        if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
          echo "✅ GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"

          # Simple curl test to check if the site is accessible
          if command -v curl &> /dev/null; then
            echo "Testing site accessibility..."
            response=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}")
            if [ "$response" = "200" ]; then
              echo "✅ GitHub Pages site is accessible (HTTP 200)"
            else
              echo "⚠️ GitHub Pages site returned HTTP $response"
            fi
          fi
        else
          echo "⚠️ No GitHub Pages URL available"
        fi

  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./validation

    - name: Verify deployment files
      run: |
        echo "🔍 Validating deployment files..."

        # List all downloaded artifacts
        echo "Contents of validation directory:"
        ls -la validation/ || echo "Validation directory empty"

        # Find any artifact directories
        echo "Looking for artifact directories:"
        if [ -d "validation/github-pages" ]; then
          echo "📁 Found github-pages artifact directory"
          cd validation/github-pages
        elif [ -d "validation/artifact" ]; then
          echo "📁 Found artifact directory"
          cd validation/artifact
        else
          echo "📁 No specific artifact directory found, checking root validation directory"
          cd validation/
        fi

        # List contents of the artifact directory
        echo "Contents of artifact directory:"
        ls -la

        # Check for main documentation
        if [ -f "index.html" ]; then
          echo "✅ Main documentation found"
          echo "File size: $(stat -c%s index.html) bytes"

          # Verify SplashScreenPure integration
          if grep -q "miff-splash-screen" index.html; then
            echo "✅ SplashScreenPure integration verified"
          else
            echo "⚠️ SplashScreenPure integration missing"
          fi

          # Verify MIFF branding
          if grep -q "MIFF" index.html; then
            echo "✅ MIFF branding verified"
          else
            echo "⚠️ MIFF branding missing"
          fi

          # Check for other essential files
          echo "Checking for essential files:"
          if [ -f "renderworld-hub.js" ]; then
            echo "✅ RenderWorld Hub file found"
          else
            echo "⚠️ RenderWorld Hub file missing"
          fi

          echo "✅ Deployment validation completed successfully"

        elif [ -f "artifact.tar" ]; then
          echo "📦 Found artifact.tar - extracting..."
          tar -xf artifact.tar

          # Check again after extraction
          if [ -f "index.html" ]; then
            echo "✅ Main documentation found after extraction"

            if grep -q "miff-splash-screen" index.html; then
              echo "✅ SplashScreenPure integration verified"
            else
              echo "⚠️ SplashScreenPure integration missing"
            fi
          else
            echo "❌ Main documentation still missing after extraction"
            echo "Available files after extraction:"
            find . -type f | head -10
            exit 1
          fi

        else
          echo "❌ No expected files found"
          echo "Looking for alternative files..."

          # Check if there are any HTML files at all
          if find . -name "*.html" | grep -q .; then
            echo "✅ Found HTML files"
            find . -name "*.html" -exec basename {} \;
            echo "✅ Deployment validation completed successfully"
          else
            echo "❌ No HTML files found"
            echo "Available files:"
            find . -type f | head -10
            exit 1
          fi
        fi
name: jest-sharded

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - '**/*.ts'
      - 'jest.pure.config.cjs'
      - 'package.json'
      - 'scripts/jest-shard.js'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ '0/2', '1/2' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run Jest shard ${{ matrix.shard }}
        env:
          JEST_SHARD_INDEX: ${{ matrix.shard == '0/2' && 0 || 1 }}
          JEST_TOTAL_SHARDS: 2
        run: node scripts/jest-shard.js

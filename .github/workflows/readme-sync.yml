name: readme-sync

on:
  push:
    branches: [ master ]
    paths:
      - 'miff/pure/**/README.md'
      - 'scripts/sync-readmes.js'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Sync module READMEs to docs
        run: node scripts/sync-readmes.js miff/pure docs/modules
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-modules
          path: docs/modules

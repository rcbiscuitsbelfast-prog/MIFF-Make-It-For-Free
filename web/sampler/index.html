<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MIFF Sampler — Pixel City</title>
	<style>
		body{margin:0;background:#0f1116;color:#e6edf3;font-family:system-ui}
		header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222;background:#0f1116;position:sticky;top:0;z-index:10}
		.wrap{padding:12px;max-width:1200px;margin:0 auto}
		.zone-card{border:1px solid #1f2d3c;border-radius:10px;background:#0e1622;padding:16px;margin-bottom:12px}
		.zone-card h3{margin:0 0 8px 0;color:#58a6ff}
		.zone-card p{margin:0 0 12px 0;color:#a9b8c6;font-size:14px}
		.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
		.btn-primary{background:#238636;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:500}
		.btn-primary:hover{background:#2ea043}
	</style>
</head>
<body>
	<header>
		<strong>MIFF Sampler</strong>
	</header>
	<div class="wrap">
		<div class="zone-card">
			<h3>🌀 RenderWorld</h3>
			<p>Real-time MIFF-native renderer and hub.</p>
			<div class="card-actions">
				<a href="../renderworld/index.html" class="btn-primary" aria-label="Open RenderWorld">Open RenderWorld</a>
			</div>
		</div>
		<div class="zone-card">
			<h3>🏙️ Explore Pixel City</h3>
			<p>A procedurally generated world of retro characters, quests, and ambient effects</p>
			<div class="card-actions">
				<a href="../renderworld/index.html#pixel-city" class="btn-primary" aria-label="Enter Pixel World">Enter Pixel World</a>
			</div>
		</div>
	</div>
</body>

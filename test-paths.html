<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Path Test</title>
  <style>
    body { margin: 20px; font-family: monospace; background: #000; color: #fff; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #333; }
    .success { background: #002200; }
    .error { background: #220000; }
  </style>
</head>
<body>
  <h1>Path Verification Test</h1>
  <div id="results"></div>

  <script>
    const results = document.getElementById('results');
    
    const tests = [
      { name: '2D Side-Scrolling', url: 'docs/site/sampler/2d-side.html' },
      { name: '2D Top-Down', url: 'docs/site/sampler/2d-topdown.html' },
      { name: 'Runner', url: 'docs/site/sampler/runner.html' },
      { name: '3D Isometric', url: 'docs/site/sampler/3d-topdown.html' },
      { name: 'Static Overlay', url: 'docs/site/sampler/static-overlay.html' },
      { name: 'Godot 2D Side', url: 'docs/godot/sampler/2d-side.html' },
      { name: 'Preset 2D Side', url: 'docs/site/studio/presets/sampler-2d-side.json' },
      { name: 'Knight Asset', url: 'assets/KayKitAssets/knight_texture.png' }
    ];

    tests.forEach(test => {
      const div = document.createElement('div');
      div.className = 'test';
      div.textContent = `Testing ${test.name}...`;
      results.appendChild(div);

      fetch(test.url, { method: 'HEAD' })
        .then(response => {
          if (response.ok) {
            div.textContent = `✅ ${test.name} - OK`;
            div.className = 'test success';
          } else {
            div.textContent = `❌ ${test.name} - ${response.status}`;
            div.className = 'test error';
          }
        })
        .catch(error => {
          div.textContent = `❌ ${test.name} - ${error.message}`;
          div.className = 'test error';
        });
    });
  </script>
</body>
</html>
